<style>
:root{
  --bg:#EEF2F5; --card:#FFFFFF; --ink:#1B2437; --ink-2:#4A5568; --ink-3:#74808F; --line:#D9E0E8; --frame:#C9D2DC;
  --indigo:#2F4479; --indigo-2:#E4EAF7;
  --terrace:#3E7A34; --terrace-2:#E1F0DA;
  --alert:#E4571B; --alert-2:#FFF1E8;
  --gold:#C99A1E; --gold-2:#FFF4CC;
  --danger:#C62828;
  --soft:#F2F5F9;
  --band:#2F4479; --lcd-ink:#7DE0C0; --lcd-glow:rgba(125,224,192,.32); --lcd-dim:#7C8C9C; --lcd-amber:#FFB648; --lcd-amber-glow:rgba(255,182,72,.35); --lcd-red:#FF6B5B; --lcd-red-glow:rgba(255,107,91,.4);
  --indigo-ink:#FFFFFF; --dome:0 -2px 10px rgba(47,68,121,.18),0 6px 18px rgba(47,68,121,.34);
  --shadow:0 1px 2px rgba(27,36,55,.06),0 6px 16px rgba(27,36,55,.07);
  --lift:0 1px 2px rgba(27,36,55,.08),0 8px 20px rgba(27,36,55,.10);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141C; --card:#182030; --ink:#EEF2F7; --ink-2:#B7C2D0; --ink-3:#8593A5; --line:#2B3648; --frame:#05080D;
    --indigo:#9DB2EE; --indigo-2:#233150;
    --terrace:#86C96F; --terrace-2:#1F3322;
    --alert:#FF7A3D; --alert-2:#3A2415;
    --gold:#E2B94A; --gold-2:#3A2F12;
    --danger:#FF6B6B;
    --soft:#131A26;
    --band:#1E2C48; --lcd-ink:#6FD9B8; --lcd-glow:rgba(111,217,184,.3); --lcd-dim:#8496A6; --lcd-amber:#FFC062; --lcd-amber-glow:rgba(255,192,98,.32); --lcd-red:#FF7F70; --lcd-red-glow:rgba(255,127,112,.35);
    --indigo-ink:#101828; --dome:0 -2px 10px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
    --lift:0 1px 2px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0F141C; --card:#182030; --ink:#EEF2F7; --ink-2:#B7C2D0; --ink-3:#8593A5; --line:#2B3648; --frame:#05080D;
  --indigo:#9DB2EE; --indigo-2:#233150;
  --terrace:#86C96F; --terrace-2:#1F3322;
  --alert:#FF7A3D; --alert-2:#3A2415;
  --gold:#E2B94A; --gold-2:#3A2F12;
  --danger:#FF6B6B;
  --soft:#131A26;
  --band:#1E2C48; --lcd-ink:#6FD9B8; --lcd-glow:rgba(111,217,184,.3); --lcd-dim:#8496A6; --lcd-amber:#FFC062; --lcd-amber-glow:rgba(255,192,98,.32); --lcd-red:#FF7F70; --lcd-red-glow:rgba(255,127,112,.35);
  --indigo-ink:#101828; --dome:0 -2px 10px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
  --lift:0 1px 2px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.45);
}
html{font-size:16px;-webkit-text-size-adjust:100%;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
html[data-fs="lg"]{font-size:18px}
html[data-fs="xl"]{font-size:20px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;touch-action:pan-x pan-y;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;line-height:1.4;overscroll-behavior-y:contain}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,.in:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
a{color:var(--indigo)}
svg.i{width:1.25rem;height:1.25rem;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* 注意：overflow-x:hidden 會讓 .app 變成捲動容器、position:sticky 失效（標頭時鐘會被捲走）；clip 不會 */
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow-x:clip}
@media (min-width:640px){
  body{background:var(--frame)}
  .app{box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.28)}
}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0;padding-top:env(safe-area-inset-top)}
.top-r1{display:flex;align-items:center;gap:.25rem;padding:.35rem .5rem}
.trip-name{flex:1;min-width:0;font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.pen{width:20px;height:20px;border-radius:6px;border:1px dashed var(--ink-3);color:var(--ink-3);background:transparent;display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;padding:0;line-height:1;margin-right:.15rem}
.day-chip{font-size:11.5px;font-weight:900;border-radius:999px;padding:.1rem .5rem;white-space:nowrap;word-break:keep-all;flex-shrink:0;line-height:1.5;background:var(--indigo-2);color:var(--indigo);margin-right:.15rem}
.day-chip.warm{background:var(--alert-2);color:var(--alert)}
.day-chip.done{background:var(--terrace-2);color:var(--terrace)}
.top-r2{background:var(--band);display:flex;align-items:center;justify-content:center;padding:.22rem .5rem;min-height:26px}
.lcd{display:flex;align-items:baseline;gap:.3rem;background:rgba(0,0,0,.32);border-radius:8px;padding:.16rem .45rem .2rem;
  font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;max-width:100%;overflow:hidden}
.lcd .dot{width:.4rem;height:.4rem;border-radius:50%;background:var(--lcd-dim);flex-shrink:0;align-self:center}
.lcd .dot.on{background:var(--terrace)}
.lcd .dot.off{background:var(--alert)}
.lcd .sy{font-size:11px;font-weight:800;color:var(--lcd-dim);flex-shrink:0}
.lcd .lb{font-size:9.5px;font-weight:900;color:var(--lcd-dim);letter-spacing:.08em;flex-shrink:0}
.lcd .n{font-size:21px;font-weight:900;letter-spacing:-.01em;color:var(--lcd-ink);text-shadow:0 0 8px var(--lcd-glow);flex-shrink:0}
.lcd .tw{font-size:11px;font-weight:700;color:var(--lcd-dim);flex-shrink:0}
.lcd .dv{width:1px;height:13px;background:rgba(255,255,255,.16);align-self:center;margin:0 .05rem;flex-shrink:0}
.lcd .cd{font-size:11px;font-weight:900;color:var(--lcd-amber);text-shadow:0 0 8px var(--lcd-amber-glow);flex-shrink:0;letter-spacing:.01em}
.lcd .cd .k{font-size:9.5px;font-weight:900;color:var(--lcd-dim);letter-spacing:.06em;margin-right:.22rem;text-shadow:none}
.lcd .cd.late{color:var(--lcd-red);text-shadow:0 0 8px var(--lcd-red-glow)}
.lcd .cd.none{color:var(--lcd-dim);text-shadow:none}
/* 窄螢幕＋放大字級時（例如 320px 配特大字），面板外圍的 rem 間距會變大，四段容易被切掉；
   這裡整體縮一點，讓越南／台灣／集合倒數／連線狀態四段都還看得到，而不是把最後一段裁掉 */
@media (max-width:360px){
  html[data-fs="lg"] .lcd,html[data-fs="xl"] .lcd{gap:.18rem;padding-left:.3rem;padding-right:.3rem}
  html[data-fs="lg"] .lcd .n,html[data-fs="xl"] .lcd .n{font-size:18px}
  html[data-fs="lg"] .lcd .dv,html[data-fs="xl"] .lcd .dv{margin:0}
}
.sync .me{color:var(--ink);font-weight:900;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{position:relative;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:900;font-size:12px;padding:0;line-height:1}
.icon-btn svg.i{width:17px;height:17px}
.top-r1 .icon-btn::before,.pen::before{content:"";position:absolute;inset:-7px -5px}
.pen{position:relative}
.icon-btn.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
:root[data-theme="dark"] .icon-btn.on{color:#0F141C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .icon-btn.on{color:#0F141C}}
.sync{font-size:12px;color:var(--ink-3);font-weight:700;padding:.28rem .8rem;display:flex;align-items:center;gap:.4rem;background:var(--card);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.leader-bar{background:var(--gold-2);color:var(--ink);font-size:13px;font-weight:800;padding:.35rem .85rem;display:flex;align-items:center;gap:.4rem;border-bottom:1px solid var(--line)}
.leader-bar .sp{flex:1}
.leader-bar button{border:0;background:transparent;color:var(--indigo);font-weight:900;font-size:13.5px;min-height:2rem;padding:0 .3rem}
/* main + tabs */
main{flex:1;padding:.75rem .75rem calc(80px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.8rem}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:flex-end;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tab{flex:1;min-height:58px;border:0;background:none;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:800;white-space:nowrap;word-break:keep-all;padding:6px 0 5px}
.tab svg.i{width:23px;height:23px}
.tab.on{color:var(--indigo)}
.tab-home{flex:1;min-width:0;position:relative;border:0;background:none;font:inherit;cursor:pointer;min-height:58px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 0 5px}
.tab-home .dome{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;
  background:var(--indigo);color:var(--indigo-ink);display:flex;align-items:center;justify-content:center;
  box-shadow:var(--dome);border:3px solid var(--card)}
.tab-home .dome svg.i{width:26px;height:26px}
.tab-home .lb{font-size:13px;font-weight:800;color:var(--ink-3);white-space:nowrap;word-break:keep-all;line-height:1.2}
.tab-home.on .lb{color:var(--indigo);font-weight:900}
.tab-home:focus-visible{outline:2px solid var(--indigo);outline-offset:-3px;border-radius:8px}
/* cards + buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.9rem}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.65rem}
.card-h h2{margin:0;font-size:1.05rem;font-weight:900;display:flex;align-items:center;gap:.4rem;white-space:nowrap}
.card-h .sub{font-size:.8rem;color:var(--ink-3);font-weight:700;white-space:nowrap}
h2.sec{margin:.25rem 0 0;font-size:1rem;font-weight:900;color:var(--ink-2);display:flex;align-items:center;gap:.4rem}
.muted{color:var(--ink-3);font-size:.88rem;font-weight:600}
.btn{min-height:3rem;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:1rem;padding:0 .9rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;white-space:nowrap;word-break:keep-all;line-height:1.2}
.btn svg.i{width:1.2rem;height:1.2rem}
.btn.pri{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.btn.ok{background:var(--terrace);color:#fff;border-color:var(--terrace)}
.btn.warn{background:var(--alert);color:#fff;border-color:var(--alert)}
.btn.soft{background:var(--indigo-2);color:var(--indigo);border-color:transparent}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:2.6rem;font-size:.9rem;padding:0 .7rem;border-radius:10px}
.btn.block{width:100%}
.btn.wrap{white-space:normal;text-align:left;justify-content:flex-start;padding:.55rem .9rem;line-height:1.3}
.btn.big{min-height:4.2rem;font-size:1.15rem;justify-content:flex-start;padding:0 1rem;text-align:left}
.btn.big svg.i{width:1.6rem;height:1.6rem}
.btn.big .b2{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.btn.big .b2 small{font-size:.8rem;color:var(--ink-3);font-weight:700;white-space:normal;line-height:1.2}
:root[data-theme="dark"] .btn.pri,:root[data-theme="dark"] .btn.ok,:root[data-theme="dark"] .btn.warn{color:#0F141C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri,:root:not([data-theme="light"]) .btn.ok,:root:not([data-theme="light"]) .btn.warn{color:#0F141C}}
.row{display:flex;gap:.5rem;flex-wrap:wrap}
.row>.btn{flex:1 1 auto;min-width:0}
.btn.warn .b2 small,.btn.pri .b2 small,.btn.ok .b2 small{color:rgba(255,255,255,.88)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.stack{display:flex;flex-direction:column;gap:.6rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.35rem .7rem;font-size:.85rem;font-weight:800;background:var(--indigo-2);color:var(--indigo);white-space:nowrap;word-break:keep-all;border:1.5px solid transparent;min-height:2.2rem}
.chip.pick{background:var(--card);color:var(--ink);border-color:var(--line);min-height:2.6rem}
.chip.pick.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
:root[data-theme="dark"] .chip.pick.on{color:#0F141C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.pick.on{color:#0F141C}}
.seg{display:flex;background:var(--indigo-2);border-radius:12px;padding:.25rem;gap:.25rem}
.seg button{flex:1;min-height:2.8rem;border:0;border-radius:9px;background:transparent;color:var(--indigo);font-weight:900;font-size:.95rem;white-space:nowrap;word-break:keep-all;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
/* hero broadcast */
.hero{background:var(--alert);color:#fff;border-radius:var(--r);padding:1rem;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-3rem;top:-3rem;width:10rem;height:10rem;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .lab{display:flex;align-items:center;gap:.4rem;font-size:.85rem;font-weight:800;letter-spacing:.06em}
.hero .lab .upd{margin-left:auto;font-weight:700;opacity:.9;letter-spacing:0;font-variant-numeric:tabular-nums}
.hero .time{font-size:2.9rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:.45rem 0 .15rem;display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.hero .time small{font-size:1.3rem;font-weight:900}
.hero .count{display:inline-flex;align-items:center;gap:.3rem;background:rgba(255,255,255,.2);border-radius:999px;padding:.3rem .75rem;font-weight:900;font-size:.98rem;margin:.35rem 0 .1rem;font-variant-numeric:tabular-nums}
.hero .count.late{background:#fff;color:var(--alert)}
.hero .loc{font-size:1.2rem;}
.hero .loc.long{font-size:1.02rem;}
.hero .loc{font-weight:900;display:flex;gap:.4rem;align-items:flex-start;margin-top:.55rem;line-height:1.3}
.hero .tip{margin-top:.75rem;background:#fff;color:#1B2437;border-radius:10px;padding:.65rem .75rem;font-size:1rem;font-weight:700;line-height:1.45;display:flex;gap:.45rem;align-items:flex-start}
.hero .tip svg.i{color:var(--alert);margin-top:.1rem}
.hero .ctl{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.75rem}
.hero .ctl .btn{background:rgba(255,255,255,.95);color:#1B2437;border-color:transparent;min-height:2.9rem;font-size:.95rem;padding:0 .5rem}
.hero .clr{display:inline-flex;align-items:center;gap:.25rem;margin-top:.5rem;border:0;background:transparent;color:rgba(255,255,255,.85);font-weight:800;font-size:.82rem;padding:.3rem .2rem;min-height:2.2rem}
.hero .clr svg.i{width:1rem;height:1rem}
.hero.pre{background:var(--indigo)}
.hero.done{background:var(--terrace)}
.hero.pre .tip svg.i,.hero.done .tip svg.i{color:var(--indigo)}
.td-desc{display:block;font-size:.85rem;color:var(--ink-3);font-weight:600;line-height:1.35;margin-top:.1rem}
/* me strip */
.me-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.me-strip button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.55rem .3rem;min-height:4.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;color:var(--ink)}
.me-strip .k{font-size:.75rem;color:var(--ink-3);font-weight:800}
.me-strip .v{font-size:1.25rem;font-weight:900;white-space:nowrap;line-height:1.15}
.me-strip .v.s{font-size:1rem}
.me-hint{display:flex;align-items:center;gap:.6rem;background:var(--indigo-2);border-radius:12px;padding:.7rem .85rem;color:var(--indigo);font-weight:800;min-height:3.4rem;border:0;width:100%;text-align:left;font-size:1rem}
.me-hint svg.i{margin-left:auto}
/* morning */
.mo{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.mo div{background:var(--bg);border-radius:10px;padding:.5rem .2rem;text-align:center}
.mo .k{font-size:.75rem;color:var(--ink-3);font-weight:800}
.mo .v{font-size:1.15rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.mo-note{margin-top:.55rem;font-size:.92rem;color:var(--ink-2);font-weight:600;line-height:1.4}
/* hotel */
.kv{display:grid;grid-template-columns:auto 1fr;gap:.3rem .7rem;font-size:.95rem}
.kv dt{color:var(--ink-3);font-weight:800;white-space:nowrap}
.kv dd{margin:0;font-weight:700;word-break:break-word}
/* itinerary */
.dayrow{display:flex;gap:.4rem;overflow-x:auto;padding:.15rem .1rem .3rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dayrow::-webkit-scrollbar{display:none}
.dayrow button{flex-shrink:0;min-width:4.7rem;min-height:3.5rem;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:.3rem .5rem}
.dayrow button small{font-size:.72rem;color:var(--ink-3);font-weight:700}
.dayrow button.today{border-color:var(--terrace)}
.dayrow button.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.dayrow button.on small{color:rgba(255,255,255,.85)}
.dayrow.fit{display:grid;grid-template-columns:repeat(var(--days,5),minmax(0,1fr));gap:.3rem;overflow:visible;padding:.3rem 0 .2rem}
.dayrow.fit button{min-width:0;width:100%;padding:.35rem .1rem;font-size:clamp(.78rem,3.6vw,.95rem);letter-spacing:-.02em;position:relative;white-space:nowrap}
.dayrow.fit button small{font-size:clamp(.62rem,2.9vw,.75rem)}
.dayrow.fit button .td{position:absolute;top:-.3rem;right:-.2rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--terrace);border:2px solid var(--card)}
:root[data-theme="dark"] .dayrow button.on{color:#0F141C}
:root[data-theme="dark"] .dayrow button.on small{color:rgba(15,20,28,.75)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dayrow button.on{color:#0F141C}:root:not([data-theme="light"]) .dayrow button.on small{color:rgba(15,20,28,.75)}}
.day-title{display:flex;align-items:baseline;gap:.5rem;margin:.2rem 0 -.2rem}
.day-title b{font-size:1.15rem;font-weight:900}
.stop{display:grid;grid-template-columns:62px 1fr;gap:.6rem;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:.85rem;position:relative;margin-top:.35rem}
.stop.cur{border:2.5px solid var(--terrace);background:var(--terrace-2)}
.stop.off{opacity:.62}
.stop.off .t-title{text-decoration:line-through}
.t-time{font-weight:900;font-size:1.15rem;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--indigo);letter-spacing:-.01em}
.stop.cur .t-time{color:var(--terrace)}
.t-time span{display:block;font-size:.8rem;color:var(--ink-3);font-weight:800;margin-top:.1rem}
.t-title{font-size:clamp(20px,1.25rem,22px);font-weight:900;line-height:1.25;margin:0 0 .3rem}
.t-desc{font-size:1rem;color:var(--ink-2);margin:0 0 .5rem;line-height:1.45;font-weight:500}
.t-detail{font-size:.98rem;line-height:1.6;color:var(--ink);border-top:1px dashed var(--line);padding-top:.55rem;margin-top:.45rem;white-space:pre-line}
.badge{position:absolute;top:-.65rem;right:.8rem;background:var(--terrace);color:#fff;font-size:.75rem;font-weight:900;border-radius:999px;padding:.22rem .65rem;letter-spacing:.04em}
.badge.off{background:var(--ink-3)}
.tags{display:flex;gap:.35rem;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:.3rem;border-radius:8px;padding:.28rem .5rem;font-size:.85rem;font-weight:800;background:var(--bg);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.tag svg.i{width:1rem;height:1rem}
.stop.cur .tag{background:var(--card)}
.lead-ctl{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem;border-top:1px solid var(--line);padding-top:.6rem;margin-top:.25rem}
.lead-ctl .btn{padding:0 .2rem;min-height:2.7rem;font-size:.82rem;flex-direction:column;gap:.1rem}
.lead-ctl .btn svg.i{width:1.1rem;height:1.1rem}
/* member cards */
.mc{display:flex;align-items:center;gap:.6rem;border-radius:12px;padding:.6rem .7rem;min-height:3.6rem;background:#fff;color:#1B2437;border:2px solid #D9E0E8;position:relative;text-align:left;width:100%}
.mc.bg-yellow{background:#FFF1A8}.mc.bg-pink{background:#FFD9E3}.mc.bg-green{background:#DDF3C9}.mc.bg-blue{background:#D8E9FF}
.mc.bd-gold{border:3px solid #C99A1E}.mc.bd-red{border:3px dashed #D32F2F}.mc.bd-black{border:3px solid #1B2437}
.mc .em{width:2rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.mc .em.none{width:.2rem}
.mc .tx{min-width:0;flex:1}
.mc .nm{display:block;font-size:1.125rem;font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .rk{display:block;font-size:.85rem;color:#4A5568;font-weight:700;margin-top:.22rem;line-height:1.3}
.mc .rt{text-align:right;font-size:.8rem;font-weight:900;color:#4A5568;flex-shrink:0;white-space:nowrap;line-height:1.25}
.al{display:inline-flex;align-items:center;justify-content:center;width:1.8rem;height:1.8rem;border-radius:50%;font-size:.62rem;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:.02em;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.al.eva{background:#0A7A4C}
.al.ci{background:#C4184F}
.al.none{background:#fff;color:#9AA3B0;border:1.5px dashed #C9D2DC;box-shadow:none}
.al.lg{width:2.6rem;height:2.6rem;font-size:.85rem}
.mc .al{margin-left:auto}
.mc .al+.rt{margin-left:.35rem}
.mc .mtags{display:flex;flex-wrap:wrap;gap:.2rem;margin-top:.22rem}
.mc .mtag{font-size:.68rem;font-weight:900;line-height:1.2;padding:.08rem .32rem;border-radius:5px;background:rgba(47,68,121,.1);color:#2F4479;white-space:nowrap;word-break:keep-all}
.mc .mtag.more{background:transparent;border:1px dashed #2F4479}
.mc.bg-yellow .mtag,.mc.bg-pink .mtag,.mc.bg-green .mtag,.mc.bg-blue .mtag{background:rgba(27,36,55,.12)}
:root[data-theme="dark"] .mc{background:var(--card);color:var(--ink);border-color:var(--line)}
:root[data-theme="dark"] .mc .rk,:root[data-theme="dark"] .mc .rt{color:var(--ink-2)}
:root[data-theme="dark"] .mc.bg-yellow{background:rgba(255,241,168,.16)}:root[data-theme="dark"] .mc.bg-pink{background:rgba(255,217,227,.16)}:root[data-theme="dark"] .mc.bg-green{background:rgba(221,243,201,.16)}:root[data-theme="dark"] .mc.bg-blue{background:rgba(216,233,255,.16)}
:root[data-theme="dark"] .mc.bd-black{border-color:var(--ink)}
:root[data-theme="dark"] .mc .mtag{background:rgba(157,178,238,.18);color:var(--indigo)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .mc{background:var(--card);color:var(--ink);border-color:var(--line)}
  :root:not([data-theme="light"]) .mc .rk,:root:not([data-theme="light"]) .mc .rt{color:var(--ink-2)}
  :root:not([data-theme="light"]) .mc.bg-yellow{background:rgba(255,241,168,.16)}:root:not([data-theme="light"]) .mc.bg-pink{background:rgba(255,217,227,.16)}:root:not([data-theme="light"]) .mc.bg-green{background:rgba(221,243,201,.16)}:root:not([data-theme="light"]) .mc.bg-blue{background:rgba(216,233,255,.16)}
  :root:not([data-theme="light"]) .mc.bd-black{border-color:var(--ink)}
  :root:not([data-theme="light"]) .mc .mtag{background:rgba(157,178,238,.18);color:var(--indigo)}
}
.mc.me::after{content:"我";position:absolute;top:-.55rem;left:-.35rem;background:#2F4479;color:#fff;font-size:.72rem;font-weight:900;border-radius:999px;padding:.12rem .5rem;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mc.sm{min-height:3rem;padding:.4rem .55rem;gap:.4rem;border-width:2px}
.mc.sm.bd-gold,.mc.sm.bd-red,.mc.sm.bd-black{border-width:2.5px}
.mc.sm .nm{font-size:1rem}
.mc.sm .em{font-size:1.2rem;width:1.5rem}
.mlist{display:flex;flex-direction:column;gap:.5rem}
.mlist.two{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.me-wait{display:flex;align-items:center;gap:.5rem;background:var(--indigo-2);border-color:transparent;color:var(--indigo);font-weight:800;font-size:.95rem;line-height:1.4}
.me-wait svg.i{flex-shrink:0}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
.room{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.6rem;display:flex;flex-direction:column;gap:.4rem}
.room h3{margin:0 0 .1rem;font-size:1.05rem;font-weight:900;display:flex;align-items:center;gap:.3rem;white-space:nowrap}
.room h3 svg.i{color:var(--gold)}
.room.me-room{border:2px solid var(--indigo)}
.room .empty{font-size:.85rem;color:var(--ink-3);font-weight:700;padding:.4rem 0}
.search{display:flex;align-items:center;gap:.5rem;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 .7rem;min-height:3rem}
.search input{flex:1;border:0;background:transparent;font-size:1.05rem;font-family:inherit;color:var(--ink);min-width:0;outline:none}
.search svg.i{color:var(--ink-3)}
/* groups */
.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.7rem}
.grp.me-grp{border:2px solid var(--indigo)}
.grp h3{margin:0 0 .5rem;font-size:1.1rem;font-weight:900;display:flex;align-items:center;gap:.4rem}
.grp h3 .n{margin-left:auto;font-size:.85rem;color:var(--ink-3);font-weight:800}
.grp .gm{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.grp .gm .mc{cursor:default}
.grp .gm .mc.pk{cursor:pointer}
/* roll call */
.rc-sticky{position:sticky;top:var(--stick,120px);z-index:5;box-shadow:var(--shadow)}
.rc-head{display:flex;align-items:baseline;gap:.5rem}
.rc button .bdg{width:1.3rem;height:1.3rem}
.rc-head .big{font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.rc{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.rc button{min-height:3.3rem;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:1rem;display:flex;align-items:center;gap:.45rem;padding:.3rem .6rem;text-align:left}
.rc button.on{background:var(--terrace-2);border-color:var(--terrace)}
.rc .ck{width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent}
.rc button.on .ck{background:var(--terrace);border-color:var(--terrace);color:#fff}
.rc .ck svg.i{width:.9rem;height:.9rem;stroke-width:3}
.missing{background:var(--alert-2);border-radius:10px;padding:.6rem .75rem;font-weight:800;line-height:1.5}
.missing.ok{background:var(--terrace-2);color:var(--terrace);display:flex;align-items:center;gap:.4rem}
.missing a{display:inline-flex;align-items:center;gap:.15rem;margin:.15rem .3rem .15rem 0;color:var(--alert);text-decoration:none;border:1.5px solid var(--alert);border-radius:999px;padding:.15rem .6rem}
.missing a svg.i{width:.95rem;height:.95rem}
/* currency */
.notes{display:grid;grid-template-columns:1fr;gap:.45rem}
.note{min-height:3.6rem;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;gap:.7rem;padding:.35rem .7rem;background:var(--card);color:var(--ink);font-weight:900;font-size:1.25rem;text-align:left;width:100%}
.note .sw{width:2.6rem;height:1.5rem;border-radius:4px;flex-shrink:0;border:1px solid rgba(0,0,0,.15)}
.note .nt{flex:1;min-width:0;line-height:1.1}
.note small{display:block;font-size:.78rem;color:var(--ink-3);font-weight:800;margin-top:.15rem}
.note .nv{font-size:1rem;font-weight:900;color:var(--indigo);white-space:nowrap;font-variant-numeric:tabular-nums}
.total{background:var(--indigo-2);border-radius:12px;padding:.8rem;text-align:center}
.total .v{font-size:1.75rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.total .t{font-size:1.35rem;font-weight:900;color:var(--indigo);margin-top:.2rem}
.total .r{font-size:.8rem;color:var(--ink-3);font-weight:700;margin-top:.3rem}
/* 資訊卡（工具箱長文） */
.info-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.85rem .9rem;line-height:1.6}
.info-card .ic-h{display:flex;align-items:center;gap:.4rem;font-weight:900;font-size:1.02rem;margin-bottom:.4rem;white-space:nowrap;word-break:keep-all}
.info-card .ic-h svg.i{color:var(--indigo);flex-shrink:0}
.info-card p{margin:0;font-weight:600;color:var(--ink-2)}
.info-card b{font-weight:900;color:var(--ink)}
ol.steps{margin:0;padding-left:1.4rem;display:grid;gap:.55rem;font-weight:600;color:var(--ink-2)}
ol.steps li::marker{font-weight:900;color:var(--indigo)}
ul.dots{margin:0;padding-left:1.15rem;display:grid;gap:.6rem;font-weight:600;color:var(--ink-2)}
ul.dots li::marker{color:var(--indigo)}
dl.kv2{margin:0;display:grid;gap:0}
dl.kv2 dt{font-weight:900;color:var(--ink);white-space:nowrap;word-break:keep-all;margin-top:.55rem}
dl.kv2 dt:first-child{margin-top:0}
dl.kv2 dd{margin:.15rem 0 .55rem;font-weight:700;color:var(--ink-2);line-height:1.5;border-bottom:1px dashed var(--line);padding-bottom:.55rem}
dl.kv2 dd:last-child{border-bottom:0;padding-bottom:0;margin-bottom:0}
/* 飯店 Wi-Fi 卡 */
.wifi-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.75rem .9rem}
.wifi-card .wf-h{display:flex;align-items:center;gap:.4rem;font-size:1.02rem;margin-bottom:.5rem;white-space:nowrap}
.wifi-card .wf-h svg.i{color:var(--indigo)}
.wifi-card .wf-h .sp{flex:1}
.wifi-card .wf-row{display:flex;align-items:center;gap:.5rem;padding:.4rem 0;border-top:1px solid var(--line)}
.wifi-card .wf-k{color:var(--ink-3);font-weight:800;white-space:nowrap;word-break:keep-all;flex-shrink:0}
.wifi-card .wf-v{flex:1;min-width:0;font-weight:900;font-size:1.05rem;word-break:break-all;font-variant-numeric:tabular-nums}
.wifi-card .wf-row .btn{flex-shrink:0}
.wifi-card .wf-note{margin-top:.5rem;color:var(--ink-3);font-weight:700;font-size:.9rem;line-height:1.45}
.wifi-card .wf-note.ed{display:flex;align-items:flex-start;gap:.35rem;width:100%;text-align:left;background:none;border:1px dashed var(--line);border-radius:10px;padding:.4rem .5rem;font:inherit;color:var(--ink-3);font-weight:700;font-size:.9rem;cursor:pointer}
.wifi-card .wf-note.ed svg.i{flex-shrink:0;margin-top:.1rem;color:var(--indigo)}
.air-note{display:flex;align-items:flex-start;gap:.5rem}
.air-note svg.i{flex-shrink:0;margin-top:.15rem;color:var(--indigo)}
.air-note>span{flex:1;min-width:0}
.air-note .btn{flex-shrink:0;align-self:center}
.warn-box{background:var(--alert-2);border-left:4px solid var(--alert);border-radius:10px;padding:.6rem .75rem;font-weight:800;line-height:1.45;font-size:.95rem;display:flex;gap:.45rem;align-items:flex-start}
.warn-box svg.i{color:var(--alert);margin-top:.15rem}
/* phrase list */
.ph{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;min-height:3.8rem;width:100%;text-align:left;color:var(--ink)}
.ph .e{font-size:1.5rem;flex-shrink:0;width:2rem;text-align:center}
.ph .zh{font-weight:900;font-size:1.05rem}
.ph .vi{font-size:.9rem;color:var(--ink-3);font-weight:700}
.ph .tx{flex:1;min-width:0}
.ph .say-s{font-size:.88rem;color:var(--terrace);font-weight:800}
.ph .phn{margin-left:auto;font-size:.8rem;font-weight:900;color:var(--ink-3);flex-shrink:0;white-space:nowrap}
.ph svg.i{margin-left:auto;color:var(--ink-3)}
/* emergency */
.em-row{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem .6rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;min-height:3.6rem}
.em-row .t{flex:1 1 150px;min-width:0}
.em-row .t b{display:block;font-size:1.05rem;font-weight:900}
.em-row .t span{font-size:.85rem;color:var(--ink-3);font-weight:700}
.em-row a.btn{text-decoration:none;flex:1 1 auto}
/* full screen card */
.full{position:fixed;inset:0;background:#fff;color:#111;z-index:60;display:flex;flex-direction:column;padding:1rem;padding-top:calc(.75rem + env(safe-area-inset-top));overflow-y:auto}
.full .fh{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem}
.full .fh .btn{border-color:#ccc;color:#111;background:#fff}
.full .lockbar{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:#666;font-weight:700;margin:-.2rem 0 .4rem}
.full .lockbar .btn{flex-shrink:0;border-color:#ccc;color:#111;background:#fff}
.full .lockbar .btn.pri{background:#2F4479;color:#fff;border-color:#2F4479}
.full .lockbar .btn.hold{background:#1B2437}
.full .fk{font-size:.85rem;font-weight:800;color:#666;letter-spacing:.08em;margin-top:.9rem}
.full .vi{font-size:2rem;font-weight:900;line-height:1.25;margin:.25rem 0}
.full .vi.xl{font-size:2.4rem}
.full .zh{font-size:1.15rem;color:#333;font-weight:800;line-height:1.4}
.full .say{font-size:.95rem;color:#666;font-weight:700}
.full .ph-big{display:flex;align-items:center;gap:.6rem;font-size:1.6rem;font-weight:900;margin:.3rem 0;color:#111;text-decoration:none}
.full .ph-big svg.i{color:#2F4479}
.full .foot{margin-top:auto;padding-top:1rem;font-size:.85rem;color:#777;font-weight:700;line-height:1.45}
/* flights */
.fl{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.fl-col{background:var(--bg);border-radius:12px;padding:.6rem .7rem}
.fl-h{display:flex;align-items:center;gap:.3rem;font-weight:900;font-size:clamp(.82rem,4.2vw,1rem);margin-bottom:.4rem;white-space:nowrap;overflow:hidden;min-width:0}
.fl-h .al{width:1.5rem;height:1.5rem;font-size:.55rem}
.fl-col{min-width:0}
.fl-r{display:flex;flex-direction:column;gap:.05rem;margin-top:.35rem}
.fl-r .k{font-size:.75rem;color:var(--ink-3);font-weight:800;line-height:1.3}
.fl-r b{font-size:1.35rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.01em}
/* notebook */
.nb-tabs{display:flex;gap:.4rem;flex-wrap:wrap;padding:.1rem 0 .2rem}
.nb-title{display:flex;align-items:center;gap:.5rem;margin:.2rem 0 0}
.nb-title h2{margin:0;font-size:1.25rem;font-weight:900;flex:1;min-width:0}
.prog{height:.55rem;background:var(--line);border-radius:999px;overflow:hidden;margin-top:0}
.prog i{display:block;height:100%;background:var(--terrace);border-radius:999px;transition:width .2s}
.nb-head{font-size:.85rem;font-weight:900;color:var(--ink-3);letter-spacing:.08em;margin:.7rem 0 -.15rem;display:flex;align-items:center;gap:.4rem}
.nb-head::after{content:"";flex:1;height:1px;background:var(--line)}
.ck-row{display:flex;gap:.65rem;align-items:flex-start;min-height:3.4rem;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:.65rem .8rem;width:100%;text-align:left;color:var(--ink);font-size:1.05rem;font-weight:700;line-height:1.35}
.ck-row .box{width:1.6rem;height:1.6rem;border-radius:6px;border:2px solid var(--ink-3);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:transparent;margin-top:.05rem}
.ck-row .box svg.i{width:1rem;height:1rem;stroke-width:3}
.ck-row.on{background:var(--terrace-2);border-color:var(--terrace)}
.ck-row.on .box{background:var(--terrace);border-color:var(--terrace);color:#fff}
.ck-row.on .tx{text-decoration:line-through;color:var(--ink-2)}
.ck-row .tx{flex:1;min-width:0}
.note-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.75rem .85rem;font-size:1rem;line-height:1.55;font-weight:600;color:var(--ink);white-space:pre-line}
.it-wrap{display:flex;flex-direction:column;gap:.5rem}
.it-row{display:flex;gap:.4rem;align-items:stretch}
.it-row>.ck-row,.it-row>.note-item{flex:1;min-width:0}
.it-row>.nb-head{flex:1}
.it-row .edit{width:44px;min-width:44px;padding:0;flex-shrink:0;align-self:center;min-height:44px}
.tf{display:flex;align-items:center;gap:.35rem}
.tf .in{flex:1;text-align:center;font-size:1.2rem;font-weight:900;font-variant-numeric:tabular-nums;padding:.4rem .3rem}
.tf b{font-size:1.3rem}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(8,12,22,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:440px;max-height:92vh;max-height:92dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease-out}
.sheet.tall{height:92vh;height:92dvh}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1rem .5rem;font-weight:900;font-size:1.15rem;gap:.5rem}
.sheet-h .icon-btn{width:2.5rem;height:2.5rem}
.sheet-b{padding:.25rem 1rem 1rem;overflow-y:auto;display:flex;flex-direction:column;gap:.85rem;-webkit-overflow-scrolling:touch}
.sheet-f{padding:.6rem 1rem calc(.75rem + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:.5rem}
.sheet-f .btn{flex:1}
.f label{display:block;font-size:.85rem;font-weight:900;color:var(--ink-2);margin-bottom:.3rem}
.in{width:100%;min-height:3rem;border:1.5px solid var(--line);border-radius:10px;padding:.5rem .7rem;font-size:1.05rem;font-family:inherit;background:var(--card);color:var(--ink);font-weight:600}
textarea.in{min-height:5.5rem;line-height:1.45;resize:vertical}
select.in{appearance:none;-webkit-appearance:none}
.in:focus{outline:2.5px solid var(--indigo);outline-offset:1px}
.sw{display:flex;gap:.4rem;flex-wrap:wrap}
.sw button{min-width:3rem;min-height:3rem;border-radius:10px;border:2px solid var(--line);font-size:1.3rem;background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0 .4rem;font-weight:800}
.sw button.on{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-2)}
.sw button.c{width:3rem}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.pin button{min-height:3.6rem;font-size:1.5rem;font-weight:900;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.pin-disp{text-align:center;font-size:2rem;letter-spacing:.5rem;font-weight:900;min-height:3rem;font-variant-numeric:tabular-nums}
.tip-banner{background:var(--card);border:1px dashed var(--indigo);border-radius:var(--r);padding:.75rem .85rem;font-size:.9rem;line-height:1.5;color:var(--ink-2);font-weight:600;display:flex;gap:.5rem;align-items:flex-start}
.tip-banner svg.i{color:var(--indigo);flex-shrink:0;margin-top:.15rem}
.tip-banner button{margin-left:auto;border:0;background:transparent;color:var(--ink-3);font-weight:900;min-width:2.5rem;min-height:2.5rem;flex-shrink:0}
.tip-banner span{flex:1;min-width:0}
.tip-banner .tb-go{margin-left:0;color:var(--indigo);text-decoration:underline;min-width:0;padding:0 .35rem;white-space:nowrap}
/* ===== 安裝成 App／加到主畫面 ===== */
/* 按鈕字級固定用 px，不跟著「AA」放大，320px 小螢幕才不會把區塊標題擠爆 */
.inst-btn{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:.2rem;font-size:12px;font-weight:900;line-height:1;color:var(--indigo-ink);background:var(--indigo);border:0;border-radius:999px;padding:.4rem .6rem;white-space:nowrap;word-break:keep-all}
.inst-btn svg.i{width:14px;height:14px;stroke-width:2.4}
.ig-why{display:flex;gap:.45rem;align-items:flex-start;background:var(--indigo-2);color:var(--indigo);border-radius:.7rem;padding:.6rem .7rem;font-size:.88rem;font-weight:700;line-height:1.5;margin-bottom:.85rem}
.ig-why svg.i{flex:none;margin-top:.15rem}
.ig{display:flex;flex-direction:column;gap:.85rem}
.ig-s{display:flex;gap:.55rem;align-items:flex-start}
.ig-n{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--indigo);color:var(--indigo-ink);font-weight:900;font-size:.9rem;display:flex;align-items:center;justify-content:center;margin-top:.1rem}
.ig-s .tx{flex:1;min-width:0}
.ig-s b{display:block;font-size:1rem;font-weight:900;line-height:1.4}
.ig-s small{display:block;color:var(--ink-2);font-size:.85rem;font-weight:600;line-height:1.5;margin-top:.15rem}
.ig-fig{margin-top:.45rem;border:1px solid var(--line);border-radius:.6rem;background:var(--soft);padding:.5rem .55rem;display:flex;align-items:center;gap:.5rem;font-size:.88rem;font-weight:800;min-width:0;color:var(--ink)}
.ig-fig.row2{justify-content:space-between}
.ig-fig.bar{justify-content:space-between;color:var(--ink-3)}
.ig-fig .dim{color:var(--ink-3);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ig-fig .go{color:var(--indigo);font-weight:900}
.ig-fig>.ig-hi{outline:2px solid var(--alert);outline-offset:2px;border-radius:.35rem;padding:.05rem .3rem}
.ig-fig>.ig-hi.ic{display:inline-flex;align-items:center;padding:.15rem}
.ig-fig.ig-hi{outline:2px solid var(--alert);outline-offset:-1px}
.ig-s small svg.i{width:1.1em;height:1.1em;vertical-align:-.2em;margin:0 .1em}
.ig-shot{display:block;width:100%;height:auto;margin-top:.45rem;border:1px solid var(--line);border-radius:.6rem;background:var(--soft)}
.ig-alt{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;margin:-.35rem 0 0 2.15rem}
.ig-alt small{color:var(--ink-3);font-size:.82rem;font-weight:600;line-height:1.45}
.toast{position:fixed;left:50%;bottom:6rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.65rem 1.1rem;border-radius:999px;font-weight:800;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.hint-lead{font-size:.82rem;color:var(--ink-3);font-weight:700;display:flex;align-items:center;gap:.3rem}
.hint-lead svg.i{width:1rem;height:1rem}
/* ===== v4：首頁分段（現在／稍後／隨時查）＋ 可收合卡片 ===== */
.zsec{display:flex;flex-direction:column;gap:.7rem}
.zlab{display:flex;align-items:center;gap:.5rem;margin-bottom:-.05rem}
.zlab span{font-size:.78rem;font-weight:900;color:var(--ink-3);letter-spacing:.1em;white-space:nowrap;word-break:keep-all}
.zlab i{flex:1;height:1px;background:var(--line)}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chead{width:100%;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;gap:.5rem;padding:.7rem .8rem;text-align:left;min-height:3.2rem}
.chead .ttl{font-size:1rem;font-weight:900;display:flex;align-items:center;gap:.4rem;flex-shrink:0;white-space:nowrap;word-break:keep-all;color:var(--ink-2)}
.chead .ttl svg.i{width:1.15rem;height:1.15rem}
.chead .sm{flex:1;min-width:0;text-align:right;font-size:.82rem;font-weight:800;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.chead .cv{flex-shrink:0;color:var(--ink-3);font-size:.8rem;font-weight:900;width:1.1rem;text-align:center}
.cbody{padding:0 .8rem .8rem}
.lead-sw{display:flex;align-items:center;gap:.45rem;padding:.45rem .8rem;background:var(--gold-2);font-size:.82rem;font-weight:800;white-space:nowrap;word-break:keep-all}
.lead-sw .sp{flex:1}
.tgl{width:52px;height:30px;border-radius:999px;border:0;background:var(--ink-3);position:relative;flex-shrink:0;padding:0}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .16s ease}
.tgl.on{background:var(--terrace)}
.tgl.on::after{left:25px}
.it-row .tgl{align-self:center}
/* 明度階梯：現在＝浮起、稍後＝沉一階、隨時查＝只留框 */
.g-now>.card{box-shadow:var(--lift);border-color:transparent;position:relative;overflow:hidden}
.g-now>.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--alert),var(--indigo))}
.g-later>.card,.g-later>.ccard{background:var(--soft);border-color:transparent}
.g-ref>.card,.g-ref>.ccard{background:transparent;border-color:var(--line)}
.g-ref .chead .ttl{color:var(--ink-3)}
.g-ref .fl-col{background:var(--card)}
/* Google 地圖按鈕 */
.map-btn{width:2.1rem;height:2.1rem;min-width:2.1rem;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--indigo);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none;vertical-align:middle}
.map-btn svg.i{width:1.15rem;height:1.15rem}
.map-btn:active{background:var(--indigo-2)}
.map-btn.lg{width:2.5rem;height:2.5rem;min-width:2.5rem;margin-left:.4rem}
.map-btn.lg svg.i{width:1.35rem;height:1.35rem}

.tagrow{flex:1;min-width:0;display:flex;align-items:center;gap:.45rem;font-size:1rem;white-space:nowrap;overflow:hidden}
.tagrow svg.i{width:1.2rem;height:1.2rem;color:var(--indigo)}
.sw button svg.i{width:1.4rem;height:1.4rem}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.7rem .75rem;min-height:5.2rem;display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;color:var(--ink);text-align:left}
.tcard svg.i{width:1.5rem;height:1.5rem;color:var(--indigo);margin-bottom:.15rem}
.tcard b{font-size:1rem;font-weight:900;white-space:nowrap;word-break:keep-all}
.tcard small{font-size:.78rem;color:var(--ink-3);font-weight:700;line-height:1.25}
.ver{text-align:center;font-size:.75rem;color:var(--ink-3);font-weight:700;padding:.4rem 0 .2rem;letter-spacing:.04em}
.btn.line{background:#06C755;color:#fff;border-color:#06C755}
.btn.line svg.i{width:1.1rem;height:1.1rem}
.tag.map{background:var(--indigo-2);color:var(--indigo);border-color:transparent;text-decoration:none;font-weight:900}
.tag.map svg.i{color:var(--indigo)}
/* 彩色徽章 SVG */
svg.bdg{width:1.7rem;height:1.7rem;display:block;flex-shrink:0}
svg.bdg.lg{width:2.1rem;height:2.1rem}
.icon-btn svg.bdg{width:19px;height:19px}
.leader-bar svg.bdg,h2.sec svg.bdg{width:1.15rem;height:1.15rem}
.bdg-hint{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.3rem .6rem;margin-top:.45rem}
.bdg-hint span{display:flex;align-items:center;gap:.35rem;font-size:.82rem;font-weight:700;color:var(--ink-3);white-space:nowrap;word-break:keep-all}
.bdg-hint svg.bdg{width:1.2rem;height:1.2rem}
.sw button svg.bdg{margin:0 auto}
/* 出發前準備卡 */
.prep-top{display:flex;align-items:baseline;gap:.35rem;margin-bottom:.4rem}
.prep-top .n{font-size:1.6rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--terrace)}
.prep-top .d{font-size:.95rem;font-weight:800;color:var(--ink-2)}
.prep-top .sp{flex:1}
.prep-top .pc{font-size:.85rem;font-weight:900;color:var(--ink-3);font-variant-numeric:tabular-nums}
.prep-lab{font-size:.82rem;font-weight:900;color:var(--ink-3);margin:.7rem 0 .4rem;white-space:nowrap;word-break:keep-all}
.prep-done{display:flex;align-items:center;gap:.45rem;margin-top:.7rem;background:var(--terrace-2);color:var(--terrace);
  border-radius:12px;padding:.6rem .7rem;font-weight:900;font-size:.95rem}
.prep-note{display:flex;align-items:flex-start;gap:.35rem;margin-top:.55rem;font-size:.8rem;font-weight:700;color:var(--ink-3);line-height:1.4}
.prep-note svg.i{width:1rem;height:1rem;flex-shrink:0;margin-top:.1rem}
.ck-row.sm{min-height:2.9rem;padding:.5rem .65rem;font-size:.95rem}
.ck-row.sm .box{width:1.35rem;height:1.35rem;border-radius:5px}
.ck-row.sm .box svg.i{width:.85rem;height:.85rem}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="top-r1">
      <div class="trip-name" id="hdTrip">沙壩雲海五日</div>
      <button class="pen" id="btnTrip" data-act="editTripName" aria-label="修改團名" title="修改團名" hidden>✏️</button>
      <span class="day-chip" id="hdDay">第 1 天</span>
      <button class="icon-btn" id="btnTheme" data-act="themeToggle" aria-label="切換深淺色主題" title="深淺色"></button>
      <button class="icon-btn" id="btnFont" data-act="fontCycle" aria-label="切換字體大小" title="字體大小">A<span style="font-size:.7em">A</span></button>
      <button class="icon-btn" id="btnLeader" data-act="leaderToggle" aria-label="領隊模式"></button>
    </div>
    <div class="top-r2">
      <div class="lcd" aria-live="off">
        <span class="lb">越南</span><span class="n" id="clockVN">--:--</span>
        <span class="dv"></span><span class="tw">台灣 <span id="clockTW">--:--</span></span>
        <span class="dv"></span><span class="cd" id="hdCountdown" hidden></span>
        <span class="dv"></span><span class="dot" id="hdDot"></span><span class="sy" id="hdSyncTx">連線中</span>
      </div>
    </div>
  </header>
  <div class="sync" id="syncBar" hidden></div>
  <div class="leader-bar" id="leaderBar" hidden><span id="leaderBarIcon"></span>領隊管理模式：可直接點卡片修改<span class="sp"></span><button data-act="leaderLock">鎖定</button></div>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar" aria-label="主選單"></nav>
</div>
<div id="sheetRoot"></div>
<div id="fullRoot"></div>
<div class="toast" id="toast" role="status"></div>

  broadcast:{ time:'', label:'集合', location:'', tip:'', idle:false, updatedAt:'' },
  itinerary:{ items:[
    /* ===== 第 1 天 9/24（三）桃園 → 河內 → 沙壩 ===== */
    {id:'d1a',day:1,place:'Taoyuan International Airport Terminal 2',time:'05:30',title:'桃園機場集合',
     desc:'全體不分航空公司，05:30 在第二航廈集合。',
     detail:'請提早出門，05:30 準時到第二航廈出境大廳，領隊會發護照與行李吊牌。\n液體超過 100ml 一律託運；行動電源、鋰電池必須隨身，不可以放託運行李。\n手機記得充飽電，並帶一條充電線與轉接頭（越南是雙圓孔，台灣扁插頭多半可以直接用）。',
     tags:['ticket','toilet']},
    {id:'d1b',day:1,place:'Taoyuan International Airport Terminal 1',time:'06:00',title:'分頭辦登機',
     desc:'🔴 華航團員搭電車到第一航廈；🟢 長榮團員留在第二航廈。',
     detail:'兩航廈間的免費電車約 5 分鐘一班、車程 2 分鐘，跟著領隊走不會迷路。\n辦完登機各自過安檢，登機門看登機證上的號碼。\n過安檢後如果找不到人，直接看本網頁的「緊急求助」打電話，不要自己亂走。',
     tags:['ticket','walk']},
    {id:'d1c',day:1,place:'Noi Bai International Airport',time:'11:15',title:'河內機場會合',
     desc:'華航約 10:30、長榮約 11:15 抵達，先到的在行李轉盤外等。',
     detail:'越南時間比台灣慢 1 小時，下機後請確認手機時間已自動調整；本網頁所有時間都是越南當地時間。\n入境要出示護照與越南電子簽證列印本，請放在隨身包好拿的地方。\n領完行李在出關大廳等全員到齊，導遊會舉牌接機。',
     tags:['ticket','bus']},
    {id:'d1d',day:1,place:'Sa Pa, Lao Cai, Vietnam',time:'12:00',title:'出發前往沙壩',
     desc:'車程約 6 小時，中途休息站停 2 次可上洗手間。',
     detail:'河內到沙壩約 320 公里，走高速公路約 5.5～6 小時，是這趟最長的一段車程。\n容易暈車的人請在上車前 30 分鐘先吃暈車藥，坐前排、看遠方、少滑手機。\n山路後半段彎道多，隨身行李請放腳邊或行李架綁好。\n休息站有洗手間但不一定有衛生紙，請自備一小包。',
     tags:['bus','pill','toilet']},
    {id:'d1e',day:1,place:"Pao's Sapa Leisure Hotel, To dan pho Cau May 1, Sa Pa, Lao Cai",time:'18:00',title:'抵達沙壩入住',
     desc:"入住 Pao's Sapa Leisure Hotel，領隊發房卡。",
     detail:'沙壩海拔約 1,500 公尺，晚上常降到 15 度以下，下車第一件事就是把外套拿出來。\n進房先確認：熱水、吹風機、插座、保險箱。有問題馬上跟領隊說，不要忍到隔天。\n這間飯店會住 3 個晚上（9/24、9/25、9/26），行李可以整個攤開，不用每天收。',
     tags:['bed','coat']},
    {id:'d1f',day:1,time:'19:00',title:'晚餐：飯店',
     desc:'第一晚在飯店內用餐，餐後早點休息。',
     detail:'今天坐了一整天車，晚餐後建議早點睡，讓身體適應高度與溫差。\n山上空氣乾，睡前多喝一點溫水。',
     tags:['meal']},

    /* ===== 第 2 天 9/25（四）番西邦峰・貓貓村 ===== */
    {id:'d2a',day:2,time:'06:00',title:'早餐：飯店',
     desc:'飯店內自助早餐，06:00–08:00。',
     detail:'今天要上番西邦峰，早餐請吃飽一點，山頂餐廳選擇不多。\n建議帶一顆水煮蛋或麵包上山備用。',
     tags:['meal']},
    {id:'d2b',day:2,place:'Sun World Fansipan Legend',time:'08:00',title:'番西邦峰纜車',
     desc:'搭三索纜車直上「印度支那屋脊」，俯瞰梯田雲海。',
     detail:'番西邦峰海拔 3,143 公尺，是中南半島最高峰。纜車全長 6.3 公里，約 15 分鐘直達上站。\n山頂比沙壩鎮再冷 5～8 度，而且風大，厚外套一定要帶著，不要放在車上。\n上站到峰頂還有 600 階石梯，走不動的人可以加購山頂纜車（單程約 150,000 越盾），或在觀景平台等大家，不要勉強。\n高海拔容易喘、頭暈，慢慢走、多休息；有心臟或高血壓問題的長輩請先告訴領隊。\n山上雲霧變化很快，看到雲海就先拍，不要等下一個點。',
     tags:['coat','alt','shoes','camera','toilet']},
    {id:'d2c',day:2,place:'33 Hoang Lien, Sa Pa, Lao Cai',time:'11:30',title:'午餐：越式合菜',
     desc:'Viet Trekking 餐廳，越式合菜（番西邦套餐）。',
     detail:'地址：33 Hoàng Liên, Sa Pa, Lào Cai，就在鎮上主要道路旁。\n吃素或有忌口的人請在上車前先告訴領隊，餐廳需要提前備料。',
     tags:['meal']},
    {id:'d2d',day:2,place:'Cat Cat Village, Sa Pa',time:'13:30',title:'貓貓村健行',
     desc:'沿石板步道下坡穿過梯田、水車與法國時期小水電站。',
     detail:'貓貓村（Cát Cát）是黑苗族的村落，距沙壩鎮約 2 公里，全程下坡約 1.5 公里。\n石板路走多了會滑，尤其下過雨之後，請穿防滑的鞋子，不要穿新鞋或涼鞋。\n回程是上坡，走不動可以在村口叫摩托計程車（約 50,000 越盾）回鎮上，先跟領隊說一聲。\n村裡的苗族婦女會跟著你兜售手工藝品，不想買就微笑說「không, cảm ơn」（不用了，謝謝）並繼續走，不要停下來翻看。\n拍照前請先問一下，尤其是拍人。',
     tags:['shoes','walk','rain','camera','cash']},
    {id:'d2e',day:2,place:'Sa Pa Xua Restaurant, Sa Pa',time:'17:30',title:'晚餐：夜市旁餐廳',
     desc:'Sapa Xưa，沙壩夜市正對面，用餐到 22:00。',
     detail:'地址：SN 005, Đường N02（Đỗ Quyên），沙壩夜市正對面。\n山上腸胃比較敏感，生食與冰飲建議少碰，多喝溫的。\n餐後走幾步就是夜市，想逛的人跟領隊說一聲，回飯店的路只有 5 分鐘，但天黑後路燈不多，兩人以上一起走。',
     tags:['meal','cash','coat']},

    /* ===== 第 3 天 9/26（五）達灣・按摩・廣場 ===== */
    {id:'d3a',day:3,time:'06:00',title:'早餐：飯店',
     desc:'飯店內自助早餐，06:00–09:00。',
     detail:'今天行程比較輕鬆，可以睡晚一點再下樓。',
     tags:['meal']},
    {id:'d3b',day:3,place:'Ta Van Village, Sa Pa',time:'09:00',title:'達灣梯田村',
     desc:'達灣 Tả Van，沙壩最美的梯田村落。',
     detail:'達灣（Tả Van）在沙壩鎮東南約 10 公里的山谷裡，是整個沙壩梯田風景最完整的一段。\n九月底正好是稻穗轉金黃的時候，這裡是全程最值得拍照的地方。\n田埂路窄又可能有泥，請走在導遊指定的路線上，不要為了取景走進田裡。\n村裡有吊橋，一次不要太多人上去，過橋時扶好欄杆。\n山谷訊號較弱，跟大家走在一起，不要落單。',
     tags:['walk','shoes','camera','rain']},
    {id:'d3c',day:3,place:'Sailing Ta Van, Sa Pa',time:'11:30',title:'午餐：達灣景觀',
     desc:'Sailing Ta Van，梯田景觀餐廳。',
     detail:'餐廳有大片落地窗看得到整片梯田，早到的人可以先去露台拍照。\n吃素或有忌口的人請提前告訴領隊。',
     tags:['meal','camera']},
    {id:'d3d',day:3,time:'14:00',title:'自由按摩行程',
     desc:'下午自由安排，可以做腳底或全身按摩。',
     detail:'走了兩天山路，這個下午是特地留給大家休息的。\n沙壩鎮上的按摩店行情：腳底 60 分鐘約 200,000～300,000 越盾，全身約 350,000～450,000 越盾，記得先問價再進去。\n有高血壓、心臟病、剛開過刀或懷孕的人，請避免全身重壓的按摩。\n不想按摩的人可以留在飯店休息，或到廣場附近喝咖啡，晚餐前回到飯店集合。',
     tags:['cash','pill']},
    {id:'d3e',day:3,place:'Nha hang O Quy Ho, Sa Pa',time:'17:30',title:'晚餐：山區風味',
     desc:'Nhà hàng Ô Quý Hồ，沙壩山區特色料理。',
     detail:'沙壩的高山冷水養殖鮭魚是當地招牌，跟海水鮭魚口感不同，值得試試。\n這一帶的菜偏酸辣，怕辣的人點餐時說「không cay」（不要辣）。\n山上的雞湯與燉品很適合長輩，可以多喝一點湯暖身。',
     tags:['meal']},
    {id:'d3f',day:3,place:'Sa Pa Square, Sa Pa',time:'19:30',title:'廣場自由活動',
     desc:'飯後可以到廣場喝咖啡、逛街，21:30 前回飯店。',
     detail:'沙壩廣場與石教堂就在飯店步行 5～10 分鐘範圍內，晚上有當地人跳廣場舞，很熱鬧。\n越南咖啡很濃，晚上喝建議點一杯就好，或改點椰子咖啡。\n夜市與路邊攤開價通常可以殺 3～5 成，慢慢殺不要急。\n山上晚上溫差大，出門一定要加件外套。\n找不到路回飯店就打開本網頁的「計程車回飯店卡」給司機或路人看。',
     tags:['walk','cash','coat']},

    /* ===== 第 4 天 9/27（六）飯店設施・老街・夜臥火車 ===== */
    {id:'d4a',day:4,time:'06:00',title:'早餐：飯店',
     desc:'飯店內自助早餐，06:00–09:00。今天要退房。',
     detail:'今晚睡火車，早餐後請先把行李整理好，該託運的、隨身的分開裝。',
     tags:['meal','bed']},
    {id:'d4b',day:4,time:'08:00',title:'飯店設施自由',
     desc:'自由使用飯店設施，或自費去玻璃橋。',
     detail:'玻璃橋（Rồng Mây 龍雲玻璃橋）在沙壩往萊州的公路上，車程約 40 分鐘，門票需自費。\n想去的人請在前一晚跟領隊登記，人數夠才會安排車輛。\n懼高、有心臟病或高血壓的長輩不建議前往。\n不去的人可以留在飯店泡湯、泡咖啡，或到附近散步，12:00 前回房間收行李。',
     tags:['cash','camera']},
    {id:'d4c',day:4,place:"Pao's Sapa Leisure Hotel, To dan pho Cau May 1, Sa Pa, Lao Cai",time:'12:00',title:'退房・寄行李',
     desc:'12:00 退房，行李統一寄放在飯店。',
     detail:'退房前請務必檢查：保險箱（很多人把護照忘在裡面）、浴室、床頭櫃、插座上的充電器。\n退房後行李寄放在飯店大廳，下午還可以自由活動，16:00 上車前再一起取。\n護照、錢包、藥品、當晚換洗衣物請放隨身包，不要放進寄放的大行李。',
     tags:['bed','ticket']},
    {id:'d4d',day:4,place:'22 Ngu Chi Son, Sa Pa, Lao Cai',time:'12:30',title:'午餐：沙壩最後',
     desc:'Chạm Quán Sapa - Restaurant & Drinks。',
     detail:'地址：22 Ngũ Chỉ Sơn, Sa Pa, Lào Cai。\n吃完飯後鎮上還有時間可以買伴手禮：竹筒飯、山茶、乾燥草藥包、苗族刺繡都是這裡的特產。\n剩下的越盾建議在沙壩花掉，火車站與機場的東西比較貴。',
     tags:['meal','cash']},
    {id:'d4e',day:4,place:'Lao Cai Railway Station',time:'16:00',title:'前往老街站',
     desc:'搭車下山到老街火車站，車程約 1 小時。',
     detail:'從沙壩下到老街市區約 35 公里、車程 1 小時，全程下坡彎道多，容易暈車的人請先吃藥。\n老街市就在中越邊境旁，可以看到對岸的中國河口。\n到了火車站先上洗手間，火車上的洗手間比較克難。',
     tags:['bus','pill','toilet']},
    {id:'d4f',day:4,time:'19:00',title:'晚餐：老街',
     desc:'在老街市區用晚餐，之後前往月台候車。',
     detail:'上車前請把水裝滿、想吃的零食先買好，火車上沒有餐車。\n建議先換上舒服好睡的衣服。',
     tags:['meal']},
    {id:'d4g',day:4,place:'Lao Cai Railway Station',time:'21:30',title:'搭夜臥火車',
     desc:'Chapa Express 臥鋪，21:30 發車，隔天 05:30 抵達河內。',
     detail:'搭的是 Chapa Express 觀光臥鋪列車，四人一間的上下舖，領隊會分配舖位，行李放在下舖底下或走道行李架。\n上舖有爬梯，長輩請睡下舖，上車先跟領隊講。\n貴重物品（護照、錢包、手機）請放在枕頭邊或隨身腰包，不要放在走道上。\n火車會搖晃且有聲音，帶耳塞和眼罩會好睡很多。\n車廂冷氣偏強，睡覺記得蓋好被子或加件外套。\n洗手間在車廂兩端，晚上走動請扶著扶手。',
     tags:['bed','coat','toilet','ticket']},

    /* ===== 第 5 天 9/28（日）河內 → 桃園 ===== */
    {id:'d5a',day:5,place:'Hanoi Railway Station',time:'05:30',title:'抵達河內',
     desc:'05:30 抵達河內火車站，清點行李下車。',
     detail:'下車前請把舖位、行李架、枕頭底下再檢查一次，火車靠站時間短，東西掉了很難找回來。\n月台燈光昏暗，請跟緊領隊，慢慢走不要趕。',
     tags:['ticket','walk']},
    {id:'d5b',day:5,time:'06:00',title:'早餐：河粉',
     desc:'河內道地牛肉河粉（Phở），這趟最後一餐越南味。',
     detail:'河粉配的生菜與豆芽是生的，腸胃敏感的人可以不要放。\n桌上的辣椒醬與魚露請先沾一點試味道，越南魚露比台灣的鹹。\n吃完可以買一杯越南煉乳咖啡在車上喝。',
     tags:['meal']},
    {id:'d5c',day:5,place:'Noi Bai International Airport Terminal 2',time:'08:00',title:'前往內排機場',
     desc:'車程約 45 分鐘，剩餘越盾可在機場花掉。',
     detail:'越盾出境後幾乎換不回來，也不好用，請在機場免稅店或便利商店花完。\n機場有賣咖啡、腰果、椰子糖，是常見的伴手禮。\n手推車在航廈外就有，長輩的行李可以先放上去。',
     tags:['cash','bus']},
    {id:'d5d',day:5,place:'Noi Bai International Airport Terminal 2',time:'09:00',title:'辦登機託運',
     desc:'🔴 華航、🟢 長榮分別到各自櫃檯，領隊統一辦理。',
     detail:'請把護照與登機證拿在手上，不要收進行李。\n買的山茶、草藥、水果乾請放託運；打火機不能託運也不能隨身（越南規定較嚴，建議直接丟掉）。\n過海關後在登機門附近等，不要走太遠去逛免稅店。',
     tags:['ticket']},
    {id:'d5e',day:5,time:'11:30',title:'華航起飛回台',
     desc:'11:30 起飛，台灣時間約 15:45 抵達桃園第一航廈。',
     detail:'領完行李在入境大廳解散，回程請注意台灣的天氣與交通。',
     tags:['ticket']},
    {id:'d5f',day:5,time:'12:05',title:'長榮起飛回台',
     desc:'12:05 起飛，台灣時間約 16:20 抵達桃園第二航廈。',
     detail:'領完行李在入境大廳解散，辛苦大家了，平安回家。',
     tags:['ticket']}
  ]},

/* ===== 工具函式 ===== */
var VN='Asia/Ho_Chi_Minh', TW='Asia/Taipei';
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad(n){ return (n<10?'0':'')+n; }
function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function tzParts(tz){
  var d=new Date();
  try{
    var f=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    var o={}; f.formatToParts(d).forEach(function(p){o[p.type]=p.value;});
    var h=parseInt(o.hour,10); if(h===24) h=0;
    return {date:o.year+'-'+o.month+'-'+o.day,h:h,m:parseInt(o.minute,10),hm:pad(h)+':'+o.minute};
  }catch(e){
    return {date:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),h:d.getHours(),m:d.getMinutes(),hm:pad(d.getHours())+':'+pad(d.getMinutes())};
  }
}
function parseDate(s){ var p=(s||'').split('-').map(Number); if(p.length<3||isNaN(p[0])) return NaN; return Date.UTC(p[0],p[1]-1,p[2]); }
function ymd(t){ if(isNaN(t)) return ''; var d=new Date(t); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); }
var WD=['日','一','二','三','四','五','六'];
/* 2026-09-24 → 9/24（四） */
function mdw(s){ var t=parseDate(s); if(isNaN(t)) return ''; var d=new Date(t); return (d.getUTCMonth()+1)+'/'+d.getUTCDate()+'（'+WD[d.getUTCDay()]+'）'; }
function dayDate(n){ var t=parseDate(S().settings.startDate); if(isNaN(t)) return ''; return mdw(ymd(t+(n-1)*86400000)); }
function dayInfo(){
  var st=S().settings, vn=tzParts(VN), days=st.days||5;
  var start=parseDate(st.startDate), today=parseDate(vn.date);
  var diff=isNaN(start)?0:Math.round((today-start)/86400000);
  if(st.dayOverride>0) return {idx:Math.min(st.dayOverride,days),status:'override',days:days,diff:diff};
  if(isNaN(start)) return {idx:1,status:'on',days:days,diff:0};
  if(diff<0) return {idx:1,status:'before',days:days,diff:diff};
  if(diff>=days) return {idx:days,status:'after',days:days,diff:diff};
  return {idx:diff+1,status:'on',days:days,diff:diff};
}
function fmtDur(min){
  if(min>=1440){ var dd=Math.floor(min/1440), hh=Math.floor((min%1440)/60); return dd+' 天'+(hh?' '+hh+' 小時':''); }
  if(min>=60) return Math.floor(min/60)+' 小時 '+(min%60?(min%60)+' 分':'');
  return min+' 分鐘';
}
/* 集合日期：優先用領隊在廣播裡選的 b.date；舊廣播沒有日期時，出發前一律當成第 1 天（出發日），
   旅程中／結束後當成今天——這樣既有的廣播不用重存也能算對。 */
function bcDate(){
  var b=S().broadcast||{}, st=S().settings;
  if(b.date&&!isNaN(parseDate(b.date))) return b.date;
  if(dayInfo().status==='before'&&!isNaN(parseDate(st.startDate))) return st.startDate;
  return tzParts(VN).date;
}
/* 距離集合還有幾分鐘（負數＝已經過了）；沒設集合時間就回 null。跨日靠 bcDate() 補上天數差。 */
function bcDiffMin(){
  var b=S().broadcast; if(!b||!b.time||b.time.indexOf(':')<0) return null;
  var vn=tzParts(VN), p=b.time.split(':').map(Number);
  var d0=parseDate(vn.date), d1=parseDate(bcDate());
  var days=(isNaN(d0)||isNaN(d1))?0:Math.round((d1-d0)/86400000);
  return days*1440+(p[0]*60+p[1])-(vn.h*60+vn.m);
}
function countdown(){
  var diff=bcDiffMin(); if(diff===null) return null;
  var bd=bcDate(), pre=(bd===tzParts(VN).date)?'':(mdw(bd)+' · ');
  if(diff>0) return {text:pre+'還有 '+fmtDur(diff),late:false};
  if(diff===0) return {text:'集合時間到了！',late:true};
  if(diff>-240) return {text:'已過 '+fmtDur(-diff),late:true};
  return null;
}
/* 標頭用的短倒數：跨日 15天／2天8h、1 小時以上 12h22、不足 1 小時 45分、過了就 已過 5分 */
function countdownShort(){
  var b=S().broadcast;
  if(!b||b.idle) return {text:'自由活動',cls:'none'};
  var diff=bcDiffMin();
  if(diff===null) return {text:'待公布',cls:'none'};
  function hm(n){ var d=Math.floor(n/1440), h=Math.floor((n%1440)/60), m=n%60;
    if(d>0) return d+'天'+((d<3&&h>0)?h+'h':'');
    return h>0 ? h+'h'+pad(m) : m+'分'; }
  if(diff>0) return {text:hm(diff), cls:(diff<=30?'late':'')};
  if(diff===0) return {text:'時間到',cls:'late'};
  if(diff>-240) return {text:'已過 '+hm(-diff),cls:'late'};
  return {text:'待公布',cls:'none'};
}

  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes=unescape(encodeURIComponent(str)), l=bytes.length, words=[];
  for(var i=0;i<l;i++) words[i>>2]|=bytes.charCodeAt(i)<<(24-(i%4)*8);
  words[l>>2]|=0x80<<(24-(l%4)*8); words[((l+8>>6)<<4)+15]=l*8;
  var w=new Array(64);
  for(var j=0;j<words.length;j+=16){
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(var t=0;t<64;t++){
      if(t<16) w[t]=words[j+t]|0;
      else { var s0=R(7,w[t-15])^R(18,w[t-15])^(w[t-15]>>>3), s1=R(17,w[t-2])^R(19,w[t-2])^(w[t-2]>>>10); w[t]=(w[t-16]+s0+w[t-7]+s1)|0; }
      var S1=R(6,e)^R(11,e)^R(25,e), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[t]+w[t])|0;
      var S0=R(2,a)^R(13,a)^R(22,a), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(function(x){ return ('00000000'+(x>>>0).toString(16)).slice(-8); }).join('');
}
function pinHash(pin){ return sha256('sapa-tour:'+String(pin||'')); }
/* 驗 PIN：優先比對雜湊；舊資料只有明文 pin 時也接受，並在領隊解鎖後自動升級成雜湊 */
function pinOK(input){ var st=S().settings||{};
  if(st.pinHash) return pinHash(input)===st.pinHash;
  return String(input)===String(st.pin||'8888'); }
function pinMigrate(){ var st=S().settings||{}; if(!st.pinHash){ st.pinHash=pinHash(st.pin||'8888'); delete st.pin; Store.save('settings'); } }

/* 巢狀路徑讀寫（給局部同步用）：path 形如 'present/x123' 或 'scenarios/0/assign/x9' */
function setPath(obj,path,val){ var ps=path.split('/'), o=obj; for(var i=0;i<ps.length-1;i++){ var k=ps[i]; if(o[k]==null||typeof o[k]!=='object') o[k]=(/^\d+$/.test(ps[i+1])?[]:{}); o=o[k]; } var last=ps[ps.length-1]; if(val===null||val===undefined){ if(Array.isArray(o)) o[last]=null; else delete o[last]; } else o[last]=clone(val); }

var Store={
  s:clone(DEFAULTS), mode:'local', lastSync:null, push:null, pushOp:null, backend:'', q:[], flushing:false, remoteTs:{},
  init:function(){
    try{ var c=JSON.parse(localStorage.getItem('sapa-data')||'null'); if(c&&c.docs){ DOC_KEYS.forEach(function(k){ if(c.docs[k]) Store.s[k]=c.docs[k]; }); if(c.at) Store.lastSync=new Date(c.at); if(c.q&&c.q.length) Store.q=c.q; } }catch(e){}
  },
  cache:function(){ try{ localStorage.setItem('sapa-data',JSON.stringify({docs:Store.s,at:Date.now(),q:Store.q})); }catch(e){} },
  /* 雲端快照進來：先套用雲端，再把「這支手機還沒送出去的修改」重新疊上去，離線期間的修改不會被舊快照蓋掉 */
  applyRemote:function(docs){
    var got=false;
    DOC_KEYS.forEach(function(k){ var r=docs[k]; if(r&&typeof r==='object'){ Store.s[k]=clone(r); Store.remoteTs[k]=r._ts||0; got=true; } });
    Store.q.forEach(function(op){ var d=Store.s[op.key]; if(!d||typeof d!=='object'){ d=Store.s[op.key]={}; }
      if(op.path){ setPath(d,op.path,op.val); if((d._ts||0)<op.ts) d._ts=op.ts; }
      else if(op.ts>=(d._ts||0)) Store.s[op.key]=clone(op.val); });
    Store.mode='cloud'; Store.lastSync=new Date(); Store.cache(); render(); Store.checkVersion(); Store.flush(); return got;
  },
  checkVersion:function(){ var st=Store.s.settings||{}; var min=st.minVersion; if(!min||Store._verToasted) return;
    if(String(min)>String(APP_VERSION)){ Store._verToasted=true; var t=el('toast'); t.innerHTML='有新版本 '+esc(min)+'，<a href="#" data-act="reloadApp" style="color:inherit;text-decoration:underline">點此重新載入</a>'; t.classList.add('show'); t.style.pointerEvents='auto'; clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove('show'); t.style.pointerEvents=''; },8000); } },
  /* 依 config.js 決定後端：firebase（正式版）→ claude db（預覽版）→ 單機 */
  connect:function(){
    var cfg=window.SAPA_CONFIG||{};
    if(cfg.sync==='firebase'&&cfg.firebase&&cfg.firebase.databaseURL) return Store.connectFirebase(cfg);
    if(window.claude&&typeof window.claude.use==='function') return Store.connectClaude();

  },
  connectFirebase:function(cfg){
    Store.mode='connecting'; Store.backend='firebase'; renderSync();
    var v=cfg.firebaseVersion||'10.14.1', base='https://www.gstatic.com/firebasejs/'+v+'/', root=cfg.path||'trip';
    var chain=loadScript(base+'firebase-app-compat.js').then(function(){ return loadScript(base+'firebase-database-compat.js'); });
    if(cfg.auth==='anon') chain=chain.then(function(){ return loadScript(base+'firebase-auth-compat.js'); });
    chain.then(function(){
      firebase.initializeApp(cfg.firebase);
      var ready=Promise.resolve();
      if(cfg.auth==='anon'&&firebase.auth) ready=firebase.auth().signInAnonymously().catch(function(){ toast('匿名登入失敗，改用唯讀模式'); });
      return ready;
    }).then(function(){
      var db=firebase.database();
      db.ref(root).on('value',function(snap){ var got=Store.applyRemote(snap.val()||{}); if(!got&&P.leader) toast('雲端尚無資料，領隊第一次修改後會自動建立'); },function(err){ Store.mode='offline'; renderSync(); });
      db.ref('.info/connected').on('value',function(sn){ if(Store.mode==='cloud'||Store.mode==='offline'){ Store.mode=sn.val()?'cloud':'offline'; renderSync(); if(sn.val()) Store.flush(); } });
      Store.pushOp=function(op){ if(op.path){ var u={}; u[op.key+'/'+op.path]=op.val; u[op.key+'/_ts']=op.ts; return db.ref(root).update(u); } return db.ref(root+'/'+op.key).set(op.val); };
      Store.push=true; Store.flush();
    }).catch(function(){ Store.mode='local'; renderSync(); toast('連不上雲端，先用單機模式'); });
  },
  connectClaude:function(){
    Store.mode='connecting'; Store.backend='claude'; renderSync();
    window.claude.use('db').then(function(db){
      if(!db){ Store.mode='local'; renderSync(); return; }
      db.collection('trip').onSnapshot(function(snap){
        var docs={}; snap.docs.forEach(function(d){ if(d.exists) docs[d.id]=d.data(); });
        var got=Store.applyRemote(docs); if(!got&&P.leader) toast('雲端尚無資料，領隊第一次修改後會自動建立');
      },function(err){ Store.mode='offline'; renderSync(); });
      /* claude db 沒有路徑更新，一律整份寫 */
      Store.pushOp=function(op){ return db.doc('trip/'+op.key).set(clone(Store.s[op.key])); };
      Store.push=true; Store.flush();
    }).catch(function(){ Store.mode='local'; renderSync(); });
  },
  /* 每一次修改都是一個 op：整份（path=''）或局部（path='present/x1'）。先存本機、排進佇列，連上線就依序送出 */
  enqueue:function(op){
    var q=Store.q, last=q[q.length-1];
    if(last&&last.key===op.key&&last.path===op.path&&!last.sending){ q[q.length-1]=op; } else q.push(op);
    Store.cache(); clearTimeout(Store._ft); Store._ft=setTimeout(Store.flush,300);
  },
  flush:function(){
    if(!Store.push||Store.flushing||!Store.q.length) return;
    var op=Store.q[0]; op.sending=true; Store.flushing=true;
    Promise.resolve().then(function(){ return Store.pushOp(op); })
      .then(function(){ Store.q.shift(); Store.flushing=false; Store.lastSync=new Date(); if(Store.mode!=='cloud') Store.mode='cloud'; Store.cache(); renderSync(); Store.flush(); })
      .catch(function(e){ op.sending=false; Store.flushing=false; Store.mode='offline'; renderSync(); toast('雲端儲存失敗，已先存在這支手機，連上線會自動補送'); });
  },
  save:function(key){
    var d=Store.s[key]; if(d&&typeof d==='object') d._ts=Date.now();
    Store.cache(); render();
    Store.enqueue({key:key,path:'',val:clone(d),ts:(d&&d._ts)||Date.now()});
  },
  /* 局部寫入：只送改到的那一格，兩支手機同時操作不會互相蓋掉 */
  savePath:function(key,path,val){
    var d=Store.s[key]; if(!d||typeof d!=='object') d=Store.s[key]={};
    setPath(d,path,val); d._ts=Date.now();
    Store.cache(); render();
    Store.enqueue({key:key,path:path,val:(val===undefined?null:clone(val)),ts:d._ts});
  },
  pushAll:function(){ DOC_KEYS.forEach(function(k){ Store.save(k); }); },
  exportJSON:function(){ return JSON.stringify({app:'sapa-tour-tool',version:APP_VERSION,exportedAt:new Date().toISOString(),docs:Store.s},null,2); },
  importJSON:function(text){ var o=JSON.parse(text); var docs=o&&o.docs?o.docs:o; var n=0; DOC_KEYS.forEach(function(k){ if(docs[k]&&typeof docs[k]==='object'){ Store.s[k]=clone(docs[k]); n++; } }); if(!n) throw new Error('檔案格式不對'); Store.pushAll(); return n; }
};

function renderHeader(){
  var st=S().settings, di=dayInfo(), days=di.days||st.days||5;
  el('hdTrip').textContent=st.tripName||'旅遊團';
  el('btnTrip').hidden=!P.leader;
  /* 狀態藥丸：六種階段，全部是不換行的短標籤 */
  var t,cls='';
  if(di.status==='before'){
    var d=-di.diff;
    if(d>1){ t='倒數 '+d+' 天'; }
    else if(d===1){ t='明天出發'; cls='warm'; }
    else { t='今天出發'; cls='warm'; }
  } else if(di.status==='after'){
    t=(di.diff<=7?'旅程圓滿結束':'旅程已結束'); cls=(di.diff<=7?'done':'');
  } else if(di.idx>=days){
    t='最後一天'; cls='warm';
  } else if(di.idx===1){
    t='今天出發'; cls='warm';
  } else {
    t='第 '+di.idx+'/'+days+' 天';
  }
  var dc=el('hdDay'); dc.textContent=t; dc.className='day-chip'+(cls?' '+cls:'');
  var tb=el('btnTheme');
  if(!P.theme){ tb.innerHTML=ic('auto'); tb.title='目前：跟隨系統'; tb.setAttribute('aria-label','主題：跟隨系統'); }
  else if(P.theme==='light'){ tb.innerHTML=ic('sun'); tb.title='目前：淺色'; tb.setAttribute('aria-label','主題：淺色'); }
  else { tb.innerHTML=ic('moon'); tb.title='目前：深色'; tb.setAttribute('aria-label','主題：深色'); }
  var b=el('btnLeader'); b.innerHTML=P.leader?badgeSVG('lead'):ic('lock'); b.classList.toggle('on',!!P.leader);
  var lb=el('leaderBarIcon'); if(lb&&!lb.innerHTML) lb.innerHTML=badgeSVG('lead');
}

var SHEET=null;
/* Android 返回鍵 / 瀏覽器上一頁：關掉 sheet 或全螢幕卡，而不是離開網站 */
var HIST={sheet:false,full:false};
function histPush(kind){ if(HIST[kind]) return; try{ history.pushState({sapa:kind},''); HIST[kind]=true; }catch(e){} }
function histPop(kind){ if(!HIST[kind]) return; HIST[kind]=false; try{ if(history.state&&history.state.sapa===kind) history.back(); }catch(e){} }
window.addEventListener('popstate',function(){ if(HIST.full){ HIST.full=false; closeFull(); return; } if(HIST.sheet){ HIST.sheet=false; closeSheet(); } });
function openSheet(o){
  SHEET=o;
  el('sheetRoot').innerHTML='<div class="sheet-bg" data-act="sheetBg"><div class="sheet'+(o.tall?' tall':'')+'" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-h"><span id="sheetTitle">'+o.title+'</span><button class="icon-btn" data-act="sheetClose" aria-label="關閉">'+ic('x')+'</button></div><div class="sheet-b">'+o.body+'</div>'+(o.foot?'<div class="sheet-f">'+o.foot+'</div>':'')+'</div></div>';
  var f=el('sheetRoot').querySelector('input:not([type=hidden]),textarea,select'); if(f&&o.focus) setTimeout(function(){ try{f.focus();}catch(e){} },50);

}

/* Tab 鍵只在 sheet／全螢幕卡內循環 */
document.addEventListener('keydown',function(ev){ if(ev.key!=='Tab') return; var root=el('fullRoot').firstChild||el('sheetRoot').firstChild; if(!root) return;
  var f=root.querySelectorAll('button:not([disabled]),a[href],input:not([type=hidden]):not([disabled]),select,textarea'); if(!f.length) return;
  var first=f[0], last=f[f.length-1];
  if(ev.shiftKey&&document.activeElement===first){ ev.preventDefault(); last.focus(); } else if(!ev.shiftKey&&document.activeElement===last){ ev.preventDefault(); first.focus(); } });
function sv(n){ var e=el('sheetRoot').querySelector('[name="'+n+'"]'); return e?e.value.trim():''; }
function fld(label,html){ return '<div class="f"><label>'+label+'</label>'+html+'</div>'; }
function timeField(n,v){ var p=String(v||'').split(':'); var hh=p[0]||'', mm=p[1]||''; var hs='<select class="in" data-tf="'+n+'" data-part="h" aria-label="時"><option value="">時</option>'; for(var i=0;i<24;i++){ var x=pad(i); hs+='<option value="'+x+'"'+(x===hh?' selected':'')+'>'+x+'</option>'; } hs+='</select>'; var mins=[]; for(var j=0;j<60;j+=5) mins.push(pad(j)); if(mm&&mins.indexOf(mm)<0) mins.push(mm); mins.sort(); var ms='<select class="in" data-tf="'+n+'" data-part="m" aria-label="分"><option value="">分</option>'+mins.map(function(x){return '<option value="'+x+'"'+(x===mm?' selected':'')+'>'+x+'</option>';}).join('')+'</select>'; return '<div class="tf">'+hs+'<b>:</b>'+ms+'<input type="hidden" name="'+n+'" value="'+esc(v||'')+'"></div>'; }
function setTimeField(n,v){ var root=el('sheetRoot'); var h=root.querySelector('input[name="'+n+'"]'); if(!h) return; h.value=v||''; var p=(v||'').split(':'); root.querySelectorAll('select[data-tf="'+n+'"]').forEach(function(sel){ var want=sel.getAttribute('data-part')==='h'?(p[0]||''):(p[1]||''); if(want&&!Array.prototype.some.call(sel.options,function(o){return o.value===want;})){ var o=document.createElement('option'); o.value=want; o.textContent=want; sel.appendChild(o); } sel.value=want; }); }

/* 加到主畫面 / 安裝 App 的圖文教學。

   長輩照著比對就找得到，不必再拍螢幕問人。 */
function sheetInstall(){
  var e=uaEnv(), n=0, h=[];
  function step(title,desc,fig){ n++; return '<div class="ig-s"><span class="ig-n">'+n+'</span><div class="tx"><b>'+title+'</b>'+(desc?'<small>'+desc+'</small>':'')+(fig||'')+'</div></div>'; }
  function shot(src,alt){ return '<img class="ig-shot" src="'+src+'" alt="'+esc(alt)+'" loading="lazy">'; }
  var why='<div class="ig-why">'+ic('info')+'<span>裝起來以後：<b>不用再選一次自己的名字</b>、沒訊號也打得開、打開沒有網址列，跟一般 App 一樣。</span></div>';
  var host=''; try{ host=location.hostname||'750hd.com'; }catch(x){ host='750hd.com'; }
  var url=''; try{ url=location.href.split('#')[0]; }catch(x){}

  if(e.inapp){
    var app=e.line?'LINE':'這個 App';
    h.push(step('先跳出 '+app+' 的瀏覽器','在 '+app+' 裡面沒辦法安裝。請按畫面'+(e.ios?'右下角':'右上角')+'的「⋯」，選「用其他瀏覽器開啟」或「用預設瀏覽器開啟」。',
      '<div class="ig-fig row2"><span class="dim">'+esc(host)+'</span><span class="ig-hi">⋯</span></div>'));
    h.push('<div class="ig-alt"><button class="btn sm" data-act="copyTxt" data-v="'+esc(url)+'">'+ic('clipboard')+'複製網址</button><small>找不到「⋯」的話，複製網址後自己貼到 '+(e.ios?'Safari':'Chrome')+' 的網址列開啟，再接著做下面的步驟。</small></div>');
  }

  if(e.ios){
    h.push(step('按右下角的「⋯」，再點「分享…」','「⋯」在螢幕最下面那一排的最右邊，點下去會跳出一個選單，裡面選「分享…」。<br>如果你的 iPhone 最下面直接就有分享鍵（'+ic('share')+'往上的箭頭），那就直接按它，跳過這一步。',
      '<div class="ig-fig bar"><span>‹</span><span>›</span><span>'+ic('book')+'</span><span>'+ic('grid')+'</span><span class="ig-hi ic">'+ic('dotsh')+'</span></div>'));
    h.push(step('按右邊的「檢視較多」','分享選單跳出來以後，如果沒看到「加入主畫面」，先點這裡把選單展開。',
      shot(IOS_SHOT.s1,'分享選單右下角的「檢視較多」按鈕被橘框標示')));
    h.push(step('往下滑，點「加入主畫面」','在展開後的清單最下面。',
      shot(IOS_SHOT.s2,'展開後的清單，最下面的「加入主畫面」被橘框標示')));
    h.push(step('右上角按「加入」','主畫面就會多一個圖示，以後直接點它進來。',
      shot(IOS_SHOT.s3,'加入主畫面畫面，右上角的藍色「加入」按鈕被橘框標示')));
  } else if(e.android){
    h.push(step('按右上角的「⋮」','Chrome 網址列最右邊，三個直的點。',
      '<div class="ig-fig row2"><span class="dim">'+esc(host)+'</span><span class="ig-hi ic">'+ic('dots')+'</span></div>'));
    h.push(step('選「安裝應用程式」','有的手機寫「加到主畫面」，兩個都一樣。',
      '<div class="ig-fig row2 ig-hi"><span>安裝應用程式</span>'+ic('install')+'</div>'));
    h.push(step('按「安裝」','主畫面就會多一個圖示，以後直接點它進來。',
      '<div class="ig-fig row2"><span class="dim">取消</span><span class="ig-hi go">安裝</span></div>'));
  } else {
    h.push(step('看網址列的右邊','Chrome 或 Edge 的網址列最右邊，會有一個「安裝」的小圖示。',
      '<div class="ig-fig row2"><span class="dim">'+esc(host)+'</span><span class="ig-hi ic">'+ic('install')+'</span></div>'));
    h.push(step('按下去，再按「安裝」','沒看到圖示的話，改按右上角「⋮」→「投放、儲存及分享」→「安裝網頁應用程式」。'));
  }
  openSheet({title:e.ios?'加到主畫面（照著做）':'安裝成 App（照著做）',tall:(e.ios||e.inapp),body:why+'<div class="ig">'+h.join('')+'</div>'});
}

document.addEventListener('click',function(ev){

  if(t.hasAttribute('disabled')) return;
  ACT[a](t,ev);
});

/* 全螢幕卡解鎖：按住 2 秒 */
(function(){ var tm=null;
  function down(e){ var b=e.target.closest&&e.target.closest('#unlockBtn'); if(!b) return; b.classList.add('hold'); tm=setTimeout(function(){ FULL_LOCK=false; openFull(taxiFull()); toast('已解鎖'); },2000); }
  function up(){ if(tm){ clearTimeout(tm); tm=null; } var b=el('unlockBtn'); if(b) b.classList.remove('hold'); }
  document.addEventListener('pointerdown',down); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up); document.addEventListener('pointerleave',up,true);
})();
/* ===== 鎖定畫面縮放 =====
   長輩連按兩下或兩指誤觸常把畫面放大後不會還原。字級請用右上角「AA」三段調整。
   viewport meta 擋住 Android；iOS Safari 會忽略 meta，所以另外攔 gesture 事件與雙擊。 */
(function(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev,function(e){ e.preventDefault(); },{passive:false});
  });
  /* 雙擊放大：只有「同一個位置、350ms 內的第二下」才擋，
     避免長輩快速連點兩個相鄰按鈕時第二下被吃掉 */
  var lastT=0,lastX=0,lastY=0;
  document.addEventListener('touchend',function(e){
    var t=(e.changedTouches&&e.changedTouches[0])||null; if(!t) return;
    var now=Date.now();
    if(now-lastT<=350 && Math.abs(t.clientX-lastX)<30 && Math.abs(t.clientY-lastY)<30) e.preventDefault();
    lastT=now; lastX=t.clientX; lastY=t.clientY;
  },{passive:false});
  document.addEventListener('touchmove',function(e){
    if(e.touches&&e.touches.length>1) e.preventDefault();   /* 兩指縮放 */
  },{passive:false});
})();
/* PWA：離線快取（只在 https 且非預覽環境註冊） */
if('serviceWorker' in navigator && location.protocol==='https:' && !(window.claude&&window.claude.use)){
