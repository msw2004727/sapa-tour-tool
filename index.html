<style>
:root{
  /* v3.27 汽水風（小麥選的 A 版）：奶油底、蜜桃橘、檸檬黃、薄荷、深葡萄色的字。
     幾個名字的意思跟以前不一樣了，改東西前先看：
     --indigo／--indigo-2  以前是藍色；現在是「強調用的文字色」（深橘褐）與它的淡底色，不當按鈕填色用。
     --pri／--pri-ink／--pri-edge  主要按鈕、選中狀態的填色（橘）、上面的字（深色）、按鈕底下那條厚邊。
     --hero…  即時廣播大卡（淺色＝深葡萄底＋檸檬黃時間；深色＝檸檬黃底）；--pre…＝今天行程／出發集合（蜜桃橘）；--done…＝旅程結束（薄荷）。
     --edge  卡片底下那條「厚邊」（0 3px 0）；--field／--field-line  輸入欄的底色與框線。
     文字對比都是算過的（每一組 ≥ 4.5:1，見 notes/03 第十六節）。 */
  --bg:#FFF6E9; --card:#FFFFFF; --ink:#2A2145; --ink-2:#514A6E; --ink-3:#6A6486; --line:#F1DFC6; --edge:#F1DFC6; --frame:#EFDCC0;
  --pri:#FF7043; --pri-ink:#2A1408; --pri-edge:#D9532A;
  --indigo:#A93610; --indigo-2:#FFE9DF;
  --terrace:#0B7A4E; --terrace-2:#DDF6EA; --terrace-ink:#FFFFFF;
  --alert:#C4400F; --alert-2:#FFEDE3; --warn:#C93A17; --warn-ink:#FFFFFF;
  --hero:#2A2145; --hero-ink:#FFF3E3; --hero-time:#FFD95A; --hero-edge:#15102B; --hero-deco:#FF7043;
  --pre:#FF9466; --pre-ink:#2A1408; --pre-edge:#E8743F; --pre-deco:#FFD95A;
  --done:#B9F0DD; --done-ink:#0F3B2E; --done-edge:#8FD9BD;
  --gold:#C99A1E; --gold-2:#FFF1B8;
  --danger:#C42B1B;
  --soft:#FFF0DC; --field:#FFFCF6; --field-line:#E0C69F;
  --chip-bg:#FFD95A; --chip-ink:#2A2145; --chip-edge:#E7B92E;
  --hl-bg:#FFFBEC; --hl-edge:#F0C64A; --hl-glow:rgba(201,154,30,.55); --hl-ink:#7A5B08; --hl-sw:#FFEDB8;
  --lead-bg:#2A2145; --focus-glow:rgba(255,112,67,.32);
  --band:#B9F0DD; --lcd-ink:#0F3B2E; --lcd-glow:transparent; --lcd-dim:#1F5E4B; --lcd-amber:#A93610; --lcd-amber-glow:transparent; --lcd-red:#B8261A; --lcd-red-glow:transparent;
  --indigo-ink:#FFFFFF; --dome:0 8px 16px rgba(255,112,67,.45);
  --bar:0 10px 24px rgba(42,33,69,.20),0 3px 0 #F1DFC6;
  --shadow:0 4px 0 #F1DFC6;
  --lift:0 4px 0 #F1DFC6,0 10px 22px rgba(42,33,69,.10);
  --r:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1631; --card:#2A2247; --ink:#FFF3E3; --ink-2:#D8CFEA; --ink-3:#AEA4CB; --line:#40356A; --edge:#120E22; --frame:#0F0B1E;
    --pri:#FF8A5C; --pri-ink:#2A1408; --pri-edge:#C8582D;
    --indigo:#FFB59A; --indigo-2:#3D2F5E;
    --terrace:#7EE3B4; --terrace-2:#1F3B3A; --terrace-ink:#0B2A1E;
    --alert:#FF8A5C; --alert-2:#4A2A24; --warn:#C93A17; --warn-ink:#FFFFFF;
    --hero:#FFD95A; --hero-ink:#2A2145; --hero-time:#2A2145; --hero-edge:#B08A1A; --hero-deco:#FF8A5C;
    --pre:#FF9466; --pre-ink:#2A1408; --pre-edge:#C8582D; --pre-deco:#FFD95A;
    --done:#86E3C8; --done-ink:#0B2A1E; --done-edge:#4FB596;
    --gold:#FFD95A; --gold-2:#4A3D1E;
    --danger:#FF8A80;
    --soft:#231C3D; --field:#1C1631; --field-line:#40356A;
    --chip-bg:#FFD95A; --chip-ink:#2A2145; --chip-edge:#B08A1A;
    --hl-bg:#2A2413; --hl-edge:#C9A23C; --hl-glow:rgba(201,154,30,.45); --hl-ink:#F0D488; --hl-sw:#3F3317;
    --lead-bg:#3D2F5E; --focus-glow:rgba(255,138,92,.38);
    --band:#2A2247; --lcd-ink:#86E3C8; --lcd-glow:transparent; --lcd-dim:#B8B0D6; --lcd-amber:#FFC062; --lcd-amber-glow:transparent; --lcd-red:#FF8A80; --lcd-red-glow:transparent;
    --indigo-ink:#2A1408; --dome:0 8px 16px rgba(255,138,92,.4);
    --bar:0 10px 24px rgba(0,0,0,.55),0 3px 0 #120E22;
    --shadow:0 4px 0 #120E22;
    --lift:0 4px 0 #120E22,0 12px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#1C1631; --card:#2A2247; --ink:#FFF3E3; --ink-2:#D8CFEA; --ink-3:#AEA4CB; --line:#40356A; --edge:#120E22; --frame:#0F0B1E;
  --pri:#FF8A5C; --pri-ink:#2A1408; --pri-edge:#C8582D;
  --indigo:#FFB59A; --indigo-2:#3D2F5E;
  --terrace:#7EE3B4; --terrace-2:#1F3B3A; --terrace-ink:#0B2A1E;
  --alert:#FF8A5C; --alert-2:#4A2A24; --warn:#C93A17; --warn-ink:#FFFFFF;
  --hero:#FFD95A; --hero-ink:#2A2145; --hero-time:#2A2145; --hero-edge:#B08A1A; --hero-deco:#FF8A5C;
  --pre:#FF9466; --pre-ink:#2A1408; --pre-edge:#C8582D; --pre-deco:#FFD95A;
  --done:#86E3C8; --done-ink:#0B2A1E; --done-edge:#4FB596;
  --gold:#FFD95A; --gold-2:#4A3D1E;
  --danger:#FF8A80;
  --soft:#231C3D; --field:#1C1631; --field-line:#40356A;
  --chip-bg:#FFD95A; --chip-ink:#2A2145; --chip-edge:#B08A1A;
  --hl-bg:#2A2413; --hl-edge:#C9A23C; --hl-glow:rgba(201,154,30,.45); --hl-ink:#F0D488; --hl-sw:#3F3317;
  --lead-bg:#3D2F5E; --focus-glow:rgba(255,138,92,.38);
  --band:#2A2247; --lcd-ink:#86E3C8; --lcd-glow:transparent; --lcd-dim:#B8B0D6; --lcd-amber:#FFC062; --lcd-amber-glow:transparent; --lcd-red:#FF8A80; --lcd-red-glow:transparent;
  --indigo-ink:#2A1408; --dome:0 8px 16px rgba(255,138,92,.4);
  --bar:0 10px 24px rgba(0,0,0,.55),0 3px 0 #120E22;
  --shadow:0 4px 0 #120E22;
  --lift:0 4px 0 #120E22,0 12px 24px rgba(0,0,0,.4);
}
html{font-size:16px;-webkit-text-size-adjust:100%;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
html[data-fs="lg"]{font-size:18px}
html[data-fs="xl"]{font-size:20px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;touch-action:pan-x pan-y;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;line-height:1.4;overscroll-behavior-y:contain}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,.in:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
a{color:var(--indigo)}
svg.i{width:1.25rem;height:1.25rem;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* 注意：overflow-x:hidden 會讓 .app 變成捲動容器、position:sticky 失效（標頭時鐘會被捲走）；clip 不會 */
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow-x:clip}
@media (min-width:640px){
  body{background:var(--frame)}
  .app{box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.28)}
}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);box-shadow:0 1px 0 var(--line);flex-shrink:0;padding-top:env(safe-area-inset-top)}
.top-r1{display:flex;align-items:center;gap:.3rem;padding:.45rem .6rem .25rem 1rem}
/* 團名放不下時換成兩行（320px 旁邊有天數與三顆鈕，一行只剩 4～5 個字），不要用「…」吃掉 */
.trip-name{flex:1;min-width:0;font-weight:900;font-size:18px;line-height:1.15;letter-spacing:.01em;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.pen{width:20px;height:20px;border-radius:6px;border:1px dashed var(--ink-3);color:var(--ink-3);background:transparent;display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;padding:0;line-height:1;margin-right:.15rem}
.day-chip{font-size:.875rem;font-weight:900;border-radius:999px;padding:.12rem .65rem;white-space:nowrap;word-break:keep-all;flex-shrink:0;line-height:1.5;background:var(--chip-bg);color:var(--chip-ink);margin-right:.15rem;transform:rotate(-2deg);box-shadow:0 3px 0 var(--chip-edge)}
.day-chip.warm{background:var(--alert-2);color:var(--alert);box-shadow:0 3px 0 var(--line)}
.day-chip.done{background:var(--terrace-2);color:var(--terrace);box-shadow:0 3px 0 var(--line)}
/* 時間帶：一顆薄荷色（深色主題是葡萄色）的膠囊。圓角用 1.4rem 不用 999px：字級放大、兩行時不會被圓角切到字 */
.top-r2{background:var(--band);border-radius:1.4rem;margin:.1rem .6rem .6rem;display:flex;align-items:center;justify-content:center;padding:.3rem .8rem;min-height:2.3rem}
.lcd{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;column-gap:.35rem;row-gap:.2rem;background:none;border-radius:0;padding:0;
  font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;max-width:100%;overflow:hidden}
.lcd .lg1,.lcd .lg2{display:inline-flex;align-items:baseline;gap:.3rem;white-space:nowrap;flex:0 0 auto}
.lcd .dot{width:.4rem;height:.4rem;border-radius:50%;background:var(--lcd-dim);flex-shrink:0;align-self:center}
.lcd .dot.on{background:var(--terrace)}
.lcd .dot.off{background:var(--alert)}
.lcd .sy{font-size:.8rem;font-weight:800;color:var(--lcd-dim);flex-shrink:0}
.lcd .lb{font-size:.68rem;font-weight:900;color:var(--lcd-dim);letter-spacing:.08em;flex-shrink:0}
.lcd .n{font-size:1.3rem;font-weight:900;letter-spacing:-.01em;color:var(--lcd-ink);text-shadow:0 0 8px var(--lcd-glow);flex-shrink:0}
.lcd .tw{font-size:.8rem;font-weight:700;color:var(--lcd-dim);flex-shrink:0}
.lcd .dv{width:1px;height:.8rem;background:var(--lcd-dim);opacity:.4;align-self:center;margin:0 .05rem;flex-shrink:0}
.lcd .cd{font-size:.8rem;font-weight:900;color:var(--lcd-amber);text-shadow:0 0 8px var(--lcd-amber-glow);flex-shrink:0;letter-spacing:.01em}
.lcd .cd .k{font-size:.68rem;font-weight:900;color:var(--lcd-dim);letter-spacing:.06em;margin-right:.22rem;text-shadow:none}
.lcd .cd.late{color:var(--lcd-red);text-shadow:0 0 8px var(--lcd-red-glow)}
.lcd .cd.none{color:var(--lcd-dim);text-shadow:none}
html[data-fs="xl"] .lcd .dv2{display:none}
/* 面板分成「當地｜台灣」與「集合倒數｜連線」兩組；放不下一行時第二組自動換到下一行，
   中間那條分隔線在換行時藏起來。這樣字級可以放大到看得清楚，不用為了塞成一行而縮字。 */
@media (max-width:360px){
  html[data-fs="lg"] .lcd .dv2,html[data-fs="xl"] .lcd .dv2{display:none}
}
.sync .me{color:var(--ink);font-weight:900;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{position:relative;width:40px;height:40px;border-radius:14px;border:0;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--edge);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:900;font-size:14px;padding:0;line-height:1}
.icon-btn svg.i{width:20px;height:20px}
.top-r1 .icon-btn::before{content:"";position:absolute;inset:-2px}   /* 看得到的是 40px，感應範圍撐到 44px */
.pen::before{content:"";position:absolute;inset:-7px -5px}
/* 320px 這一級的窄螢幕：旁邊有天數與三顆鈕，團名只剩 1～2 個字。鈕看得到的縮成 36px（感應範圍仍撐到 44px）、間距收小，讓團名能排成兩行讀完 */
@media (max-width:360px){
  .top-r1{gap:5px;padding:.45rem .5rem .25rem .75rem}
  .top-r1 .icon-btn{width:36px;height:36px}
  .top-r1 .icon-btn::before{inset:-4px}
  .day-chip{padding:.12rem .5rem}
}
.pen{position:relative}
.icon-btn.on{background:var(--lead-bg);color:#FFD95A;box-shadow:0 3px 0 var(--edge)}
.sync{font-size:.85rem;color:var(--ink-3);font-weight:700;padding:.28rem .8rem;display:flex;align-items:center;gap:.4rem;background:var(--card);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.leader-bar{background:var(--gold-2);color:var(--ink);font-size:.875rem;font-weight:800;padding:.35rem .85rem;display:flex;align-items:center;gap:.4rem;border-bottom:1px solid var(--line)}
.leader-bar .sp{flex:1}
/* 離線提示條：離線或連不上時顯示「資料更新於幾點」，讓人知道看到的集合時間可能是舊的 */
.offbar{background:var(--alert-2);color:var(--ink);font-size:.9rem;font-weight:800;padding:.4rem .85rem;display:flex;align-items:center;gap:.45rem;border-bottom:1px solid var(--line);line-height:1.3}
.offbar svg.i{width:1.1rem;height:1.1rem;color:var(--alert);flex-shrink:0}
/* 新版本提示條：不會自己消失，按了才走 */
.simbar{background:repeating-linear-gradient(135deg,#5B2A86 0 14px,#4A2170 14px 28px);color:#fff;font-size:.95rem;font-weight:700;padding:.5rem .85rem;display:flex;align-items:center;gap:.5rem;line-height:1.3;flex-wrap:wrap}
.simbar svg{width:1.2rem;height:1.2rem;flex-shrink:0}
.simbar small{font-size:.875rem;font-weight:600;opacity:.95}
.simbar>span:not(.sim-b){flex:1 1 11rem;min-width:0}
.simbar .sim-b{display:flex;gap:.4rem;margin-left:auto}
.simbar button{border:0;border-radius:8px;font-weight:900;font-size:.95rem;min-height:2.75rem;padding:0 .7rem;background:#fff;color:#4A2170;flex-shrink:0}
.verbar{background:var(--indigo);color:var(--indigo-ink);font-size:.95rem;font-weight:800;padding:.5rem .85rem;display:flex;align-items:center;gap:.5rem;line-height:1.3}
.verbar .sp{flex:1}
.verbar button{border:0;border-radius:8px;font-weight:900;font-size:.95rem;min-height:2.75rem;padding:0 .7rem;background:var(--indigo-ink);color:var(--indigo);flex-shrink:0}
.verbar button.dim{background:transparent;color:var(--indigo-ink);text-decoration:underline}
/* 首頁固定的緊急求助列（隨時查區最後一張）：標題一行、按鈕一行，按鈕平分寬度 */
.sos-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;background:var(--card);border:1.5px solid var(--alert);border-radius:var(--r);padding:.65rem .8rem}
.sos-row .t{flex-basis:100%;min-width:0;font-weight:900;font-size:1.05rem;color:var(--ink);display:flex;align-items:center;gap:.4rem}
.sos-row .t svg.i{color:var(--alert);width:1.25rem;height:1.25rem}
.sos-row .btn{min-height:2.75rem;padding:0 .6rem;flex:1 1 0;min-width:0;white-space:nowrap}
.sos-row .btn.go{flex:1 1 0;padding:0 .5rem}
/* 320px 配大字：兩顆文字按鈕各佔一行，箭頭鈕跟 LINE 同一行 */
@media (max-width:360px){
  html[data-fs="lg"] .sos-row .btn.warn,html[data-fs="xl"] .sos-row .btn.warn{flex-basis:100%}
}
.leader-bar button{border:0;background:transparent;color:var(--indigo);font-weight:900;font-size:.875rem;min-height:2.4rem;padding:0 .3rem}
/* main + tabs */
main{flex:1;padding:.75rem .75rem calc(104px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.8rem}
/* 底部選單：浮起來的膠囊（離螢幕邊緣 12px），中間的「首頁」是凸出來的橘色圓鈕 */
.tabbar{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:416px;background:var(--card);border-radius:28px;box-shadow:var(--bar);display:flex;align-items:flex-end;padding:0 6px 6px;z-index:20}
.tab{flex:1;min-height:58px;border:0;background:none;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.875rem;font-weight:800;white-space:nowrap;word-break:keep-all;padding:6px 0 5px}
.tab svg.i{width:23px;height:23px}
.tab.on{color:var(--indigo)}
.tab-home{flex:1;min-width:0;position:relative;border:0;background:none;font:inherit;cursor:pointer;min-height:58px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 0 5px}
.tab-home .dome{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;
  background:var(--pri);color:var(--pri-ink);display:flex;align-items:center;justify-content:center;
  box-shadow:var(--dome);border:4px solid var(--card)}
.tab-home .dome svg.i{width:28px;height:28px}
.tab-home .lb{font-size:.875rem;font-weight:800;color:var(--ink-3);white-space:nowrap;word-break:keep-all;line-height:1.2}
.tab-home.on .lb{color:var(--indigo);font-weight:900}
.tab-home:focus-visible{outline:2px solid var(--indigo);outline-offset:-3px;border-radius:8px}
/* cards + buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.9rem}
/* 卡片底下那條厚邊（汽水風的立體感）。「稍後」「隨時查」兩區不加（見 .g-later／.g-ref），保留原本的明度階梯 */
.card,.ccard,.room,.grp,.tcard,.info-card,.wifi-card,.stop,.ph,.em-row,.bk-row,.ck-row,.note-item,.search,.sos-row,.total,.me-strip button,.catbar button,.dayrow button{box-shadow:0 3px 0 var(--edge)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:.2rem .5rem;margin-bottom:.65rem;flex-wrap:wrap}
.card-h h2{margin:0;font-size:1.05rem;font-weight:900;display:flex;align-items:center;gap:.4rem;white-space:nowrap}
.card-h .sub{font-size:.875rem;color:var(--ink-3);font-weight:700;white-space:nowrap}
h2.sec{margin:.25rem 0 0;font-size:1rem;font-weight:900;color:var(--ink-2);display:flex;align-items:center;gap:.4rem}
.muted{color:var(--ink-3);font-size:.88rem;font-weight:600}
a.btn{text-decoration:none}
.btn{min-height:3rem;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:1rem;padding:0 1.1rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;white-space:nowrap;word-break:keep-all;line-height:1.2;box-shadow:0 3px 0 var(--edge)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn svg.i{width:1.2rem;height:1.2rem}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);box-shadow:0 3px 0 var(--pri-edge)}
.btn.pri:active{box-shadow:0 1px 0 var(--pri-edge)}
.btn.ok{background:var(--terrace);color:var(--terrace-ink);border-color:var(--terrace)}
.btn.warn{background:var(--warn);color:var(--warn-ink);border-color:var(--warn)}
.btn.soft{background:var(--indigo-2);color:var(--indigo);border-color:transparent;box-shadow:none}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:2.75rem;font-size:.9rem;padding:0 .8rem}
.btn.block{width:100%}
.btn.wrap{white-space:normal;text-align:left;justify-content:flex-start;padding:.55rem 1rem;line-height:1.3;border-radius:22px}
.btn.big{min-height:4.2rem;font-size:1.15rem;justify-content:flex-start;padding:0 1.1rem;text-align:left;border-radius:24px}
.btn.big svg.i{width:1.6rem;height:1.6rem}
.btn.big .b2{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.btn.big .b2 small{font-size:.875rem;color:var(--ink-3);font-weight:700;white-space:normal;line-height:1.2}
.row{display:flex;gap:.5rem;flex-wrap:wrap}
.row>.btn{flex:1 1 auto;min-width:0}
.btn.warn .b2 small,.btn.pri .b2 small,.btn.ok .b2 small{color:inherit;opacity:.88}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.stack{display:flex;flex-direction:column;gap:.6rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.35rem .7rem;font-size:.85rem;font-weight:800;background:var(--indigo-2);color:var(--indigo);white-space:nowrap;word-break:keep-all;border:1.5px solid transparent;min-height:2.2rem}
.chip.pick{background:var(--card);color:var(--ink);border:2px solid var(--line);min-height:2.75rem}
.chip.pick.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);box-shadow:0 3px 0 var(--pri-edge)}
.seg{display:flex;background:var(--indigo-2);border-radius:999px;padding:.25rem;gap:.25rem}
.seg button{flex:1;min-height:2.8rem;border:0;border-radius:999px;background:transparent;color:var(--indigo);font-weight:900;font-size:.95rem;white-space:nowrap;word-break:keep-all;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--edge)}
/* hero broadcast */
/* 三種首頁大卡共用這一組變數（--h-…）：預設是即時廣播（淺色＝深葡萄底、深色＝檸檬黃底），.pre＝今天行程／出發集合（蜜桃橘），.done＝旅程結束（薄荷）。
   底色一律是單色（不用漸層），測試才量得到對比。 */
.hero{--h-bg:var(--hero);--h-ink:var(--hero-ink);--h-time:var(--hero-time);--h-edge:var(--hero-edge);--h-deco:var(--hero-deco);--h-pill-bg:var(--hero-time);--h-pill-ink:var(--hero);
  background:var(--h-bg);color:var(--h-ink);border-radius:28px;padding:1.05rem 1.1rem 1.15rem;box-shadow:0 6px 0 var(--h-edge);position:relative;overflow:hidden}
.hero.pre{--h-bg:var(--pre);--h-ink:var(--pre-ink);--h-time:var(--pre-ink);--h-edge:var(--pre-edge);--h-deco:var(--pre-deco);--h-pill-bg:#2A2145;--h-pill-ink:#FFD95A}
.hero.done{--h-bg:var(--done);--h-ink:var(--done-ink);--h-time:var(--done-ink);--h-edge:var(--done-edge);--h-deco:var(--pre-deco);--h-pill-bg:#2A2145;--h-pill-ink:#FFD95A}
.hero::before{content:"";position:absolute;right:-2.6rem;top:-2.6rem;width:8.2rem;height:8.2rem;border-radius:50%;background:var(--h-deco)}
.hero>*{position:relative}   /* 圓形裝飾在最底下，文字都要疊在它上面 */
.hero .lab{display:flex;align-items:center;gap:.15rem .4rem;font-size:.9rem;font-weight:800;letter-spacing:.06em;white-space:nowrap;flex-wrap:wrap}
.hero .lab .upd{margin-left:auto;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;flex:0 1 auto;min-width:0;background:#fff;color:#2A2145;border-radius:999px;padding:.1rem .65rem}   /* 放不下就整段換到下一行，不截斷日期 */
.hero .time{font-size:2.9rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:.45rem 0 .15rem;display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;color:var(--h-time)}
.hero .time small{font-size:1.15rem;font-weight:900;background:var(--h-pill-bg);color:var(--h-pill-ink);border-radius:999px;padding:.12rem .8rem;letter-spacing:0}
.hero .count{display:inline-flex;align-items:center;gap:.3rem;background:rgba(255,255,255,.2);border-radius:999px;padding:.3rem .75rem;font-weight:900;font-size:.98rem;margin:.35rem 0 .1rem;font-variant-numeric:tabular-nums}
.hero .count.late{background:#fff;color:#C4400F}
.hero .loc{font-size:1.2rem;}
.hero .loc.long{font-size:1.02rem;}
.hero .loc{font-weight:900;display:flex;gap:.4rem;align-items:flex-start;margin-top:.55rem;line-height:1.3}
.hero .tip{margin-top:.75rem;background:#fff;color:#2A2145;border-radius:18px;padding:.65rem .8rem;font-size:1rem;font-weight:700;line-height:1.45;display:flex;gap:.45rem;align-items:flex-start}
.hero .tip svg.i{color:#C4400F;margin-top:.1rem}   /* 叮嚀框兩種主題都是白底，圖示固定用深橘（跟著 --alert 的話深色主題會變成淺橘配白底） */
.hero .ctl{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.75rem}
.hero .ctl .btn{background:rgba(255,255,255,.96);color:#2A2145;border-color:transparent;min-height:2.9rem;font-size:.95rem;padding:0 .5rem}
.hero .clr{display:inline-flex;align-items:center;gap:.25rem;margin-top:.5rem;border:0;background:transparent;color:var(--h-ink);font-weight:800;font-size:.82rem;padding:.3rem .2rem;min-height:2.2rem;text-decoration:underline;text-underline-offset:3px}
.hero .clr svg.i{width:1rem;height:1rem}
/* 清空廣播（左）與貼到 LINE（右）左右鏡像；只剩一顆時貼到 LINE 仍靠右 */
.hero .hero-foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.hero .hero-foot .clr.shr{margin-left:auto;white-space:nowrap;word-break:keep-all}
/* me strip */
.me-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;grid-auto-flow:row dense}
.me-strip button.w2{grid-column:span 2}
.me-strip button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:.55rem .3rem;min-height:4.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;color:var(--ink)}
.me-strip .k{font-size:.75rem;color:var(--ink-3);font-weight:800}
.me-strip .v{font-size:1.25rem;font-weight:900;white-space:nowrap;line-height:1.15}
.me-strip .v.s{font-size:1rem}
/* 「集合」那格是主辦人自己寫的一句話（時間＋地點），長度不一定：允許換行，不要撐出格子 */
.me-strip .v.s.n{white-space:normal;text-align:center;font-size:.95rem;line-height:1.25;overflow-wrap:anywhere}
.me-hint{display:flex;align-items:center;gap:.6rem;background:var(--indigo-2);border-radius:12px;padding:.7rem .85rem;color:var(--indigo);font-weight:800;min-height:3.4rem;border:0;width:100%;text-align:left;font-size:1rem}
.me-hint svg.i{margin-left:auto}
/* morning */
.mo{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.mo div{background:var(--bg);border-radius:10px;padding:.5rem .2rem;text-align:center}
.mo .k{font-size:.75rem;color:var(--ink-3);font-weight:800}
.mo .v{font-size:1.15rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.mo-note{margin-top:.55rem;font-size:.92rem;color:var(--ink-2);font-weight:600;line-height:1.4}
/* hotel */
.kv{display:grid;grid-template-columns:auto 1fr;gap:.3rem .7rem;font-size:.95rem}
.kv dt{color:var(--ink-3);font-weight:800;white-space:nowrap}
.kv dd{margin:0;font-weight:700;word-break:break-word}
/* itinerary */
.dayrow{display:flex;gap:.4rem;overflow-x:auto;padding:.15rem .1rem .3rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dayrow::-webkit-scrollbar{display:none}
.dayrow button{flex-shrink:0;min-width:4.7rem;min-height:3.5rem;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:.3rem .5rem}
.dayrow button small{font-size:.85rem;color:var(--ink-3);font-weight:700}
.dayrow button.today{border-color:var(--terrace)}
.dayrow button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);box-shadow:0 3px 0 var(--pri-edge)}
.dayrow button.on small{color:var(--pri-ink);opacity:.8}
.dayrow.fit{display:grid;grid-template-columns:repeat(var(--days,5),minmax(0,1fr));gap:.3rem;overflow:visible;padding:.3rem 0 .2rem}
.dayrow.fit button{min-width:0;width:100%;padding:.35rem .1rem;font-size:clamp(.78rem,3.6vw,.95rem);letter-spacing:-.02em;position:relative;white-space:nowrap}
.dayrow.fit button small{font-size:clamp(.8rem,3.4vw,.9rem)}
.dayrow.fit button .td{position:absolute;top:-.3rem;right:-.2rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--terrace);border:2px solid var(--card)}
.day-title{display:flex;align-items:baseline;gap:.5rem;margin:.2rem 0 -.2rem}
.day-title b{font-size:1.15rem;font-weight:900}
.stop{display:grid;grid-template-columns:62px 1fr;gap:.6rem;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:.85rem;position:relative;margin-top:.35rem}
.stop.cur{border:2.5px solid var(--terrace);background:var(--terrace-2)}
.stop.off{opacity:.62}
.stop.off .t-title{text-decoration:line-through}
.t-time{font-weight:900;font-size:1.15rem;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--indigo);letter-spacing:-.01em}
.stop.cur .t-time{color:var(--terrace)}
.t-time span{display:block;font-size:.8rem;color:var(--ink-3);font-weight:800;margin-top:.1rem}
.t-title{font-size:clamp(20px,1.25rem,22px);font-weight:900;line-height:1.25;margin:0 0 .3rem}
.t-desc{font-size:1rem;color:var(--ink-2);margin:0 0 .5rem;line-height:1.45;font-weight:500}
.t-detail{font-size:.98rem;line-height:1.6;color:var(--ink);border-top:1px dashed var(--line);padding-top:.55rem;margin-top:.45rem;white-space:pre-line}
.badge{position:absolute;top:-.65rem;right:.8rem;background:var(--terrace);color:var(--terrace-ink);font-size:.75rem;font-weight:900;border-radius:999px;padding:.22rem .65rem;letter-spacing:.04em}
.badge.off{background:var(--ink-3)}
/* ===== 行程卡片底圖（每個行程項目一張，整面極淡）=====
   畫在 ::before：卡片不能設 overflow:hidden，不然「進行中」徽章（top:-.65rem）會被裁掉。
   內容統一抬到 z-index:1，文字永遠蓋在圖上面。實測 9% + 去彩度時，
   標題對比度 13:1、說明 6.3:1，深淺色都遠高於 WCAG 的 4.5:1。 */
.stop.has-bg::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:0;pointer-events:none;
  background-image:var(--dbg);background-size:cover;background-position:center;
  opacity:var(--dop,.09);filter:grayscale(1)}
.stop.has-bg>*{position:relative;z-index:1}
/* 「進行中」那張本來就有綠底，圖再疊上去會混濁，濃度砍一半 */
.stop.has-bg.cur::before{opacity:calc(var(--dop,.09) * .55)}
/* 首頁「今日行程」主卡每一列前面的時間（薄荷／橘色的小膠囊；進行中那一站換成綠色） */
.tm{flex:none;min-width:3.6rem;text-align:center;font-variant-numeric:tabular-nums;font-weight:900;background:var(--indigo-2);color:var(--indigo);border-radius:12px;padding:.12rem .5rem}
.tm.cur{background:var(--terrace-2);color:var(--terrace)}
/* 首頁「今日行程／第 1 天預告」：每一列等高（至少 44px，跟地圖鈕一樣高，有沒有地圖鈕都一樣高）、時間欄同寬；
   沒填時間的列用小圓點佔位，標題才對得齊（v3.32） */
.pv{display:flex;flex-direction:column}
.pv-row{display:flex;align-items:center;gap:.6rem;min-height:2.75rem}
.pv-row+.pv-row{border-top:1px solid var(--line)}
.pv-row.off{opacity:.55;text-decoration:line-through}
.pv-row .tm{min-width:4rem;box-sizing:border-box}
.pv-row .tm.none{background:none;padding:0;display:flex;align-items:center;justify-content:center}
.pv-row .tm.none::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--ink-3);opacity:.55}
.pv-t{flex:1;min-width:0;padding:.35rem 0;font-weight:600;line-height:1.35;overflow-wrap:anywhere;text-wrap:balance}
.pv-row.cur .pv-t{font-weight:900}
.pv-now{min-height:1.5rem;padding:.05rem .5rem;font-size:.75rem;background:var(--terrace-2);color:var(--terrace)}
/* 首頁的「今日行程」主卡不套底圖，所以這裡沒有 .card 的規則。 */
@media (prefers-reduced-motion: no-preference){.stop.has-bg::before{transition:opacity .18s}}

/* ===== 底圖編輯（行程編輯表單內）===== */
.dbg-sub{display:block;font-size:.76rem;font-weight:700;color:var(--ink-3);margin-top:.1rem}
.dbg-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:.7rem;overflow:hidden;
  border:1px solid var(--line);background:var(--soft) center/cover no-repeat;touch-action:none;
  display:flex;align-items:center;justify-content:center}
.dbg-frame img{position:absolute;left:50%;top:50%;transform-origin:center;max-width:none;will-change:transform}
.dbg-hint{font-size:.85rem;font-weight:700;color:var(--ink-3);pointer-events:none}
.dbg-row{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
.dbg-row>span{flex:none;width:2.6rem;font-size:.82rem;font-weight:900;color:var(--ink-2)}
.dbg-row input[type=range]{flex:1;min-width:0;accent-color:var(--indigo);height:2rem}
.dbg-row output{flex:none;width:2.6rem;text-align:right;font-size:.82rem;font-weight:900;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.dbg-tip{font-size:.78rem;margin-top:.25rem}
/* 效果預覽：一張縮小的行程卡，讓管理者套用前就看到文字會不會被吃掉 */
.dbg-prev{position:relative;display:grid;grid-template-columns:48px 1fr;gap:.5rem;margin-top:.6rem;
  background:var(--card);border:1.5px solid var(--line);border-radius:.7rem;padding:.6rem;overflow:hidden}
.dbg-prev::before{content:"";position:absolute;inset:0;background-image:var(--dbg);background-size:cover;
  background-position:center;opacity:var(--dop,0);filter:grayscale(1)}
.dbg-prev>*{position:relative;z-index:1}
.dbg-prev .pv-t{font-weight:900;font-size:.95rem;color:var(--indigo);font-variant-numeric:tabular-nums}
.dbg-prev b{display:block;font-size:1rem;font-weight:900;line-height:1.3}
.dbg-prev span{display:block;font-size:.85rem;color:var(--ink-2);font-weight:500;margin-top:.1rem}
.dbg-btns{margin-top:.6rem}
.dbg-size{font-size:.78rem;margin-top:.4rem}
.tags{display:flex;gap:.35rem;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:.3rem;border-radius:8px;padding:.28rem .5rem;font-size:.85rem;font-weight:800;background:var(--bg);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.tag svg.i{width:1rem;height:1rem}
.stop.cur .tag{background:var(--card)}
.lead-ctl{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem;border-top:1px solid var(--line);padding-top:.6rem;margin-top:.25rem}
.lead-ctl .btn{padding:0 .2rem;min-height:2.7rem;font-size:.82rem;flex-direction:column;gap:.1rem}
.lead-ctl .btn svg.i{width:1.1rem;height:1.1rem}
/* member cards */
.mc{display:flex;align-items:center;gap:.6rem;border-radius:16px;padding:.6rem .7rem;min-height:3.6rem;background:#fff;color:#2A2145;border:2px solid #F1DFC6;position:relative;text-align:left;width:100%}
.mc.bg-yellow{background:#FFF1A8}.mc.bg-pink{background:#FFD9E3}.mc.bg-green{background:#DDF3C9}.mc.bg-blue{background:#D8E9FF}
.mc.bd-gold{border:3px solid #C99A1E}.mc.bd-red{border:3px dashed #D32F2F}.mc.bd-black{border:3px solid #2A2145}
.mc .em{width:2rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.mc .em.none{width:.2rem}
.mc .tx{min-width:0;flex:1}
/* 姓名太長就換行（英文護照名一行、中文名一行），不要用「…」切掉：長輩要認的是中文名。keep-all＝只在空格換行，不把中文名拆開 */
.mc .nm{display:block;font-size:1.125rem;font-weight:900;line-height:1.2;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.mc .rk{display:block;font-size:.85rem;color:#514A6E;font-weight:700;margin-top:.22rem;line-height:1.3}
.mc .rt{text-align:right;font-size:.875rem;font-weight:900;color:#514A6E;flex-shrink:0;white-space:nowrap;line-height:1.25}
.al{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;border-radius:50%;font-size:.74rem;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:.02em;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.al.s3{font-size:.6rem;letter-spacing:0}
.al.lg.s3{font-size:.72rem}
.al.none{background:#fff;color:#9AA3B0;border:1.5px dashed #C9D2DC;box-shadow:none}
.al.lg{width:2.6rem;height:2.6rem;font-size:.85rem}
.mc .al{margin-left:auto}
.mc .al+.rt{margin-left:.35rem}
.mc .mtags{display:flex;flex-wrap:wrap;gap:.2rem;margin-top:.22rem}
.mc .mtag{font-size:.68rem;font-weight:900;line-height:1.2;padding:.08rem .32rem;border-radius:5px;background:rgba(42,33,69,.09);color:#2A2145;white-space:nowrap;word-break:keep-all}
.mc .mtag.more{background:transparent;border:1px dashed #2A2145}
.mc.bg-yellow .mtag,.mc.bg-pink .mtag,.mc.bg-green .mtag,.mc.bg-blue .mtag{background:rgba(42,33,69,.12)}
:root[data-theme="dark"] .mc{background:var(--card);color:var(--ink);border-color:var(--line)}
:root[data-theme="dark"] .mc .rk,:root[data-theme="dark"] .mc .rt{color:var(--ink-2)}
:root[data-theme="dark"] .mc.bg-yellow{background:rgba(255,241,168,.16)}:root[data-theme="dark"] .mc.bg-pink{background:rgba(255,217,227,.16)}:root[data-theme="dark"] .mc.bg-green{background:rgba(221,243,201,.16)}:root[data-theme="dark"] .mc.bg-blue{background:rgba(216,233,255,.16)}
:root[data-theme="dark"] .mc.bd-black{border-color:var(--ink)}
:root[data-theme="dark"] .mc .mtag{background:rgba(255,181,154,.16);color:var(--indigo)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .mc{background:var(--card);color:var(--ink);border-color:var(--line)}
  :root:not([data-theme="light"]) .mc .rk,:root:not([data-theme="light"]) .mc .rt{color:var(--ink-2)}
  :root:not([data-theme="light"]) .mc.bg-yellow{background:rgba(255,241,168,.16)}:root:not([data-theme="light"]) .mc.bg-pink{background:rgba(255,217,227,.16)}:root:not([data-theme="light"]) .mc.bg-green{background:rgba(221,243,201,.16)}:root:not([data-theme="light"]) .mc.bg-blue{background:rgba(216,233,255,.16)}
  :root:not([data-theme="light"]) .mc.bd-black{border-color:var(--ink)}

}
.mc.me::after{content:"我";position:absolute;top:-.55rem;left:-.35rem;background:#2A2145;color:#fff;font-size:.72rem;font-weight:900;border-radius:999px;padding:.12rem .5rem;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mc.sm{min-height:3rem;padding:.4rem .55rem;gap:.4rem;border-width:2px}
.mc.sm.bd-gold,.mc.sm.bd-red,.mc.sm.bd-black{border-width:2.5px}
.mc.sm .nm{font-size:1rem}
.mc.sm .em{font-size:1.2rem;width:1.5rem}
/* 名單一律直瀑式單欄：姓名常是「英文護照名＋中文名」，兩欄的話每欄只剩約 90px，右欄會被擠出畫面（v3.31） */
.mlist{display:flex;flex-direction:column;gap:.5rem}
.me-wait{display:flex;align-items:center;gap:.5rem;background:var(--indigo-2);border-color:transparent;color:var(--indigo);font-weight:800;font-size:.95rem;line-height:1.4}

.rooms{display:grid;grid-template-columns:minmax(0,1fr);gap:.6rem}
.room{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.6rem;display:flex;flex-direction:column;gap:.4rem}
.room h3{margin:0 0 .1rem;font-size:1.05rem;font-weight:900;display:flex;align-items:center;gap:.3rem;white-space:nowrap}
.room h3 svg.i{color:var(--gold)}
.room.me-room{border:2px solid var(--indigo)}
.room .empty{font-size:.85rem;color:var(--ink-3);font-weight:700;padding:.4rem 0}
.search{display:flex;align-items:center;gap:.5rem;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:0 .85rem;min-height:3.2rem}
.search input{flex:1;border:0;background:transparent;font-size:1.05rem;font-family:inherit;color:var(--ink);min-width:0;outline:none}
.search svg.i{color:var(--ink-3)}
/* groups */
.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.7rem}
.grp.me-grp{border:2px solid var(--indigo)}
.grp h3{margin:0 0 .5rem;font-size:1.1rem;font-weight:900;display:flex;align-items:center;gap:.4rem}
.grp h3 .n{margin-left:auto;font-size:.85rem;color:var(--ink-3);font-weight:800;flex-shrink:0}
.grp h3 .tn{min-width:0;overflow-wrap:anywhere}
/* 搭乘時間、集合地點這行是長輩最需要的資訊：字大一點、顏色深一點 */
.grp-meta{margin:-.25rem 0 .5rem;font-size:.95rem;color:var(--ink-2);font-weight:800;line-height:1.4;overflow-wrap:anywhere}
.grp-meta.top{margin:0;padding:0 .2rem}
/* 分組頁最上面的四個大分類：四等分，圖示在上、字在下，320px 也放得下 */
.catbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem}
.catbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;min-height:3.6rem;padding:.4rem .15rem;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:900;font-size:.95rem;line-height:1.15}
.catbar button.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);box-shadow:0 3px 0 var(--pri-edge)}
.empty-cat{display:flex;flex-direction:column;gap:.35rem;line-height:1.5}
/* 分組情境的編輯表單：每一組一張小卡 */
.scn-rows{display:flex;flex-direction:column;gap:.6rem;margin-bottom:.6rem}
.scn-row{border:1.5px solid var(--line);border-radius:12px;padding:.6rem;display:flex;flex-direction:column;gap:.55rem;background:var(--bg)}
.scn-row>*{flex:none}
/* 一列的標頭：窄螢幕（或字級放大）時名稱欄獨佔一行、三顆按鈕平分下一行；寬一點的螢幕全部排成一行 */
.scn-rh{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.scn-rh .in{flex:1 1 100%;min-width:0}
.scn-rh .btn.sm{flex:1 1 0;min-width:0;padding:0}
@media (min-width:375px){
  html[data-fs="md"] .scn-rh .in,html[data-fs="lg"] .scn-rh .in{flex:1 1 0}
  html[data-fs="md"] .scn-rh .btn.sm,html[data-fs="lg"] .scn-rh .btn.sm{flex:0 0 2.75rem}
}
.scn-cnt{line-height:1.4}
/* 窄螢幕配大字級：兩個時間欄並排每個只剩 49px，數字會被下拉小箭頭壓住；改成一個一行 */
@media (max-width:360px){ html[data-fs="lg"] .scn-row .grid2,html[data-fs="xl"] .scn-row .grid2{grid-template-columns:minmax(0,1fr)} }
/* 大按鈕裡的兩行字：地點很長時自己換行，不撐出表單 */
.btn.big .b2,.btn.big .b2 small{overflow-wrap:anywhere}
.grp .gm{display:flex;flex-direction:column;gap:.4rem}
.grp .gm .mc{cursor:default}
.grp .gm .mc.pk{cursor:pointer}
/* roll call */
.rc-sticky{position:sticky;top:var(--stick,120px);z-index:5;box-shadow:var(--shadow)}
.rc-head{display:flex;align-items:baseline;gap:.5rem}
.rc button .bdg{width:1.3rem;height:1.3rem}
.rc-head .big{font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.rc{display:flex;flex-direction:column;gap:.45rem}
.rc button{min-height:3.3rem;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:1rem;display:flex;align-items:center;gap:.45rem;padding:.3rem .6rem;text-align:left}
.rc .rcn{flex:1;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.rc button.on{background:var(--terrace-2);border-color:var(--terrace)}
.rc .ck{width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent}
.rc button.on .ck{background:var(--terrace);border-color:var(--terrace);color:#fff}
.rc .ck svg.i{width:.9rem;height:.9rem;stroke-width:3}
.missing{background:var(--alert-2);border-radius:10px;padding:.6rem .75rem;font-weight:800;line-height:1.5}
.missing.ok{background:var(--terrace-2);color:var(--terrace);display:flex;align-items:center;gap:.4rem}
.missing a{display:inline-flex;align-items:center;gap:.15rem;margin:.15rem .3rem .15rem 0;color:var(--alert);text-decoration:none;border:1.5px solid var(--alert);border-radius:999px;padding:.15rem .6rem}
.missing a svg.i{width:.95rem;height:.95rem}
/* currency */
.notes{display:grid;grid-template-columns:1fr;gap:.45rem}
.note{min-height:3.6rem;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;gap:.7rem;padding:.35rem .7rem;background:var(--card);color:var(--ink);font-weight:900;font-size:1.25rem;text-align:left;width:100%}
.note .sw{width:2.6rem;height:1.5rem;border-radius:4px;flex-shrink:0;border:1px solid rgba(0,0,0,.15)}

.note small{display:block;font-size:.78rem;color:var(--ink-3);font-weight:800;margin-top:.15rem}
.note .nv{font-size:1rem;font-weight:900;color:var(--indigo);white-space:nowrap;font-variant-numeric:tabular-nums}
.total{background:var(--indigo-2);border-radius:12px;padding:.8rem;text-align:center}
.total .v{font-size:1.75rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.total .t{font-size:1.35rem;font-weight:900;color:var(--indigo);margin-top:.2rem}
.total .r{font-size:.8rem;color:var(--ink-3);font-weight:700;margin-top:.3rem}
/* 資訊卡（工具箱長文） */
.info-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.85rem .9rem;line-height:1.6}
.info-card .ic-h{display:flex;align-items:center;gap:.4rem;font-weight:900;font-size:1.02rem;margin-bottom:.4rem;white-space:nowrap;word-break:keep-all}
.info-card .ic-h svg.i{color:var(--indigo);flex-shrink:0}

ol.steps{margin:0;padding-left:1.4rem;display:grid;gap:.55rem;font-weight:600;color:var(--ink-2)}

ul.dots{margin:0;padding-left:1.15rem;display:grid;gap:.6rem;font-weight:600;color:var(--ink-2)}

dl.kv2{margin:0;display:grid;gap:0}

dl.kv2 dt:first-child{margin-top:0}
dl.kv2 dd{margin:.15rem 0 .55rem;font-weight:700;color:var(--ink-2);line-height:1.5;border-bottom:1px dashed var(--line);padding-bottom:.55rem}
dl.kv2 dd:last-child{border-bottom:0;padding-bottom:0;margin-bottom:0}
/* 飯店 Wi-Fi 卡 */
.wifi-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.75rem .9rem}
.wifi-card .wf-h{display:flex;align-items:center;gap:.4rem;font-size:1.02rem;margin-bottom:.5rem;white-space:nowrap}
.wifi-card .wf-h svg.i{color:var(--indigo)}
.wifi-card .wf-h .sp{flex:1}
.wifi-card .wf-row{display:flex;align-items:center;gap:.5rem;padding:.4rem 0;border-top:1px solid var(--line)}
.wifi-card .wf-k{color:var(--ink-3);font-weight:800;white-space:nowrap;word-break:keep-all;flex-shrink:0}
.wifi-card .wf-v{flex:1;min-width:0;font-weight:900;font-size:1.05rem;word-break:break-all;font-variant-numeric:tabular-nums}
.wifi-card .wf-row .btn{flex-shrink:0}
.wifi-card .wf-note{margin-top:.5rem;color:var(--ink-3);font-weight:700;font-size:.9rem;line-height:1.45}
.wifi-card .wf-note.ed{display:flex;align-items:flex-start;gap:.35rem;width:100%;text-align:left;background:none;border:1px dashed var(--line);border-radius:10px;padding:.4rem .5rem;font:inherit;color:var(--ink-3);font-weight:700;font-size:.9rem;cursor:pointer}
.wifi-card .wf-note.ed svg.i{flex-shrink:0;margin-top:.1rem;color:var(--indigo)}
.warn-box{background:var(--alert-2);border-left:4px solid var(--alert);border-radius:10px;padding:.6rem .75rem;font-weight:800;line-height:1.45;font-size:.95rem;display:flex;gap:.45rem;align-items:flex-start}
.warn-box svg.i{color:var(--alert);margin-top:.15rem}
/* v3.22 一鍵清空・備份與還原 */
.warn-box.dng-box{border-left-color:var(--danger)}
.warn-box.dng-box>svg.i{color:var(--danger)}
.bk-note{background:var(--terrace-2);border-left:4px solid var(--terrace);border-radius:10px;padding:.6rem .75rem;font-weight:700;line-height:1.45;font-size:.92rem;display:flex;gap:.45rem;align-items:flex-start}
.bk-note>svg.i{color:var(--terrace);margin-top:.15rem}
ul.clr-list{gap:.3rem;margin-top:.35rem;line-height:1.45}
.bk-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;display:flex;flex-direction:column;gap:.55rem}
.bk-t{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.bk-src{font-size:.88rem;font-weight:800;color:var(--terrace)}
.pinmask{-webkit-text-security:disc}
.pinmask:not(:placeholder-shown){letter-spacing:.3em}
/* phrase list */
.ph{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;min-height:3.8rem;width:100%;text-align:left;color:var(--ink)}
.ph .e{font-size:1.5rem;flex-shrink:0;width:2rem;text-align:center}
.ph .zh{font-weight:900;font-size:1.05rem}
.ph .vi{font-size:.9rem;color:var(--ink-3);font-weight:700}
.ph .tx{flex:1;min-width:0}
.ph .say-s{font-size:.88rem;color:var(--terrace);font-weight:800}
.ph .phn{margin-left:auto;font-size:.8rem;font-weight:900;color:var(--ink-3);flex-shrink:0;white-space:nowrap}

/* emergency */
.em-row{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem .6rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;min-height:3.6rem}

.em-row .t b{display:block;font-size:1.05rem;font-weight:900}

.em-row a.btn{text-decoration:none;flex:1 1 auto}

.full .fh .btn{border-color:#ccc;color:#111;background:#fff}
.full .lockbar{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:#666;font-weight:700;margin:-.2rem 0 .4rem}
.full .lockbar .btn{flex-shrink:0;border-color:#ccc;color:#111;background:#fff}
.full .lockbar .btn.pri{background:#2A2145;color:#fff;border-color:#2A2145}
.full .lockbar .btn.hold{background:#2A2145}
.full .fk{font-size:.85rem;font-weight:800;color:#666;letter-spacing:.08em;margin-top:.9rem}
.full .vi{font-size:2rem;font-weight:900;line-height:1.25;margin:.25rem 0}
.full .vi.xl{font-size:2.4rem}
.full .zh{font-size:1.15rem;color:#333;font-weight:800;line-height:1.4}
.full .say{font-size:.95rem;color:#666;font-weight:700}
.full .ph-big{display:flex;align-items:center;gap:.6rem;font-size:1.6rem;font-weight:900;margin:.3rem 0;color:#111;text-decoration:none}
.full .ph-big svg.i{color:#2A2145}
.full .foot{margin-top:auto;padding-top:1rem;font-size:.85rem;color:#777;font-weight:700;line-height:1.45}
/* flights */
.fl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.5rem}
@media (max-width:360px){ html[data-fs="lg"] .fl,html[data-fs="xl"] .fl{grid-template-columns:minmax(0,1fr)} }
/* 只有一班（或班數是單數時的最後一班）就佔滿整列，不要留一半空白；佔滿時時間與說明排在同一行（v3.32） */
.fl>.fl-col:last-child:nth-child(odd){grid-column:1/-1}
.fl>.fl-col:last-child:nth-child(odd) .fl-r{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:.1rem .7rem}
.fl-col{background:var(--bg);border-radius:12px;padding:.6rem .7rem}
.fl-h{display:flex;align-items:center;gap:.3rem;font-weight:900;font-size:clamp(.82rem,4.2vw,1rem);margin-bottom:.4rem;white-space:nowrap;overflow:hidden;min-width:0}
.fl-h .al{width:1.7rem;height:1.7rem;font-size:.66rem}
.fl-col{min-width:0}
.fl-r{display:flex;flex-direction:column;gap:.05rem;margin-top:.35rem}
.fl-r .k{font-size:.75rem;color:var(--ink-3);font-weight:800;line-height:1.3}
.fl-r b{font-size:1.35rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.01em}
/* notebook */
.nb-tabs{display:flex;gap:.4rem;flex-wrap:wrap;padding:.1rem 0 .2rem}
.nb-title{display:flex;align-items:center;gap:.5rem;margin:.2rem 0 0}
.nb-title h2{margin:0;font-size:1.25rem;font-weight:900;flex:1;min-width:0}
.prog{height:.55rem;background:var(--line);border-radius:999px;overflow:hidden;margin-top:0}
.prog i{display:block;height:100%;background:var(--terrace);border-radius:999px;transition:width .2s}
.nb-head{font-size:.85rem;font-weight:900;color:var(--ink-3);letter-spacing:.08em;margin:.7rem 0 -.15rem;display:flex;align-items:center;gap:.4rem}
.nb-head::after{content:"";flex:1;height:1px;background:var(--line)}
.ck-row{display:flex;gap:.65rem;align-items:flex-start;min-height:3.4rem;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:.65rem .8rem;width:100%;text-align:left;color:var(--ink);font-size:1.05rem;font-weight:700;line-height:1.35}
.ck-row .box{width:1.6rem;height:1.6rem;border-radius:6px;border:2px solid var(--ink-3);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:transparent;margin-top:.05rem}
.ck-row .box svg.i{width:1rem;height:1rem;stroke-width:3}
.ck-row.on{background:var(--terrace-2);border-color:var(--terrace)}
.ck-row.on .box{background:var(--terrace);border-color:var(--terrace);color:#fff}
.ck-row.on .tx{text-decoration:line-through;color:var(--ink-2)}
.ck-row .tx{flex:1;min-width:0}
.note-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.75rem .85rem;font-size:1rem;line-height:1.55;font-weight:600;color:var(--ink);white-space:pre-line}
.it-wrap{display:flex;flex-direction:column;gap:.5rem}
.it-row{display:flex;gap:.4rem;align-items:stretch}
.it-row>.ck-row,.it-row>.note-item,.it-row>.ph{flex:1;min-width:0}
.it-row>.nb-head{flex:1}
.it-row .edit{width:44px;min-width:44px;padding:0;flex-shrink:0;align-self:center;min-height:44px}
.tf{display:flex;align-items:center;gap:.35rem}
.tf .in{flex:1;text-align:center;font-size:1.2rem;font-weight:900;font-variant-numeric:tabular-nums;padding:.4rem .3rem}
.tf b{font-size:1.3rem}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(8,12,22,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:440px;max-height:92vh;max-height:92dvh;border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease-out}
.sheet.tall{height:92vh;height:92dvh}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:1rem 1rem .5rem 1.25rem;font-weight:900;font-size:1.3rem;gap:.5rem}
.sheet-h .icon-btn{width:2.75rem;height:2.75rem;border-radius:16px;background:var(--bg);box-shadow:none}
.sheet-b{padding:.25rem 1rem 1rem;overflow-y:auto;display:flex;flex-direction:column;gap:.85rem;-webkit-overflow-scrolling:touch}
/* 表單內容是直向 flex 的子項，預設 flex-shrink:1。只要子項自己設了 min-height，
   自動最小尺寸就會被蓋掉，表單一高過螢幕子項就被壓扁、內容疊在一起。
   這裡一律不准縮，高度不夠就讓 .sheet-b 自己捲。 */
.sheet-b>*{flex:none}
.sheet-f{padding:.7rem 1rem calc(.85rem + env(safe-area-inset-bottom));border-top:2px solid var(--line);display:flex;flex-wrap:wrap;gap:.6rem}
.sheet-f .btn{flex:1;min-height:3.25rem;font-size:1.05rem}
/* 兩段式確認（sure()）按過一次之後，那顆按鈕的字會變長（例：「連圖卡一起刪？再按一次」）。
   以前三顆按鈕擠在同一列，長的那顆把「取消」「儲存」擠出表單（v3.23 就有，v3.26 修）。
   現在放不下就換行：等著確認的那顆（sure() 會替它加 data-sure）獨佔最下面一整列——
   底部是貼著螢幕下緣往上長的，所以它就在原本那顆的位置上，再按一次還是按得到（原本在上面那列的用 data-up 留在上面，見 sure()）；
   字太長（字級特大、螢幕很窄）時在鈕裡自己換行：keep-all 讓它只在「？」這類標點後面斷行（連圖卡一起刪？／再按一次），
   不會把最後一個字孤零零留在第二行；真的連一小段都放不下才由 overflow-wrap 在任何字之間斷開，不會凸出表單 */
.sheet-f .btn[data-sure="1"]{flex:1 1 100%;order:9;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;line-height:1.25;padding-top:.45rem;padding-bottom:.45rem}
.sheet-f .btn[data-sure="1"][data-up="1"]{order:-1}
/* 用直接子代選擇器：欄位裡若有 <label class="btn">（例：選照片）不能被 display:block 打回方塊，
   不然裡面的 SVG 就不會置中。 */
.f>label{display:block;font-size:.85rem;font-weight:900;color:var(--ink-2);margin-bottom:.3rem}
.f>label.btn{display:inline-flex;margin-bottom:0}
.in{width:100%;min-height:3.2rem;border:2px solid var(--field-line);border-radius:18px;padding:.5rem .85rem;font-size:1.05rem;font-family:inherit;background:var(--field);color:var(--ink);font-weight:700}
textarea.in{min-height:5.5rem;line-height:1.45;resize:vertical}
/* 下拉選單原本 appearance:none 之後完全沒有箭頭，看起來像唯讀欄位。
   用兩個漸層疊出一個小三角；.tf（時間欄）自己的 padding 特異性較高，不會被撐開。 */
select.in{appearance:none;-webkit-appearance:none;padding-right:1.9rem;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 16px) calc(50% - 1px),calc(100% - 11px) calc(50% - 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.in:focus{outline:2px solid transparent;border-color:var(--indigo);box-shadow:0 0 0 4px var(--focus-glow)}
.sw{display:flex;gap:.4rem;flex-wrap:wrap}
.sw button{min-width:3rem;min-height:3rem;border-radius:10px;border:2px solid var(--line);font-size:1.3rem;background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0 .4rem;font-weight:800}
.sw button.on{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-2)}
.sw button.c{width:3rem}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.pin button{min-height:3.6rem;font-size:1.5rem;font-weight:900;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.pin-disp{text-align:center;font-size:2rem;letter-spacing:.5rem;font-weight:900;min-height:3rem;font-variant-numeric:tabular-nums}
.tip-banner{background:var(--card);border:1px dashed var(--indigo);border-radius:var(--r);padding:.75rem .85rem;font-size:.9rem;line-height:1.5;color:var(--ink-2);font-weight:600;display:flex;gap:.5rem;align-items:flex-start}
.tip-banner svg.i{color:var(--indigo);flex-shrink:0;margin-top:.15rem}
.tip-banner button{margin-left:auto;border:0;background:transparent;color:var(--ink-3);font-weight:900;min-width:2.75rem;min-height:2.75rem;flex-shrink:0}
.tip-banner span{flex:1;min-width:0}
.tip-banner .tb-go{margin-left:0;color:var(--indigo);text-decoration:underline;min-width:0;padding:0 .35rem;white-space:nowrap}
/* 廣播貼到 LINE 的預覽框：讓管理者送出前先看一眼實際會長什麼樣 */
.share-prev{margin-top:.7rem;white-space:pre-wrap;word-break:break-word;background:var(--soft);border:1px solid var(--line);border-radius:.7rem;padding:.75rem .85rem;font-size:.92rem;line-height:1.7;font-weight:600;color:var(--ink);-webkit-user-select:text;user-select:text}
/* ===== 安裝成 App／加到主畫面 ===== */
/* 按鈕字級固定用 px，不跟著「AA」放大，320px 小螢幕才不會把區塊標題擠爆 */
.inst-btn{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:.2rem;font-size:.8rem;min-height:2.6rem;font-weight:900;line-height:1;color:var(--pri-ink);background:var(--pri);border:0;border-radius:999px;padding:.4rem .6rem;white-space:nowrap;word-break:keep-all;box-shadow:0 3px 0 var(--pri-edge)}
.inst-btn svg.i{width:14px;height:14px;stroke-width:2.4}
.ig-why{display:flex;gap:.45rem;align-items:flex-start;background:var(--indigo-2);color:var(--indigo);border-radius:.7rem;padding:.6rem .7rem;font-size:.88rem;font-weight:700;line-height:1.5;margin-bottom:.85rem}
.ig-why svg.i{flex:none;margin-top:.15rem}
.ig{display:flex;flex-direction:column;gap:.85rem}
.ig-s{display:flex;gap:.55rem;align-items:flex-start}
.ig-n{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--pri);color:var(--pri-ink);font-weight:900;font-size:.9rem;display:flex;align-items:center;justify-content:center;margin-top:.1rem}
.ig-s .tx{flex:1;min-width:0}
.ig-s b{display:block;font-size:1rem;font-weight:900;line-height:1.4}
.ig-s small{display:block;color:var(--ink-2);font-size:.85rem;font-weight:600;line-height:1.5;margin-top:.15rem}
.ig-fig{margin-top:.45rem;border:1px solid var(--line);border-radius:.6rem;background:var(--soft);padding:.5rem .55rem;display:flex;align-items:center;gap:.5rem;font-size:.88rem;font-weight:800;min-width:0;color:var(--ink)}
.ig-fig.row2{justify-content:space-between}
.ig-fig.bar{justify-content:space-between;color:var(--ink-3)}
.ig-fig .dim{color:var(--ink-3);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ig-fig .go{color:var(--indigo);font-weight:900}
.ig-fig>.ig-hi{outline:2px solid var(--alert);outline-offset:2px;border-radius:.35rem;padding:.05rem .3rem}
.ig-fig>.ig-hi.ic{display:inline-flex;align-items:center;padding:.15rem}
.ig-fig.ig-hi{outline:2px solid var(--alert);outline-offset:-1px}
.ig-s small svg.i{width:1.1em;height:1.1em;vertical-align:-.2em;margin:0 .1em}
.ig-shot{display:block;width:100%;height:auto;margin-top:.45rem;border:1px solid var(--line);border-radius:.6rem;background:var(--soft)}
.ig-alt{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;margin:-.35rem 0 0 2.15rem}
.ig-alt small{color:var(--ink-3);font-size:.82rem;font-weight:600;line-height:1.45}
.toast{position:fixed;left:50%;bottom:7.5rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.65rem 1.1rem;border-radius:999px;font-weight:800;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;white-space:normal;text-align:center;line-height:1.35;width:max-content;max-width:92vw;border-radius:18px}
.toast.show{opacity:1}
.hint-lead{font-size:.82rem;color:var(--ink-3);font-weight:700;display:flex;align-items:center;gap:.3rem}
.hint-lead svg.i{width:1rem;height:1rem}
/* ===== v4：首頁分段（現在／稍後／隨時查）＋ 可收合卡片 ===== */
.zsec{display:flex;flex-direction:column;gap:.7rem}
.zlab{display:flex;align-items:center;gap:.5rem;margin-bottom:-.05rem}
.zlab::before{content:"";flex:none;width:.65rem;height:.65rem;border-radius:50%;background:var(--pri)}
.zlab span{font-size:.95rem;font-weight:900;color:var(--ink-2);letter-spacing:.06em;white-space:nowrap;word-break:keep-all}
.zlab i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chead{width:100%;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;gap:.5rem;padding:.7rem .8rem;text-align:left;min-height:3.2rem}
.chead .ttl{font-size:1rem;font-weight:900;display:flex;align-items:center;gap:.4rem;flex-shrink:0;white-space:nowrap;word-break:keep-all;color:var(--ink-2)}
.chead .ttl svg.i{width:1.15rem;height:1.15rem}
.chead .sm{flex:1;min-width:0;text-align:right;font-size:.875rem;font-weight:800;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
@media (max-width:360px){ html[data-fs="xl"] .chead .sm{white-space:normal;line-height:1.2;text-overflow:clip} }
.chead .sm.multi{white-space:normal;line-height:1.25;text-overflow:clip;overflow:visible}
.chead .sm .nw{white-space:nowrap}
.chead .cv{flex-shrink:0;color:var(--ink-3);font-size:.8rem;font-weight:900;width:1.1rem;text-align:center}
.cbody{padding:0 .8rem .8rem}
.tgl{width:52px;height:30px;border-radius:999px;border:0;background:var(--ink-3);position:relative;flex-shrink:0;padding:0}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .16s ease}
.tgl.on{background:var(--terrace)}
.tgl.on::after{left:25px}
.it-row .tgl{align-self:center}
/* 明度階梯：現在＝浮起、稍後＝沉一階、隨時查＝只留框 */
/* 「現在」區：主卡的浮起感。手動模式可以把可收合卡片也放進這一區，
   高亮時外面多包一層 .hlw，選擇器要一併涵蓋，不然浮起感會掉。 */
.g-now>.card,.g-now>.ccard,.g-now>.hlw>.card,.g-now>.hlw>.ccard{box-shadow:var(--lift);position:relative;overflow:hidden}
.g-now>.card,.g-now>.ccard{border-color:transparent}
.g-later>.card,.g-later>.ccard{background:var(--soft);border-color:transparent;box-shadow:none}
.g-ref>.card,.g-ref>.ccard{background:transparent;border-color:var(--line);box-shadow:none}
.g-ref .chead .ttl{color:var(--ink-3)}
.g-ref .fl-col{background:var(--card)}
/* ===== 高亮提醒：管理者指定「這張卡大家要看」 =====
   呼吸光暈只動 opacity，不動 box-shadow 尺寸，手機負擔最小。
   .hlw 是額外包的一層，因為 .ccard 有 overflow:hidden，光暈畫在卡片裡會被裁掉。
   底色規則要寫在 .g-later/.g-ref 之後，特異性同分時才壓得過分區樣式。 */
.hlw{position:relative;border-radius:var(--r);margin-top:.35rem}
.hlw::before{content:"";position:absolute;inset:-3px;border-radius:calc(var(--r) + 3px);pointer-events:none;z-index:0;
  box-shadow:0 0 0 2px var(--hl-edge),0 0 16px 3px var(--hl-glow);animation:hlbreath 2.6s ease-in-out infinite}
@keyframes hlbreath{0%,100%{opacity:.32}50%{opacity:1}}
.hlw>.ccard,.hlw>.card{position:relative;z-index:1;background:var(--hl-bg);border-color:var(--hl-edge)}
/* 今日行程不是可收合卡片，標題直接貼著卡片上緣，要多留位置給「提醒 ON」 */
.hlw>.card{padding-top:1.45rem}
.hlw .chead{padding-top:1.15rem}
.hlw .chead .ttl{color:var(--hl-ink)}
.hl-tag{position:absolute;top:-9px;left:12px;z-index:3;display:inline-flex;align-items:center;gap:.22rem;
  background:var(--hl-edge);color:#3D2C02;border-radius:999px;padding:.15rem .5rem;
  font-size:12px;font-weight:900;line-height:1.4;white-space:nowrap;word-break:keep-all;
  box-shadow:0 1px 3px rgba(27,36,55,.22)}
.hl-tag svg.i{width:12px;height:12px;stroke-width:2.4;color:inherit}
/* ===== 首頁卡片位置：分區看板 =====
   這塊同時是「目前的結果」與編輯區，所以不另外再放一份預覽。 */
select.in.sm{min-height:2.5rem;font-size:.88rem;padding:0 1.6rem 0 .55rem;width:auto;flex:none;max-width:7rem}
/* 看板整塊包成一個子項：分區標題要貼著自己的框，不要被 .sheet-b 的 gap 拆開 */
.zb-wrap{display:block}
.zb-t{font-size:.84rem;font-weight:900;color:var(--ink-2);margin:.2rem 0 .1rem}
.zb-h{display:flex;align-items:center;gap:.4rem;margin:.75rem 0 .2rem;font-size:.76rem;font-weight:900;letter-spacing:.08em;color:var(--ink-3)}
.zb-h i{flex:1;height:1px;background:var(--line);font-style:normal}
.zb{border:1px dashed var(--line);border-radius:10px;padding:.15rem .55rem;min-height:2.4rem}
.zb.now{border-style:solid;border-color:var(--alert);background:var(--alert-2)}
.zb.off .zb-n{color:var(--ink-3)}
.zb-fixed{font-size:.88rem;font-weight:800;color:var(--ink-3);padding:.5rem 0}
.zb-empty{font-size:.82rem;font-weight:600;color:var(--ink-3);padding:.55rem 0}
.zb-c{border-top:1px solid var(--line)}
.zb-c:first-child{border-top:0}
.zb-r{display:flex;align-items:center;gap:.45rem;padding:.4rem 0}
.zb-lock{flex:none;font-size:.76rem;font-weight:800;color:var(--ink-3);white-space:nowrap;word-break:keep-all;
  border:1px dashed var(--line);border-radius:999px;padding:.1rem .45rem}
.zb-n{flex:1;min-width:0;font-size:.95rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zb-s{display:flex;align-items:center;gap:.3rem;padding:0 0 .45rem;font-size:.74rem;font-weight:800;color:var(--ink-3)}
.zb-s .lb{white-space:nowrap;word-break:keep-all}
.zb-s .gap{flex:1;min-width:.3rem}
.ord{display:flex;flex:none;gap:.2rem}
.ord .omv{width:2.1rem;height:2.1rem;border-radius:9px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-2);font-weight:900;font-size:.95rem;line-height:1;padding:0}
.ord .omv:disabled{opacity:.3}
.tgl.xs{width:38px;height:22px}
.tgl.xs::after{width:17px;height:17px;top:2.5px;left:2.5px}
.tgl.xs.on::after{left:18.5px}
.hdot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--gold)}
/* 320px＋放大字級時，卡片名稱會被位置下拉和 ↑↓ 擠成「出發…」；讓名稱自己佔一行 */
@media (max-width:360px){
  html[data-fs="lg"] .zb-r,html[data-fs="xl"] .zb-r{flex-wrap:wrap;row-gap:.25rem}
  html[data-fs="lg"] .zb-n,html[data-fs="xl"] .zb-n{flex:1 0 100%}
  html[data-fs="lg"] .zb-r .ord,html[data-fs="xl"] .zb-r .ord{margin-left:auto}
}
@media (prefers-reduced-motion: reduce){ .hlw::before{animation:none;opacity:1} }
/* Google 地圖按鈕 */
.map-btn{width:2.75rem;height:2.75rem;min-width:2.75rem;border-radius:16px;border:2px solid var(--line);background:var(--card);
  color:var(--indigo);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none;vertical-align:middle}
.map-btn svg.i{width:1.35rem;height:1.35rem}
.map-btn:active{background:var(--indigo-2)}
.map-btn.lg{width:2.75rem;height:2.75rem;min-width:2.75rem;margin-left:.4rem}
.map-btn.lg svg.i{width:1.35rem;height:1.35rem}

.tagrow{flex:1;min-width:0;display:flex;align-items:center;gap:.45rem;font-size:1rem;white-space:nowrap;overflow:hidden}
.tagrow svg.i{width:1.2rem;height:1.2rem;color:var(--indigo)}
.sw button svg.i{width:1.4rem;height:1.4rem}
.tool-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.55rem}
.tcard{min-width:0}
@media (max-width:360px){ html[data-fs="xl"] .tool-grid{grid-template-columns:minmax(0,1fr)} }
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.7rem .75rem;min-height:5.2rem;display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;color:var(--ink);text-align:left}
.tcard svg.i{width:1.5rem;height:1.5rem;color:var(--indigo);margin-bottom:.15rem}
.tcard b{font-size:1rem;font-weight:900;white-space:nowrap;word-break:keep-all}
.tcard small{font-size:.875rem;color:var(--ink-3);font-weight:700;line-height:1.25}
/* ===== 推播通知（v3.24 預留，關閉中）：開關與欄位都畫出來，但一律灰色、不能按 ===== */
.pu-row{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px dashed var(--line)}
.pu-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1rem}
.pu-t>b{font-size:1rem;font-weight:900}
.pu-t>small{font-size:.85rem;color:var(--ink-3);font-weight:700;line-height:1.35}
.pu-off{flex-shrink:0;font-size:.8rem;font-weight:900;color:var(--ink-2);background:var(--line);border-radius:999px;padding:.15rem .55rem;white-space:nowrap}
.tgl:disabled{opacity:.45;cursor:not-allowed}
.in:disabled{opacity:.6;cursor:not-allowed}
/* ===== 工具頁內容（v3.23）：主辦人自己寫的，長度不一定，寧可換行也不要撐破版面 ===== */
.tcard b{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tl-lead{margin-top:-.35rem}
.tl-lead>.btn{flex:0 1 auto}
.kc{display:flex;flex-direction:column;gap:.8rem}
.kc .ic-h,.kc dl.kv2 dt{white-space:normal}
.kc .info-card>*+*{margin-top:.6rem}
.kc .info-card>.ic-h+*{margin-top:0}
.kc h2.sec::before{content:'';display:inline-block;width:.28rem;height:1.05em;border-radius:2px;background:var(--indigo);flex-shrink:0}
.kc .info-card,.kc .warn-box{overflow-wrap:anywhere}
.md-bar{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.4rem}
.md-bar .chip{min-height:2.5rem}
textarea.in.md-ta{min-height:14rem;font-size:1rem;line-height:1.55}
.md-help{margin-top:.35rem;line-height:1.5}
.md-prev{border:1.5px dashed var(--line);border-radius:12px;padding:.6rem;background:var(--bg)}
.rate-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:.4rem}
.mn-rows{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.45rem}
.mn-row{display:grid;grid-template-columns:minmax(0,1fr) 3rem minmax(0,1.3fr);gap:.4rem;align-items:center}
.mn-row input[type=color]{padding:.2rem;height:3rem;cursor:pointer}
.sos-ed{display:flex;flex-direction:column;gap:.4rem;padding-bottom:.6rem;border-bottom:1px dashed var(--line)}
.ck-line{display:flex;gap:.55rem;align-items:flex-start;font-weight:700;line-height:1.45;padding:.3rem 0;cursor:pointer}
.ck-line input{width:1.5rem;height:1.5rem;flex-shrink:0;margin-top:.05rem;accent-color:var(--indigo)}
.full .fh-b{display:flex;gap:.4rem;flex-shrink:0}
.ver{text-align:center;font-size:.875rem;color:var(--ink-3);font-weight:700;padding:.4rem 0 .2rem;letter-spacing:.04em}
.btn.line{background:#0B7A3A;color:#fff;border-color:#0B7A3A}
.btn.line svg.i{width:1.1rem;height:1.1rem}
.tag.map{background:var(--indigo-2);color:var(--indigo);border-color:transparent;text-decoration:none;font-weight:900;min-height:2.75rem;padding-left:.7rem;padding-right:.7rem}
.tag.map svg.i{color:var(--indigo)}
/* 彩色徽章 SVG */
svg.bdg{width:1.7rem;height:1.7rem;display:block;flex-shrink:0}
svg.bdg.lg{width:2.1rem;height:2.1rem}
.icon-btn svg.bdg{width:19px;height:19px}
.leader-bar svg.bdg,h2.sec svg.bdg{width:1.15rem;height:1.15rem}
.bdg-hint{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.3rem .6rem;margin-top:.45rem}
.bdg-hint span{display:flex;align-items:center;gap:.35rem;font-size:.82rem;font-weight:700;color:var(--ink-3);white-space:nowrap;word-break:keep-all}
.bdg-hint svg.bdg{width:1.2rem;height:1.2rem}
.sw button svg.bdg{margin:0 auto}
/* 出發前準備卡 */
.prep-top{display:flex;align-items:baseline;gap:.35rem;margin-bottom:.4rem}
.prep-top .n{font-size:1.6rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--terrace)}
.prep-top .d{font-size:.95rem;font-weight:800;color:var(--ink-2)}
.prep-top .sp{flex:1}
.prep-top .pc{font-size:.85rem;font-weight:900;color:var(--ink-3);font-variant-numeric:tabular-nums}
.prep-lab{font-size:.82rem;font-weight:900;color:var(--ink-3);margin:.7rem 0 .4rem;white-space:nowrap;word-break:keep-all}
.prep-done{display:flex;align-items:center;gap:.45rem;margin-top:.7rem;background:var(--terrace-2);color:var(--terrace);
  border-radius:12px;padding:.6rem .7rem;font-weight:900;font-size:.95rem}
.prep-note{display:flex;align-items:flex-start;gap:.35rem;margin-top:.55rem;font-size:.8rem;font-weight:700;color:var(--ink-3);line-height:1.4}
.prep-note svg.i{width:1rem;height:1rem;flex-shrink:0;margin-top:.1rem}

    </div>

  <div class="verbar" id="verBar" hidden></div>
  <div class="offbar" id="offBar" hidden></div>
  <div class="sync" id="syncBar" hidden></div>

    cards:[
    {id:"entry",sec:"pre",icon:"ticket",title:"入境與通關",sub:"護照效期、入境順序",body:tplL(
      "### 一句話結論",
      "出國最重要的是**護照效期**與**簽證**。每個國家規定不同，主辦人會在這張卡寫清楚這次要不要簽證；自己也可以查外交部領事事務局網站的「各國簽證及入境須知」。",
      "",
      "## 出發前自己核對",
      "- **護照效期至少還有 6 個月**（從入境日算起）。翻到護照個人資料頁看「效期截止日」，快到期就要馬上去換，別拖。",
      "- **護照上的英文名要跟機票一模一樣。**拼錯一個字母就可能上不了飛機，收到電子機票就先對一次。",
      "- **護照裡至少留兩頁空白**，入境與出境可能各要蓋一次章。",
      "- **簽證或入境許可：**有的國家免簽、有的要先上網申請電子簽證，主辦人會通知；自己辦的話認明官方網站，其他代辦網站收費高很多。",
      "- 有些國家要**事先上網填入境資料**（入境卡、海關申報），主辦人會提醒。",
      "",
      "## 可以帶多少現金",
      "從台灣出境｜新台幣以 **10 萬元**為限；外幣現鈔超過等值 **1 萬美元**要向海關申報",
      "目的地入境｜各國門檻不同，請主辦人補上",
      "! 一般旅行正常帶**不會超過門檻**，這段只是讓你知道界線在哪。",
      "",
      "## 下飛機之後的順序",
      "1. 跟著人群與「**Arrival／Immigration**」指標走到**證照查驗**，排「外國人（Foreigners）」那排。",
      "2. 把**護照**（有入境卡就一起）交給櫃檯人員，可能會請你看鏡頭拍照、按指紋。聽不懂就微笑等他指示。",
      "3. 蓋完章往前走，看螢幕找我們的班機號碼，到**行李轉盤**提行李。",
      "4. 出口前是**海關**，沒有要申報的東西就走綠色通道直接出去。",
      "5. 出關後在大廳等，**跟緊大家、不要自己先走**。",
      "",
      "## 護照怎麼顧",
      "- **護照絕對不要放托運行李。**隨身背包貼身放，過關後就收好。",
      "- 出發前**拍一張護照資料頁**存在手機相簿，再印一份紙本放行李箱。萬一遺失，補辦會快很多。",
      "- 飯店入住時櫃檯可能會收走護照登記，**記得要拿回來**，離開飯店前確認一次。",
      "- 護照掉了先找主辦人，並聯絡駐外館處（電話在「緊急求助」頁）。"
    )},
    {id:"weather",sec:"pre",icon:"thermo",title:"天氣與穿搭",sub:"洋蔥式穿法最省事",body:tplL(
      "### 一句話結論",
      "出發前一週看**目的地的天氣預報**，注意三件事：**早晚溫差、會不會下雨、太陽大不大**。主辦人會在這張卡補上當地的溫度。",
      "",
      "## 出發前這樣查",
      "- 手機的天氣 App 加入目的地城市，看**最高溫與最低溫**，外套厚度照最低溫準備。",
      "- 有上山的行程：高度每升高 100 公尺大約降 0.6 度，**山上比平地冷很多**。",
      "旅途中各地溫度｜請主辦人填，例如「市區 25～30 度、山上 10～15 度」",
      "",
      "## 這樣穿最省事",
      "- **洋蔥式穿法**：短袖或薄長袖打底，外面一件薄外套，最外面一件**防風防潑水外套**。熱了脫、冷了加，比穿一件厚的好用。",
      "- **鞋子要防滑、好走。**石板路、步道下過雨很滑，穿包鞋或運動鞋，不要穿新鞋或拖鞋。",
      "- **帶輕便雨衣，勝過雨傘。**風大的地方傘常常撐不住，雨衣還能擋風。",
      "- 怕冷的人多帶一條**薄圍巾或帽子**，脖子跟頭保暖，體感差很多。",
      "- 行李裡放一套**乾的替換衣物**，淋濕了有得換。",
      "",
      "## 太陽與蚊蟲",
      "- 熱帶或高山地區紫外線強，帶**帽子、太陽眼鏡、防曬乳**。",
      "- 天氣熱時**多喝水**，戶外走一段就找陰涼處休息。",
      "- 蚊子多的地方帶**防蚊液**，傍晚與草叢邊最需要。"
    )},
    {id:"phoneset",sec:"pre",icon:"phone",title:"手機出發前設定",sub:"關漫遊、先裝好",body:tplL(
      "### 為什麼要先弄",
      "這幾件事**在台灣用 Wi-Fi 做只要十分鐘**，落地後沒網路才弄會很麻煩。出發前一晚照著做一次就好。",
      "",
      "## 第一件事：關掉數據漫遊",
      "這是最容易收到高額帳單的地方，出發前一定要關。",
      "- **iPhone：**設定 → 行動服務 → 找到你的台灣門號 → 把「數據漫遊」關掉。",
      "- **Android：**設定 → 網路和網際網路 → SIM 卡 → 關閉「數據漫遊」。",
      "- 台灣門號**不要整個關掉**，留著才能收銀行或驗證碼簡訊，只關「數據漫遊」即可。",
      "- 有買 eSIM 的人，上網走 eSIM，作法看「eSIM 怎麼買」那張卡。",
      "",
      "## 出發前先裝好、先下載好",
      "- **叫車 App**（主辦人會說這次用哪一個）：註冊要用手機號碼收簡訊驗證，**一定要在台灣用台灣門號註冊好**，落地才裝常常收不到驗證碼。",
      "- **Google 地圖離線地圖**：搜尋目的地城市 → 點地名 → 下載離線地圖。沒網路也能看自己在哪。",
      "- **Google 翻譯**：進 App 把目的地的語言下載成離線，相機即時翻譯菜單很好用。",
      "- **本工具站**：用瀏覽器打開後「加入主畫面」，之後像 App 一樣點開，沒網路也看得到。",
      "",
      "## 存好這些資料",
      "- 把**主辦人電話**存進通訊錄（緊急求助頁有）。",
      "- **飯店名稱與地址截圖**存在相簿，走散時可以直接給司機看——本工具站的「計程車回飯店卡」更好用。",
      "- 護照資料頁拍照存起來。",
      "- 記得帶**行動電源**；出國拍照、導航，電量掉得比平常快。",
      "",
      "### 打電話怎麼打",
      "eSIM 多半只有上網、沒有電話號碼。要聯絡團員請用 **LINE 免費通話**；打當地電話（飯店、餐廳）才需要用台灣門號直撥，會算國際漫遊費。"
    )},
    {id:"exchange",sec:"pre",icon:"cash",title:"換匯與付款",sub:"在哪換、刷卡還付現",body:tplL(
      "### 先記一個心算法",
      "請主辦人依這次的貨幣寫一個好記的換算，例如「**去掉三個零、再乘以 1.2**」。",
      "算不出來就用工具頁的「外幣點鈔速算」，按鈔票就好，不用打字。",
      "",
      "## 在哪裡換錢",
      "- **常見貨幣在台灣先換好。**美金、日圓、韓元、歐元這類在台灣的銀行換通常比較划算；少見的貨幣可以先換美金，到當地再換。",
      "- **機場換一點就好。**機場匯率通常較差，換夠當天車資與零用即可。",
      "- **ATM 提款**方便但每筆有手續費；要用的人出發前先確認金融卡有開通**海外提款**與密碼。",
      "- 換錢時**當場點清楚再走**，並要求多給一些小面額。",
      "",
      "## 刷卡還是付現",
      "飯店、大餐廳｜多半可以刷卡，記得選**用當地貨幣結帳**（選台幣結帳匯率較差）",
      "市場、小攤｜多半只收現金，準備小鈔",
      "行動支付｜各國不同，主辦人會說明能不能用",
      "信用卡手續費｜海外刷卡大多另收 1.5% 左右，出發前可以問發卡銀行",
      "",
      "## 付錢時要小心",
      "- 外國鈔票**顏色、大小可能很像**，付錢跟找零都要**看清楚數字**再收。",
      "- 小費與零錢要**小面額**，只有大鈔會很難處理。",
      "- 錢分兩三個地方放，**不要全部放在同一個錢包**。"
    )},
    {id:"esim",sec:"pre",icon:"wifi",title:"eSIM 怎麼買",sub:"出國上網最省事",body:tplL(
      "### 什麼是 eSIM",
      "不用換實體 SIM 卡，直接在手機裡「下載」一組當地的上網門號。出國前在台灣就能買好，落地開機就有網路，不必到機場排隊買卡，也不會弄丟原本的 SIM 卡。",
      "",
      "## 在哪裡買",
      "- **旅遊平台**：例如 KKday、Klook，搜尋「**目的地名稱＋eSIM**」，買完 QR Code 會寄到 email。",
      "- **eSIM App**：例如 Saily、Airalo，買、裝、開通都在同一個 App 裡完成。",
      "- 天數選**比行程多一兩天**。只用 LINE 與地圖，每天 1GB 通常夠；常看影片的人選吃到飽。",
      "",
      "## 怎麼安裝",
      "1. 出發前一天，在家用 Wi-Fi 安裝（**安裝一定要有網路**）。",
      "2. 用 email 的 QR Code 安裝：iPhone 到「設定 → 行動服務 → 加入 eSIM」；Android 到「設定 → 網路 → SIM → 下載 eSIM」。用 App 買的就在 App 裡按「安裝」。",
      "3. 落地後到「設定 → 行動網路」把這張新的 eSIM 打開、**開啟數據漫遊**就會通。",
      "! **QR Code 通常只能掃一次**，掃了就綁定那支手機，不能換機也不能刪掉重來。掃之前先確定是要用的那支手機。",
      "",
      "## 注意須知",
      "- **先確認手機支援 eSIM。**撥 ***#06#**，畫面有出現「EID」才代表支援；有些在台灣買的 Android 手機不支援，不確定就問主辦人。",
      "- **不要刪掉原本的台灣門號。**eSIM 是額外加一組，台灣號碼留著才能收簡訊驗證碼；把「行動數據」切到新的那張、台灣那張**關掉數據漫遊**就不會被扣漫遊費。",
      "- **eSIM 多半只有數據、沒有電話號碼**，不能打電話或收簡訊。要打電話請用 LINE 語音通話。",
      "- 落地後如果沒網路：關飛航模式再開一次 → 確認新 eSIM 已開啟 → 打開「數據漫遊」 → 還是不行就重開機。",
      "- 山區、郊外訊號會變差，這是正常的，不是卡有問題。",
      "- 不想自己弄的人可以直接用飯店 Wi-Fi，或跟主辦人說，出發前一起處理。"
    )},
    {id:"tips",sec:"pre",icon:"gift",title:"小費文化",sub:"給不給、給多少",body:tplL(
      "### 一句話結論",
      "每個國家的小費習慣差很多：有的國家**不用給**（例如日本、韓國），有的是**習慣要給**（例如美國餐廳約 15～20%）。主辦人會在這張卡寫下這次目的地的行情。",
      "",
      "## 常見場合與行情",
      "請主辦人依目的地修改下面的行情。",
      "飯店房務｜有給小費習慣的國家，每天放一點在枕頭上或桌上",
      "行李員｜每件行李給一點",
      "餐廳｜先看帳單有沒有已經收**服務費（service charge）**，收了就不用再給",
      "按摩｜做得舒服再給",
      "計程車｜多半湊整數、不用找零就好",
      "包車司機／導覽｜大家一起出比較好處理，跟主辦人討論",
      "",
      "## 給小費的眉角",
      "- **準備小面額的當地貨幣。**只有大鈔會很尷尬。",
      "- **用當地貨幣，不要給台幣或硬幣。**外國硬幣他們換不掉，等於沒給。",
      "- **雙手遞、面帶微笑**，或直接放在桌上；不要丟或塞。",
      "- 在不用給小費的國家，硬塞反而會讓對方為難，**入境隨俗**就好。"
    )},
    {id:"power",sec:"pre",icon:"plug",title:"電壓與插頭",sub:"電壓、插座形狀",body:tplL(
      "### 先查兩件事",
      "目的地的**電壓**與**插座形狀**。台灣是 **110V**、兩腳扁插頭。主辦人會在這張卡補上這次目的地的規格。",
      "這次目的地｜請主辦人填，例如「220V、雙圓孔」",
      "",
      "## 哪些東西可以直接插",
      "- **手機、平板、筆電、相機充電器：**變壓器上印著「INPUT 100–240V」就能吃全球電壓，只要插頭插得進去就能用。",
      "- 插座形狀不同，就用一個**轉接頭**（台灣的百元商店或機場都買得到）；**萬國轉接頭**最省事。",
      "- 行動電源、行李秤、電動牙刷等 USB 充電的東西也都沒問題。",
      "",
      "## 這些千萬不要直接插",
      "- 去 **220V** 的國家時，台灣帶去的**吹風機、電湯匙、捲髮棒、小電鍋**這類只吃 110V 的電器，直接插會燒掉甚至冒煙。飯店多半有吹風機，不用自己帶。",
      "- 插上去前先**看變壓器上的字**：有「100–240V」才安全，只寫「110V」就不能用。",
      "- 轉接頭**只轉形狀、不會降電壓**，不要以為插了轉接頭就安全。真的要用 110V 電器要買「變壓器」。",
      "",
      "### 順帶提醒",
      "- **行動電源只能放隨身行李，不可以托運。**",
      "- 手機與行動電源**睡前先充飽**，隔天整天在外面才不會沒電。"
    )},
    {id:"ride",sec:"local",icon:"taxi",title:"叫車與交通",sub:"叫車 App、計程車",body:tplL(
      "### 為什麼用叫車 App",
      "叫車 App **叫車前就看得到車資**，可以直接在 App 付或付現金，不用喊價也不怕繞路，對不會講當地話的人最安全。主辦人會告訴你這次用哪一個（例如東南亞多用 Grab，很多國家用 Uber）。",
      "",
      "## 最重要：註冊要在台灣先做",
      "! 叫車 App 註冊要用**手機號碼收簡訊驗證碼**。出國買的 eSIM 多半**只有上網、沒有電話號碼**，落地才註冊會收不到驗證碼卡住。**請在台灣就用台灣門號註冊完成。**",
      "1. App Store／Google Play 搜尋主辦人說的叫車 App 下載。",
      "2. 用**台灣手機號碼**註冊，收簡訊填驗證碼。",
      "3. 填姓名、email 就完成了；可以不綁信用卡的話，到時選現金付款。",
      "",
      "## 怎麼叫車",
      "1. 打開 App，上面那格是**上車地點**（通常自動抓你現在位置），下面那格輸入**目的地**。看不懂當地地名就從地圖上點，或先在 Google 地圖找好、複製名稱貼上。",
      "2. 選車型：一般選**四人座轎車**；機車載客長輩不建議。",
      "3. 螢幕會直接顯示**車資**，覺得可以就按下訂。",
      "4. 配對後會出現**司機姓名、車型、車牌號碼**。上車前**核對車牌**，不對就不要上。",
      "5. 到了付現金或 App 扣款。車資已經談好，**不用再議價**。",
      "",
      "## 搭一般計程車",
      "- 上車前先**問好價錢**，或請司機**跳表**。",
      "- 叫不到車就**請飯店櫃檯幫忙叫**，這是最穩的方法，也可以請他們先問好價錢。",
      "- 要回飯店時，打開工具頁的「**計程車回飯店卡**」直接給司機看。",
      "- 下車前確認隨身物品都拿了，**手機、包包最常掉在車上**。"
    )},
    {id:"health",sec:"local",icon:"thermo",title:"身體不適",sub:"暈車、腸胃、帶藥",body:tplL(
      "### 先講最重要的",
      "在國外不舒服，**第一件事是告訴主辦人**，不要自己忍。早講可以調整行程、早點就醫；忍到晚上或上了山才說，處理起來麻煩很多。",
      "",
      "## 暈車",
      "- 山路、長途車**彎道多**，容易暈車的人請提早跟主辦人說，**坐前排**會好很多。",
      "- 上車前**不要吃太飽**，也不要空腹。",
      "- 會暈車的人**自己從台灣帶慣用的暈車藥**，出發前一段時間先吃（依你平常的習慣或藥師指示）。",
      "- 車上**看遠方、不要滑手機**，開一點窗透氣。",
      "",
      "## 腸胃不舒服",
      "- 自來水能不能生飲各國不同，**不確定就只喝瓶裝水**，開瓶前確認封膜完好。",
      "- 生冷的食物（生菜、生魚、切好的水果）與**來路不明的冰塊**斟酌，腸胃弱的人避開。",

    {id:"market",sec:"local",icon:"cash",title:"購物與禮儀",sub:"殺價、拍照、宗教場所",body:tplL(
      "### 先有個概念",
      "各國購物習慣不同：**百貨公司、超市、便利商店不議價**；觀光區的市場、小攤常常**開價偏高、可以議價**。主辦人會在這張卡補上這次目的地的狀況。",
      "",
      "## 殺價怎麼開口",
      "- 心裡先想好「**這東西我願意付多少**」，從對方開價的**一半到七成**開始談，通常會落在中間。",
      "- **不想買就不要問價。**一問價對方就會認真跟你談，之後不買容易尷尬、也容易被纏著。",
      "- **轉身走是最有效的一招。**價錢談不下來就微笑說謝謝離開，可以接受的話對方多半會叫住你。",
      "- **多買可以要求算便宜一點**，同一攤買三件比分開買三攤好談。",
      "- 付錢前**再確認一次金額與位數**，找零當場點清楚。",
      "",
      "## 被推銷跟著怎麼辦",
      "- 觀光區常有人**一路跟著推銷**，多半不是針對你，也沒有危險。",
      "- 不想買就**看著對方、微笑、清楚說「不用了，謝謝」**，然後繼續走（外語說法在「外語溝通圖卡 → 基本禮貌」）。",
      "- **不要停下來翻看商品**，一旦拿在手上就很難脫身。",

      "## 拍照的禮貌",
