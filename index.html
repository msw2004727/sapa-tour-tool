      "## 下飛機之後的順序",
      "",
      "1. 跟著人群走到**證照查驗（Immigration）**，排「Foreigners／外國人」那排。",
      "2. 把**護照**交給櫃檯人員，可能會請你看鏡頭拍照、按指紋。不用講話，聽不懂就微笑等他指示。",
      "3. 蓋完章往前走，看螢幕找我們的班機號碼，到**行李轉盤**提行李。",
      "4. 出口前是**海關**，沒有要申報的東西就走綠色通道直接出去。",
      "5. 出關後在大廳等，**跟緊大家、不要自己先走**。",
      "",
      "## 護照怎麼顧",
      "",
      "- **護照絕對不要放托運行李。**隨身背包貼身放，過關後就收好。",
      "- 出發前**拍一張護照資料頁**存在手機相簿，再印一份紙本放行李箱。萬一遺失，補辦會快很多。",
      "- 飯店入住時櫃檯可能會收走護照登記，**記得當天要回來**，離開飯店前確認拿回。",
      "- 護照掉了先找主辦人，並聯絡駐越南台北經濟文化辦事處（電話在「緊急求助」頁）。"
    )},
    {id:"weather",sec:"pre",icon:"thermo",title:"天氣與穿搭",sub:"山上比你想的冷",body:tplL(
      "### 一句話結論",
      "",
      "沙壩在**海拔 1,500 公尺**的山上，九月白天約 **21 度**、晚上會降到 **16 度**，而且十天有六天在下雨。台灣同期還在三十幾度，**溫差比你想像的大**。",
      "",
      "## 各地溫度差很多",
      "",
      "河內（平地）｜悶熱潮濕，跟台灣夏天差不多",
      "沙壩（1,500m）｜白天約 21 度、夜裡約 16 度，早晚涼",
      "番西邦山頂（3,143m）｜比沙壩鎮上**再低約 10 度**，加上山頂風大，體感可能只有幾度",
      "",
      "! 上番西邦那天**一定要帶外套**，不要看沙壩鎮上出太陽就輕裝上山。纜車上去只要十幾分鐘，溫度卻差一大截。",
      "",
      "## 這樣穿最省事",
      "",
      "- **洋蔥式穿法**：短袖或薄長袖打底，外面一件薄外套，最外面一件**防風防潑水外套**。熱了脫、冷了加，比穿一件厚的好用。",
      "- **鞋子要防滑。**山區石板路、梯田步道下過雨很滑，穿包鞋或運動鞋，不要穿新鞋或拖鞋。",
      "- **帶輕便雨衣，勝過雨傘。**山上風大，傘常常撐不住，雨衣還能擋風。",
      "- 怕冷的人多帶一條**薄圍巾或帽子**，脖子跟頭保暖，體感差很多。",
      "- 行李裡放一套**乾的替換衣物**，淋濕了有得換。",
      "",
      "## 雨季尾巴要有心理準備",
      "",
      "- 九月是沙壩雨量最多的月份之一（月雨量約 315 毫米、約 20 個雨天），**遇到下雨是正常的**，通常是陣雨不是整天下。",
      "- 山上常起**雲霧**，看不看得到雲海要碰運氣；霧散得快，等一下再看常有驚喜。",
      "- 雨後**石階很滑**，走路手不要插口袋，慢慢走。",
      "- 房間可能**濕氣重、沒有暖氣**，怕冷的人可以請飯店多給一條被子。"
    )},
    {id:"phoneset",sec:"pre",icon:"phone",title:"手機出發前設定",sub:"關漫遊、先裝好",body:tplL(
      "### 為什麼要先弄",
      "",
      "這幾件事**在台灣用 Wi-Fi 做只要十分鐘**，落地後沒網路才弄會很麻煩。出發前一晚照著做一次就好。",
      "",
      "## 第一件事：關掉數據漫遊",
      "",
      "這是最容易收到高額帳單的地方，出發前一定要關。",
      "",
      "- **iPhone：**設定 → 行動服務 → 找到你的台灣門號 → 把「數據漫遊」關掉。",
      "- **Android：**設定 → 網路和網際網路 → SIM 卡 → 關閉「數據漫遊」。",
      "- 台灣門號**不要整個關掉**，留著才能收銀行或驗證碼簡訊，只關「數據漫遊」即可。",
      "- 有買 eSIM 的人，上網走 eSIM，作法看「eSIM 網路卡怎麼買」那張卡。",
      "",
      "## 出發前先裝好、先下載好",
      "",
      "- **Grab**（叫車用）：註冊要用手機號碼收簡訊驗證，**一定要在台灣用台灣門號註冊好**，落地才裝常常收不到驗證碼。",
      "- **Google 地圖離線地圖**：搜尋「Sa Pa」→ 點地名 → 下載 → 下載離線地圖。沒網路也能看自己在哪。",
      "- **Google 翻譯**：進 App 把「越南文」語言包下載成離線，相機即時翻譯菜單很好用。",
      "- **本工具站**：用瀏覽器打開後「加入主畫面」，之後像 App 一樣點開，沒網路也看得到。",
      "",
      "## 存好這些資料",
      "",
      "- 把**主辦人電話**存進通訊錄（緊急求助頁有）。",
      "- **飯店名稱與地址截圖**存在相簿，走散時可以直接給司機看——本工具站的「計程車回飯店卡」已經是越文版，更好用。",
      "- 護照資料頁拍照存起來。",
      "- **把手機的緊急聯絡人設定好**，並記得帶**行動電源**；山區冷、訊號差，電量掉得比平常快。",
      "",
      "### 打電話怎麼打",
      "",
      "eSIM 多半只有上網、沒有電話號碼。要聯絡團員請用 **LINE 免費通話**；打當地電話（飯店、餐廳）才需要用台灣門號直撥，會算國際漫遊費。"
    )},
    {id:"exchange",sec:"pre",icon:"cash",title:"換匯與付款",sub:"心算法、刷卡還付現",body:tplL(
      "### 先記這個心算法",
      "",
      "**越盾去掉三個零，再乘以 1.2，就是台幣。**",
      "例如 100,000 盾 → 去掉三個零剩 100 → ×1.2 ＝ **約 120 台幣**。",
      "算不出來就用工具頁的「外幣點鈔速算」，按鈔票就好，不用打字。",
      "",
      "## 在哪裡換錢",
      "",
      "- **台灣的銀行也能換越南盾，但匯率通常比較差。**多數人是在台灣先換好美金，到越南再換成越盾，或直接在當地提款。",
      "- **機場換一點就好。**機場匯率差，換夠當天車資與零用即可，其餘到市區再換。",
      "- **ATM 提款**方便但每筆有手續費，還可能被台灣的銀行再收一次；要用的人出發前先確認金融卡有開通海外提款與密碼。",
      "- 換錢時**當場點清楚再走**，並要求多給一些小面額。",
      "",
      "## 越南盾的三個坑",
      "",
      "- **零很多。**一碗河粉五萬盾聽起來嚇人，其實約 60 台幣。看到價格先去掉三個零再算。",
      "- **顏色很像。**20,000（藍）和 500,000（藍綠）容易看錯，付錢跟找零都要**看清楚位數**，一張差 25 倍。",
      "- **小費與零錢要小面額。**10,000、20,000、50,000 各留幾張，只有大鈔會很難處理。",
      "",
      "## 刷卡還是付現",
      "",
      "飯店、大餐廳｜可以刷卡，記得選**用越盾結帳**（選台幣結帳匯率較差）",
      "市場、小攤、路邊攤｜只收現金，準備小鈔",
      "計程車 / Grab｜現金最保險；Grab 也可綁卡",
      "參考匯率｜1 台幣 ≈ 820 越盾（以工具頁「外幣點鈔速算」裡的設定為準）"
    )},
    {id:"esim",sec:"pre",icon:"wifi",title:"eSIM 怎麼買",sub:"KKday、Saily",body:tplL(
      "### 什麼是 eSIM",
      "",
      "不用換實體 SIM 卡，直接在手機裡「下載」一組越南門號上網。出國前在台灣就能買好，落地開機就有網路，不必到機場排隊買卡，也不會弄丟原本的 SIM 卡。",
      "",
      "## 方法一：KKday",
      "",
      "買完把 QR Code 寄到你的 email，自己掃描安裝。",
      "",
      "1. 打開 KKday 網站或 App，搜尋「**越南 eSIM**」。",
      "2. 挑天數與流量。我們是 5 天 4 夜，選 **5～7 天**、每日 1～2GB 的方案就很夠用（看影片多的人選吃到飽）。",
      "3. 結帳後 **QR Code 會寄到你的 email**，沒收到請先看垃圾郵件匣。",
      "4. 出發前一天在家用 Wi-Fi 掃描 QR Code 安裝（安裝要有網路）。",
      "5. 落地越南後，到「設定 → 行動網路」把這張新的 eSIM 打開、開啟數據漫遊就會通。",
      "",
      "! **QR Code 只能掃一次**，掃了就綁定那支手機，不能換機也不能刪掉重來。掃之前先確定是要用的那支手機。",
      "",
      "## 方法二：Saily App",
      "",
      "買、裝、開通全部在同一個 App 裡完成。",
      "",
      "1. App Store／Google Play 下載 **Saily**，用 Apple ID 或 Google 帳號註冊。",
      "2. 點「Explore Plans」→ 搜尋 **Vietnam（越南）**，選流量與天數。",
      "3. 用信用卡、Apple Pay 或 Google Pay 付款。",
      "4. 付完在 App 裡點「**Install eSIM**」，iPhone 會自動加入行動方案；Android 到「設定 → 網路 → SIM → 下載 eSIM」。",
      "5. Saily 的流量是**第一次連上越南電信時才開始算**，所以可以在台灣提早裝好，不會浪費天數。",
      "",
      "## eSIM 注意須知",
      "",
      "- **先確認手機支援 eSIM。**iPhone XS（2018）以後大多支援，但**在中國大陸買的 iPhone 幾乎都不支援**（只有 2026 年的 iPhone Air、17e 等少數新機才開放）；Android 看 Google Pixel 3 以後、三星 S20 以後的國際版，**台灣買的三星多半不支援**（連 S25 台灣版都沒有）。不確定就撥 ***#06#**，畫面有出現「EID」才代表支援。",
      "- **安裝一定要有網路。**在台灣用家裡或飯店 Wi-Fi 裝好最保險，落地後才裝可能連不上網而卡住。",
      "- **不要刪掉原本的台灣門號。**eSIM 是額外加一組，台灣號碼留著才能收簡訊驗證碼；只要把「行動數據」切到越南那張、台灣那張**關掉數據漫遊**就不會被扣漫遊費。",
      "- **KKday 的 QR Code 只能掃一次**，Saily 可以在 App 內重新安裝，怕操作失誤的人選 Saily 比較保險。",
      "- **eSIM 多半只有數據、沒有電話號碼**，不能打電話或收簡訊。要打電話請用 LINE、Messenger 語音通話。",
      "- 落地後如果沒網路：關飛航模式再開一次 → 確認新 eSIM 已開啟 → 打開「數據漫遊」 → 還是不行就重開機。",
      "- 沙壩山區、番西邦纜車上訊號會變差，這是正常的，不是卡有問題。",
      "- 不想自己弄的人可以直接用飯店 Wi-Fi，或跟主辦人說，出發前一起處理。"
    )},
    {id:"tips",sec:"pre",icon:"gift",title:"小費文化",sub:"給多少、哪些場合",body:tplL(
      "### 一句話結論",
      "",
      "越南**沒有強制小費**的規定，不給也不會被白眼。但在觀光區給一點是常見的禮貌，金額小、心意到就好。",
      "",
      "## 常見場合與行情",
      "",
      "飯店房務｜每天 20,000～50,000 越盾，放在枕頭上或桌上",
      "行李員｜每件行李 20,000～50,000 越盾",
      "餐廳｜帳單如果已收 5～10% service charge 就不用再給；沒收的話留零錢即可",
      "按摩｜50,000～100,000 越盾，做得舒服再給",
      "計程車 / Grab｜不用給，湊整數不用找零就很夠",
      "包車司機 / 導覽｜大家一起出比較好處理，可以跟主辦人討論",
      "",
      "## 給小費的眉角",
      "",
      "- **準備小面額。**10,000、20,000、50,000 越盾各留幾張，不然只有 500,000 大鈔會很尷尬。",
      "- **用越盾，不要給台幣或硬幣。**外幣硬幣他們換不掉，等於沒給。",
      "- **雙手遞、面帶微笑**，或直接放在桌上；不要丟或塞。",
      "- 服務讓你不舒服就**不用給**，不要有壓力。",
      "- 小心「找零陷阱」：越盾 20,000 和 500,000 顏色接近，付錢與找零時**看清楚位數**再收。"
    )},
    {id:"power",sec:"pre",icon:"plug",title:"電壓與插頭",sub:"220V、雙圓孔",body:tplL(
      "### 越南的電",
      "",
      "**電壓 220V、頻率 50Hz**（台灣是 110V、60Hz）。插座大多是**雙圓孔**，很多飯店是圓孔與扁孔通用的萬用插座。",
      "",
      "## 哪些東西可以直接插",
      "",
      "- **手機、平板、筆電、相機充電器：可以直接用。**這類變壓器上都印著「INPUT 100–240V」，本來就吃全球電壓。",
      "- 台灣的**兩腳扁插頭**大多可以直接插進越南的萬用插座；插不進去就用一個小圓轉接頭（台灣的百元商店或機場都買得到）。",
      "- 行動電源、行李秤、電動牙刷等 USB 充電的東西也都沒問題。",
      "",
      "## 這些千萬不要直接插",
      "",
      "- **台灣帶去的吹風機、電湯匙、捲髮棒、小電鍋**——這類只吃 110V，直接插 220V 會燒掉甚至冒煙。飯店都有吹風機，不用自己帶。",
      "- 插上去前先**看變壓器上的字**：有「100–240V」才安全，只寫「110V」就不能用。",
      "- 轉接頭**只轉形狀、不會降電壓**，不要以為插了轉接頭就安全。真的要用 110V 電器要買「變壓器」。",
      "",
      "### 順帶提醒",
      "",
      "沙壩山區偶爾會短暫停電，手機與行動電源**睡前先充飽**。夜臥火車上的插座不一定每個舖位都有，建議帶一顆行動電源。"
    )},
    {id:"grab",sec:"local",icon:"taxi",title:"Grab 叫車",sub:"先看價錢不喊價",body:tplL(
      "### 為什麼推薦用 Grab",
      "",
      "Grab 是東南亞版的計程車 App。**叫車前就看得到車資、直接在 App 付或現金付**，不用喊價也不怕繞路，對不會講越南文的人最安全。",
      "",
      "## 最重要：註冊要在台灣先做",
      "",
      "! Grab 註冊要用**手機號碼收簡訊驗證碼**。出國買的 eSIM 多半**只有上網、沒有電話號碼**，落地才註冊會收不到驗證碼卡住。**請在台灣就用台灣門號註冊完成。**",
      "",
      "1. App Store／Google Play 搜尋「**Grab**」下載。",
      "2. 用**台灣手機號碼**註冊，收簡訊填驗證碼。",
      "3. 填姓名、email 就完成了，可以不綁信用卡（到時選現金付款）。",
      "",
      "## 怎麼叫車",
      "",
      "1. 打開 App，上面那格是**上車地點**（通常自動抓你現在位置），下面那格輸入**目的地**。看不懂越南地名就從地圖上點，或先在 Google 地圖找好、複製名稱貼上。",
      "2. 選車型：**Car 是四人座轎車**（推薦），Bike 是機車載客，長輩不建議。",
      "3. 螢幕會直接顯示**車資**，覺得可以就按下訂。",
      "4. 配對後會出現**司機姓名、車型、車牌號碼**。上車前**核對車牌**，不對就不要上。",
      "5. 到了付現金或 App 扣款。車資已經談好，**不用再議價**。",
      "",
      "## 沙壩的實際狀況",
      "",
      "- 沙壩**叫得到 Grab，但司機比河內少很多**，**清晨與深夜特別難叫**，可能等比較久或叫不到。",
      "- 另一個選擇是 **Xanh SM**（越南的電動計程車，車身是青綠色），沙壩也有跑，可以用它的 App 叫，路邊也招得到。",
      "- 叫不到車就**請飯店櫃檯幫忙叫**，這是最穩的方法，也可以請他們先問好價錢。",
      "- 從老街火車站到沙壩這段山路**不適合用 App**，一般是搭接駁巴士或共乘小巴，跟著團走就好。",
      "- 真的要搭路邊計程車，上車前先問「Bao nhiêu tiền?（包 妞 電）多少錢」講好價，或請司機**開計費表**。"
    )},
    {id:"health",sec:"local",icon:"thermo",title:"身體不適",sub:"暈車、腸胃、上高山",body:tplL(
      "### 先講最重要的",
      "",
      "在國外不舒服，**第一件事是告訴主辦人**，不要自己忍。早講可以調整行程、早點就醫；忍到晚上或上了山才說，處理起來麻煩很多。",
      "",
      "## 上番西邦會不會高山症",
      "",
      "- 沙壩鎮上海拔約 1,500 公尺，**一般不會有高山反應**。",

  if(o&&o.length) out=o.filter(function(x){ return ZONE_ORDER_DEF.indexOf(x)>=0 && out.indexOf(x)<0; });
  ZONE_ORDER_DEF.forEach(function(x){ if(out.indexOf(x)<0) out.push(x); });   /* 補齊漏掉的，順序設定壞掉也不會少卡片 */

   要收起來只能用下拉，避免長輩一路按 ↓ 把卡片按不見。 */
var ZONE_VIS=['now','later','ref'];
function zoneMove(id,dir){
  var di=dayInfo(), ord=zoneOrder(), z=cardZone(id,di), zi=ZONE_VIS.indexOf(z);
  if(zi<0) return;
  var sib=ord.filter(function(x){ return cardZone(x,di)===z; });
  var i=sib.indexOf(id), j=i+dir; if(i<0) return;
  var st=S().settings; if(!st.zones) st.zones={};
  if(j>=0&&j<sib.length){
    var a=ord.indexOf(id), b=ord.indexOf(sib[j]);
    ord[a]=sib[j]; ord[b]=id;
  }else{
    if(!cardMovable(id)) return;              /* 今日行程只能在現在區內換先後 */
    var nz=ZONE_VIS[zi+dir]; if(!nz) return;
    setPin(id,nz);                            /* 先釘住，cardZone 才會回報新分區 */
    ord.splice(ord.indexOf(id),1);
    var grp=ord.filter(function(x){ return cardZone(x,di)===nz; }), at;
    if(grp.length){ at = dir<0 ? ord.indexOf(grp[grp.length-1])+1 : ord.indexOf(grp[0]); }
    else{ /* 目標區是空的：排在所有更上面的區之後 */
      at=0; ord.forEach(function(x,k){ var xi=ZONE_VIS.indexOf(cardZone(x,di));
        if(xi>=0&&xi<ZONE_VIS.indexOf(nz)) at=k+1; });
    }

    '</section>');
  } else {
  /* 置頂即時廣播（永遠展開，不可收合） */
  var tm=(b.time||'');
  h.push('<section class="hero" aria-label="即時廣播">'+

    (tm?'<div class="time">'+esc(tm)+'<small>'+esc(b.label||'集合')+(bcIsTW()?'・台灣時間':'')+'</small></div>'
       :'<div class="time" style="font-size:1.9rem">'+(b.idle?'自由活動':'集合時間待公布')+'</div>')+
    '<div class="count" id="countdown" hidden></div>'+
    (tm||!b.idle
      ?'<div class="loc'+((b.location||'').length>12?' long':'')+'">'+ic('pin')+'<span>'+esc(b.location||'集合地點待公布')+'</span></div>'
      :'<div class="loc"><span>目前沒有集合安排，請等下次廣播通知。</span></div>')+
    (b.tip?'<div class="tip">'+ic('thermo')+'<span>'+esc(b.tip)+'</span></div>':'')+
    (P.leader?'<div class="ctl"><button class="btn" data-act="editBroadcast">'+ic('edit')+'修改廣播</button><button class="btn" data-act="tool" data-tool="rollcall">'+ic('clipboard')+'點名</button><button class="btn" data-act="bumpTime" data-min="15">現在＋15分</button><button class="btn" data-act="bumpTime" data-min="30">現在＋30分</button></div>'+(tm||b.location||b.tip?'<div class="hero-foot"><button class="clr" data-act="clearBroadcast">'+ic('trash')+'清空廣播</button><button class="clr shr" data-act="shareBroadcast" aria-label="把這則廣播貼到 LINE 群組">'+ic('lineshare')+'LINE</button></div>':''):'')+
  '</section>');
  }
  /* 我的資訊：不分出發前後，固定顯示交通（原本的航空公司）／房號，再加上「我被分配到的每一個分組」；
     管理者可在「管理專區→首頁分組顯示」把不想曝光的分組情境關掉。交通的集合地點跟著分組走，
     管理者在「分組 → 交通」改，不是寫死在程式裡。 */
  var me=getMe();
  if(me){
    h.push('<div class="me-strip">'+stripCells(me,di).join('')+'</div>');
  } else {
    h.push('<button class="btn big block" data-act="pickMe">'+ic('search')+'<span class="b2">點這裡選你的名字<small>首頁就會顯示你的交通、房號、分組</small></span></button>');
  }


  /* 分區交給 cardZone()，同一區裡的先後交給 zoneOrder()（管理者可調）。 */
  var Z={now:[],later:[],ref:[]};
  var BUILD={
    today:function(){ return wrapHL('today',todayCard(di,day)); },
    prep:prepCard, hotel:hotelCard, flight:flightCard, morning:morningCard
  };
  zoneOrder().forEach(function(id){
    var z=cardZone(id,di); if(z==='hide'||!Z[z]) return;
    var html=BUILD[id](); if(html) Z[z].push(html);
  });
  Z.ref.push(sosRow());
  h.push(grp('now','現在',Z.now));
  h.push(grp('later','稍後',Z.later));
  h.push(grp('ref','隨時查',Z.ref));

  return h.join('');
};

    '<div class="card-h"><h2>'+ic('calendar')+(di.status==='before'?'第 1 天預告':'今日行程')+'</h2><span class="sub">第 '+day+' 天 · '+esc(dayDate(day))+'</span></div>'+
    '<div class="pv">'+todays.map(function(x){
      /* 沒填時間的站：時間欄放一個小圓點佔位（不是空的膠囊），標題才跟有時間的站對齊（v3.32） */
      var has=!!String(x.time==null?'':x.time).trim();

/* 目前住宿（可收合） */
function hotelCard(){

    '<div class="row" style="margin-top:.7rem">'+(ho.addrVi||ho.nameVi||ho.name?'<a class="btn" href="'+mapDirHref((ho.nameVi||ho.name)+' '+(ho.addrVi||''))+'" target="_blank" rel="noopener">'+ic('pin')+'走回飯店</a>':'')+'<button class="btn warn" data-act="fullTaxi">'+ic('taxi')+'計程車回飯店卡</button>'+(lineC?'<a class="btn line" href="'+esc(lineC.line)+'" target="_blank" rel="noopener" aria-label="用 LINE 聯繫'+esc(lineC.name)+'">'+ic('chat')+'LINE聯繫</a>':'')+'</div>';

/* 交通資訊（可收合）：勾了「顯示在首頁交通資訊」的交通情境（例：航班），每一組的去程（搭乘時間）／回程出發時間。
   v3.25 以前叫「航班」，固定長榮、華航兩家，時間存在團務設定；現在跟著「分組 → 交通」的每一組走。
   只列出有填時間的組：去程或回程任一個有填就列出，另一個沒填的寫「待公布」；兩個都沒填的不列。
   卡片 id 仍叫 flight：首頁卡片位置與高亮設定存的鍵不能改。 */
function flightCard(){
  var st=S().settings, f=st.flights||{}, days=st.days||5, di=dayInfo(), ph=flightPhase(di);
  if(ph==='none') return '';
  var back=(ph==='back');
  function tm(g){ return back?g.back:g.out; }
  /* 去程：長榮 09:00・華航 08:20；回程：華航 11:30・長榮 12:05 —— 依時間排，先走的在前 */
  var list=trCardGroups().filter(function(g){ return g.out||g.back; }).sort(function(a,b){ var ta=tm(a)||'99:99', tb=tm(b)||'99:99'; return ta<tb?-1:(ta>tb?1:0); });
  var scs={}; list.forEach(function(g){ scs[g.sc.id]=1; }); var multi=Object.keys(scs).length>1;
  var noteBox=(!back&&f.note&&!(di.status==='before'&&!(S().broadcast||{}).time))?'<div class="warn-box" style="margin-top:.6rem">'+ic('clock')+'<span>'+esc(f.note)+'</span></div>':'';
  if(!list.length&&!noteBox) return '';
  function col(g){ var x=tm(g);
    return '<div class="fl-col"><div class="fl-h">'+trBadge(g.sc,g.gi)+esc((multi?g.sc.name+'・':'')+g.name)+'</div>'+
      '<div class="fl-r"><b>'+(x?esc(x):'<span class="muted" style="font-size:1rem">待公布</span>')+'</b><span class="k">'+
      (back?'回程出發'+(f.backPort?' · '+esc(f.backPort):''):'去程出發'+(g.note?' · '+esc(g.note):''))+'</span></div></div>'; }
  var inner=(list.length?'<div class="fl">'+list.map(col).join('')+'</div>':'')+noteBox;
  /* 收起時的摘要：每一組一段、段內不斷行，窄螢幕時整段換行而不是被「…」切掉 */
  var sum=list.length?list.map(function(g){ return '<span class="nw">'+esc(g.short+' '+(tm(g)||'待公布'))+'</span>'; }).join('<span class="sep">・</span>'):'團體報到說明';
  return foldCard('flight','bus',back?'回程交通':'去程交通',(back?dayDate(days):dayDate(1)).split('（')[0],sum,inner,{sumHtml:true});
}

/* ===== 行程卡片底圖（每個行程項目一張）=====
   圖存在獨立的 photos 文件（不是 itinerary），因為新增／編輯行程是整份覆寫，
   放一起的話改一個字就要重傳所有圖。上傳時已經裁切＋縮到 360×203＋轉 WebP，
   這裡只負責畫出來。 */
function photoMap(){ var p=S().photos||{}; return p.items||(p.items={}); }
function itemBg(id){ var b=photoMap()[id]; return (b&&b.src)?b:null; }
function bgOp(b){ var n=Number(b&&b.op); return (n>=1&&n<=40)?n:9; }
/* 資料 URI 只有 base64 字元，放進行內 style 的 url('') 不用跳脫 */
function bgStyle(b){ return b?(' style="--dbg:url(\''+b.src+'\');--dop:'+(bgOp(b)/100)+'"'):''; }
/* 首頁「今日行程」主卡不放底圖：那張卡是一整天的清單，挑哪一張都是猜的，
   而且它會跟高亮的金色底、頂部彩條疊在一起。底圖只出現在「行程」分頁的每一站卡片上。 */
/* 全部底圖合計多大（設定面板顯示用，也是容量的煞車） */
function photoTotal(){
  var m=photoMap(), n=0, kb=0;
  Object.keys(m).forEach(function(k){ if(m[k]&&m[k].src){ n++; kb+=m[k].src.length/1024; } });
  return {n:n, kb:Math.round(kb)};
}

/* ===== 知識小卡的簡易標記 =====
   一行一種東西，主辦人在一個大文字框裡寫：
     ## 小標題        ### 重點框的標題（開一個新的框）

     ! 警示           名稱｜說明（對照表，半形 | 也可以）
     **粗體**         空一行＝分段；其他就是一般文字

function mdIn(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function mdLine(s){ var m;
  s=String(s).replace(/\s+$/,''); if(!s.trim()) return {t:'_'};
  s=s.replace(/^\s+/,'');
  if((m=/^#{3,}\s*(.*)$/.exec(s))) return {t:'h3',x:m[1]};
  if((m=/^#{1,2}\s*(.*)$/.exec(s))) return {t:'h2',x:m[1]};
  if((m=/^[!！]\s*(.+)$/.exec(s))) return {t:'w',x:m[1]};
  if((m=/^(?:[-•・]\s*|\*\s+)(.+)$/.exec(s))) return {t:'ul',x:m[1]};
  if((m=/^\d{1,2}(?:\.\s+|、\s*|[)）]\s*)(.+)$/.exec(s))) return {t:'ol',x:m[1]};
  if((m=/^([^｜|]+?)\s*[｜|]\s*(.+)$/.exec(s))) return {t:'kv',k:m[1],x:m[2]};
  return {t:'p',x:s}; }
function mdCard(src){

/* ===== 行程底圖（放在行程編輯表單裡，每個行程項目一張）=====
   底圖存在獨立的 photos 文件、套用後直接寫回，不跟著表單的「儲存」按鈕走——
   避免管理者改完圖又按取消，結果圖也一起不見；也避免每改一個字就要重傳圖片。 */
var DBG=null;   /* 正在裁切中的狀態：{id,img,s0,z,tx,ty,px,py} */
function dbgField(id){
  if(!id) return '<div class="f"><label>行程底圖</label><div class="muted dbg-tip">先按下面的「儲存」把這個行程建立起來，再回來編輯就能加底圖。</div></div>';
  var b=itemBg(id), op=bgOp(b), has=!!b, tot=photoTotal();
  var url=has?"url('"+b.src+"')":'none';
  return '<div class="f" id="dbgF" data-id="'+esc(id)+'">'+
    '<label>這個行程的底圖<span class="dbg-sub">一個行程一張，極淡地墊在卡片後面</span></label>'+
    '<div class="dbg-frame" id="dbgFrame"'+(has?' style="background-image:'+url+'"':'')+'>'+
      '<img id="dbgImg" alt="" hidden>'+
      '<span class="dbg-hint" id="dbgHint"'+(has?' hidden':'')+'>還沒有底圖</span>'+
    '</div>'+
    '<div id="dbgCrop" hidden>'+
      '<div class="dbg-row"><span>縮放</span><input type="range" id="dbgZ" min="100" max="300" value="100"><output id="dbgZV">100%</output></div>'+
      '<div class="dbg-row"><span>左右</span><input type="range" id="dbgX" min="-100" max="100" value="0" disabled><output id="dbgXV">置中</output></div>'+
      '<div class="dbg-row"><span>上下</span><input type="range" id="dbgY" min="-100" max="100" value="0" disabled><output id="dbgYV">置中</output></div>'+
      '<div class="muted dbg-tip">也可以直接在上面那格拖曳。放大到蓋滿整格之後，左右／上下才有得移動。按「套用」時只會存下框裡看到的那一塊。</div>'+
    '</div>'+
    '<div class="dbg-row"><span>濃度</span><input type="range" id="dbgOp" min="3" max="30" value="'+op+'"'+(has?'':' disabled')+'><output id="dbgOpV">'+op+'%</output></div>'+
    '<div class="dbg-prev" id="dbgPrev" style="--dbg:'+url+';--dop:'+(has?op/100:0)+'">'+
      '<div class="pv-t">08:00</div><div><b>搭纜車上山</b><span>山上約 10 度，請備妥外套與保溫水壺</span></div>'+
    '</div>'+
    '<div class="row dbg-btns">'+
      '<label class="btn sm" style="cursor:pointer">'+ic('camera')+'選照片<input type="file" id="dbgFile" accept="image/*" hidden></label>'+
      '<button type="button" class="btn sm pri" id="dbgApply" data-act="dbgApply" hidden>'+ic('check')+'套用這一塊</button>'+
      '<button type="button" class="btn sm dng" data-act="dbgRemove"'+(has?'':' hidden')+' id="dbgDel">'+ic('trash')+'移除底圖</button>'+
    '</div>'+
    '<div class="muted dbg-size" id="dbgSize">'+(has&&b.kb?('這張約 '+b.kb+' KB'):'')+'</div>'+
    '<div class="muted dbg-size" id="dbgTot">'+dbgTotText(tot)+'</div>'+
  '</div>';
}
/* 全團容量提醒：整包資料每次開 App 都要下載一次，所以底圖總量要看得見。 */
var DBG_BUDGET=600;   /* KB，超過就變成警告字樣 */
function dbgTotText(t){
  if(!t.n) return '目前全團還沒有任何底圖。';
  return '全團共 '+t.n+' 張底圖，合計約 '+t.kb+' KB'+(t.kb>DBG_BUDGET?'（偏多了，建議控制在 '+DBG_BUDGET+' KB 以內）':'')+'。';
}
function dbgRefresh(){
  var f=el('dbgF'); if(!f) return;
  var id=f.getAttribute('data-id'), b=itemBg(id), has=!!b, op=bgOp(b);
  var url=has?"url('"+b.src+"')":'none';
  var fr=el('dbgFrame'); if(fr) fr.style.backgroundImage=url;
  var im=el('dbgImg'); if(im){ im.hidden=true; im.removeAttribute('src'); }
  if(el('dbgHint')) el('dbgHint').hidden=has;
  if(el('dbgCrop')) el('dbgCrop').hidden=true;
  if(el('dbgApply')) el('dbgApply').hidden=true;
  if(el('dbgDel')) el('dbgDel').hidden=!has;
  var o=el('dbgOp'); if(o){ o.disabled=!has; o.value=op; }
  if(el('dbgOpV')) el('dbgOpV').textContent=op+'%';
  var pv=el('dbgPrev');
  if(pv){ pv.style.setProperty('--dbg',url); pv.style.setProperty('--dop',has?op/100:0); }
  if(el('dbgSize')) el('dbgSize').textContent=(has&&b.kb)?('這張約 '+b.kb+' KB'):'';
  if(el('dbgTot')) el('dbgTot').textContent=dbgTotText(photoTotal());
}
/* 把框裡看到的那一塊畫成 420×236，轉成 WebP。
   舊版 Safari 的 canvas 不支援 WebP 編碼會「默默吐出 PNG」，所以要檢查回傳的型別，
   不對就退回 JPEG；超過容量上限就自動降品質再壓一次。 */
function dbgEncode(canvas,cb){
  var CAP=9000, TYPES=['image/webp','image/jpeg'];
  function go(ti,q){
    if(ti>=TYPES.length) return cb(null);
    canvas.toBlob(function(b){
      if(!b) return go(ti+1,0.55);
      if(b.type!==TYPES[ti]) return go(ti+1,0.55);     /* 這個瀏覽器不會編這種格式 */
      if(b.size>CAP&&q>0.32) return go(ti,q-0.1);
      var fr=new FileReader();
      fr.onload=function(){ cb(fr.result,b.size,b.type); };
      fr.readAsDataURL(b);
    },TYPES[ti],q);
  }
  go(0,0.6);
}
/* 左右／上下滑桿跟拖曳共用同一份 tx/ty：
   滑桿是「可移動範圍的百分比」，拖曳完再換算回百分比寫回滑桿，兩邊永遠同步。 */
function dbgPos(v){ return v===0?'置中':((v>0?'+':'')+v+'%'); }
function dbgLayout(){
  if(!DBG) return;
  var f=el('dbgFrame'), im=el('dbgImg');
  var fw=f.clientWidth, fh=f.clientHeight;
  DBG.s0=Math.max(fw/DBG.img.naturalWidth, fh/DBG.img.naturalHeight);
  var sc=DBG.s0*DBG.z, dw=DBG.img.naturalWidth*sc, dh=DBG.img.naturalHeight*sc;
  /* 不讓框看到圖片以外的空白 */
  var mx=Math.max(0,(dw-fw)/2), my=Math.max(0,(dh-fh)/2);
  if(DBG.bySlider){ DBG.tx=mx*DBG.px/100; DBG.ty=my*DBG.py/100; DBG.bySlider=false; }
  DBG.tx=Math.max(-mx,Math.min(mx,DBG.tx));
  DBG.ty=Math.max(-my,Math.min(my,DBG.ty));
  DBG.px=mx?Math.round(DBG.tx/mx*100):0;
  DBG.py=my?Math.round(DBG.ty/my*100):0;
  var xs=el('dbgX'), ys=el('dbgY');
  if(xs){ xs.value=DBG.px; xs.disabled=mx<1; }
  if(ys){ ys.value=DBG.py; ys.disabled=my<1; }
  if(el('dbgXV')) el('dbgXV').textContent=(mx<1?'—':dbgPos(DBG.px));
  if(el('dbgYV')) el('dbgYV').textContent=(my<1?'—':dbgPos(DBG.py));
  im.style.width=dw+'px'; im.style.height=dh+'px';
  im.style.transform='translate('+(-dw/2+DBG.tx)+'px,'+(-dh/2+DBG.ty)+'px)';
}
function dbgOpenFile(file){
  var fr=new FileReader();
  fr.onload=function(){
    var im=el('dbgImg'), cur=itemBg(el('dbgF').getAttribute('data-id'));
    im.onload=function(){
      DBG={id:el('dbgF').getAttribute('data-id'),img:im,s0:1,z:1,tx:0,ty:0,px:0,py:0};
      im.hidden=false; el('dbgHint').hidden=true;
      el('dbgFrame').style.backgroundImage='none';
      el('dbgCrop').hidden=false; el('dbgApply').hidden=false;
      el('dbgZ').value=100; el('dbgZV').textContent='100%';
      /* 第一次上傳時濃度滑桿原本是 disabled（因為那時還沒有圖），這裡一定要打開，
         不然濃度會卡在預設值調不動。 */
      var o=el('dbgOp'); if(o){ o.disabled=false; if(!cur){ o.value=bgOp(null); if(el('dbgOpV')) el('dbgOpV').textContent=o.value+'%'; } }
      el('dbgSize').textContent='調好位置後按「套用這一塊」';
      dbgLayout(); dbgPreview();
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
/* 裁切中也要看得到效果：放開手指／放開滑桿時才重畫一次小圖，拖曳過程不做，免得卡頓 */
function dbgPreview(){
  if(!DBG||!el('dbgPrev')) return;
  var f=el('dbgFrame'), fw=f.clientWidth, fh=f.clientHeight;
  var sc=DBG.s0*DBG.z, dw=DBG.img.naturalWidth*sc, dh=DBG.img.naturalHeight*sc;
  var sx=(dw/2-fw/2-DBG.tx)/sc, sy=(dh/2-fh/2-DBG.ty)/sc;
  var cv=document.createElement('canvas'); cv.width=210; cv.height=118;
  try{
    cv.getContext('2d').drawImage(DBG.img,sx,sy,fw/sc,fh/sc,0,0,210,118);
    el('dbgPrev').style.setProperty('--dbg',"url('"+cv.toDataURL('image/jpeg',0.5)+"')");
    el('dbgPrev').style.setProperty('--dop',(Number(el('dbgOp').value)||9)/100);
  }catch(e){}
}
function dbgApply(){
  if(!DBG) return;
  var f=el('dbgFrame'), fw=f.clientWidth, fh=f.clientHeight;
  var sc=DBG.s0*DBG.z, dw=DBG.img.naturalWidth*sc, dh=DBG.img.naturalHeight*sc;
  /* 框的左上角換算回原圖座標 */
  var sx=(dw/2-fw/2-DBG.tx)/sc, sy=(dh/2-fh/2-DBG.ty)/sc, sw=fw/sc, sh=fh/sc;
  var OW=360, OH=Math.round(OW*9/16);
  var cv=document.createElement('canvas'); cv.width=OW; cv.height=OH;
  var cx=cv.getContext('2d');
  cx.imageSmoothingQuality='high';
  cx.drawImage(DBG.img,sx,sy,sw,sh,0,0,OW,OH);
  el('dbgSize').textContent='壓縮中…';
  var id=DBG.id;
  dbgEncode(cv,function(uri,size,type){
    if(!uri){ toast('這張照片壓不下來，換一張試試'); el('dbgSize').textContent=''; return; }
    var op=Number(el('dbgOp').value)||9, kb=Math.round(size/1024*10)/10;
    photoMap()[id]={src:uri,op:op,kb:kb};
    Store.savePath('photos','items/'+id,photoMap()[id]);
    DBG=null; render();
    /* 只更新底圖那一區，不重開整張表單——重開會把還沒儲存的文字改動丟掉 */
    dbgRefresh();
    toast('底圖已套用（'+kb+' KB · '+(type==='image/webp'?'WebP':'JPEG')+'）');
  });
}

/* 還原上一版：只列出「資料曾經突然變少」時自動留下的那幾份 */
function sheetPrev(){

  var body=list.length
    ? '<div class="muted">下面是資料突然變少時自動留下的上一版。按「還原」會把那一版寫回雲端、同步給全團。</div><div class="stack" style="margin-top:.6rem">'+
      list.map(function(p){ var d=new Date(p.at); var hm=(d.getMonth()+1)+'/'+d.getDate()+' '+(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
        return '<div class="it-row"><div style="flex:1"><b>'+esc(DOC_NAMES[p.key])+'</b><div class="muted">'+p.n+' 筆 · 留存於 '+hm+'（目前 '+Store.docCount(p.key,Store.s[p.key])+' 筆）</div></div><button class="btn sm pri" data-act="restorePrev" data-key="'+p.key+'">還原</button></div>'; }).join('')+'</div>'
    : '<div class="muted">目前沒有需要還原的版本。只有在名單、行程、分組或記事本突然少掉一半以上時，才會自動留一份。</div>';
  openSheet({title:'還原上一版',body:body});
}
/* 時間模擬：挑一個時間點，重新載入後整個 App 以為「現在」是那個時間。
   只寫在這個分頁的 sessionStorage，關掉 App 就自動結束；模擬期間任何修改都不會存檔。 */
function sheetSim(){
  var st=S().settings, P2=[];
  function at(n,hm){ return dayYmd(n)+'T'+hm; }
  var d0=ymd(parseDate(st.startDate)-86400000), dEnd=ymd(parseDate(st.startDate)+(st.days||5)*86400000);

/* ===== 分組情境的編輯表單（v3.25）=====
   一律「逐列」編輯：每一組一張小卡（名稱＋這個分類多出來的欄位）。新增、刪除、上移、下移只動表單裡的狀態，
   按「儲存」才寫出去；存檔時用每一列記著的原本組別（o）重新對應每個人的分組，刪掉的那一組的人回到「尚未分組」。
   表單的狀態放在 SHEET.st（名稱、各列、提醒…），SHEET.cat 是現在選的分類；scnRead() 把畫面上填的字讀回 SHEET.st。 */
function scnState(sc){
  var n=scnCount(sc), rows=[], cnt={};
  members().forEach(function(m){ var gi=scnGi(sc,m.id); if(gi>=0) cnt[gi]=(cnt[gi]||0)+1; });
  for(var i=0;i<n;i++) rows.push({o:i,cnt:cnt[i]||0,name:scnGName(sc,i),times:scnGTime(sc,'times',i),backs:scnGTime(sc,'backs',i),notes:scnGF(sc,'notes',i),shorts:scnGF(sc,'shorts',i),leaders:scnGF(sc,'leaders',i)});
  return {name:String(sc.name||''),rows:rows,note:String(sc.note||''),tags:scnUseTags(sc)?'1':'0',card:sc.card?'1':'0',time:trTime(sc.time),place:String(sc.place==null?'':sc.place)};
}
function scnStateNew(cat){
  var d=catDef(cat), rows=[]; for(var i=0;i<d.dn;i++) rows.push({o:-1,cnt:0,name:catGN(cat,i)});
  /* 第一個交通情境預設列在首頁的交通資訊卡；已經有別的在卡片上了就不重複 */
  var card=(cat==='transport'&&!scnAll().some(function(x){ return scnCat(x)==='transport'&&x.card; }))?'1':'0';
  return {name:'',rows:rows,note:'',tags:d.tags?'1':'0',card:card,time:'',place:''};
}
/* 新增一列時的預設名稱：這一類的預設名稱裡第一個還沒被用掉的（刪過、換過順序，也不會跟現有的重複） */
function scnNewName(cat,rows){ var used={}; rows.forEach(function(r){ used[r.name]=1; });
  for(var i=0;i<SCN_MAX+rows.length+1;i++){ var n=catGN(cat,i); if(!used[n]) return n; }
  return catGN(cat,rows.length); }
/* 一列（一組）：名稱＋上移／下移／刪除，下面是這個分類多出來的欄位；時間欄兩個並排 */
function scnRowHTML(cat,r,i,n){
  var d=catDef(cat), fs=[], k=0;
  while(k<d.gf.length){ var f=d.gf[k], g=d.gf[k+1];
    if(f.t==='time'&&g&&g.t==='time'){ fs.push('<div class="grid2">'+scnFieldHTML(f,r,i)+scnFieldHTML(g,r,i)+'</div>'); k+=2; }
    else { fs.push(scnFieldHTML(f,r,i)); k++; } }
  return '<div class="scn-row" data-row="'+i+'">'+
    '<div class="scn-rh"><input class="in" name="g_name_'+i+'" value="'+esc(r.name||'')+'" maxlength="20" placeholder="'+esc(catGN(cat,i))+'" aria-label="第 '+(i+1)+' 組的名稱">'+
      '<button type="button" class="btn sm" data-act="scnRowMove" data-i="'+i+'" data-dir="-1" aria-label="第 '+(i+1)+' 組往上移"'+(i===0?' disabled':'')+'>'+ic('up')+'</button>'+
      '<button type="button" class="btn sm" data-act="scnRowMove" data-i="'+i+'" data-dir="1" aria-label="第 '+(i+1)+' 組往下移"'+(i===n-1?' disabled':'')+'>'+ic('down')+'</button>'+
      '<button type="button" class="btn sm dng" data-act="scnRowDel" data-i="'+i+'" aria-label="刪除第 '+(i+1)+' 組"'+(n<=1?' disabled':'')+'>'+ic('trash')+'</button></div>'+
    (r.cnt>0?'<div class="muted scn-cnt">目前有 '+r.cnt+' 人在這一組；刪除這一組後，他們會回到「尚未分組」。</div>':'')+
    fs.join('')+'</div>';
}
function scnFieldHTML(f,r,i){
  var n='g_'+f.k+'_'+i, v=r[f.k]==null?'':String(r[f.k]);
  if(f.t==='time') return fld(esc(f.l),timeField(n,trTime(v)));
  return fld(esc(f.l),inp(n,v,'text','maxlength="'+(f.t==='short'?3:40)+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':'')));
}
function scnRowsHTML(cat,rows){ return rows.map(function(r,i){ return scnRowHTML(cat,r,i,rows.length); }).join(''); }
/* 名稱建議：按一下帶入名稱（scnPreset 還會依分類順便帶預設的時間、組數） */
function scnPreChips(d){ return '<div class="chips" style="margin-top:.4rem">'+d.pre.map(function(p){ return '<button type="button" class="chip pick" data-act="scnPreset" data-val="'+esc(p.n)+'">'+esc(p.n)+'</button>'; }).join('')+'</div>'; }
/* 各組還是剛開表單時的預設樣子（沒改過名稱、沒填任何欄位、都是新的）：這時候換名稱建議才可以重排組數 */
function scnRowsFresh(st,cat){ return st.rows.every(function(r,i){ return r.o<0&&r.name===catGN(cat,i)&&!r.times&&!r.backs&&!r.notes&&!r.shorts&&!r.leaders; }); }
function scnBody(id,cat,st){
  var d=catDef(cat);
  return '<div class="muted">'+esc(d.blurb)+'</div>'+
    (id?'<div class="f"><label>分類</label><div class="chips">'+SCN_CATS.map(function(c){ return '<button type="button" class="chip pick'+(c.id===cat?' on':'')+'" data-act="scnCat" data-cat="'+c.id+'">'+ic(c.icon)+esc(c.label)+'</button>'; }).join('')+'</div></div>':'')+
    fld('情境名稱',inp('name',st.name,'text','maxlength="20" placeholder="例：'+esc(d.pre[0].n)+'"')+(id?'':scnPreChips(d)))+
    '<div class="f"><label id="scnRowsLab">'+esc(d.label)+'的組別（共 '+st.rows.length+' 組）</label><div id="scnRows" class="scn-rows">'+scnRowsHTML(cat,st.rows)+'</div>'+
      '<button type="button" class="btn block" data-act="scnRowAdd">'+ic('plus')+'新增一組</button></div>'+
    d.sf.map(function(f){ var v=st[f.k]||''; return fld(esc(f.l),f.t==='time'?timeField('sf_'+f.k,trTime(v)):inp('sf_'+f.k,v,'text','maxlength="40"'+(f.ph?' placeholder="'+esc(f.ph)+'"':''))); }).join('')+
    (cat==='transport'?fld('首頁「交通資訊」卡','<select class="in" name="card"><option value="1"'+(st.card==='1'?' selected':'')+'>列出（去程／回程時間顯示在首頁）</option><option value="0"'+(st.card==='1'?'':' selected')+'>不列出</option></select>'):'')+
    fld('臨時標籤','<select class="in" name="useTags"><option value="1"'+(st.tags==='1'?' selected':'')+'>開啟（可貼素食、已點餐…）</option><option value="0"'+(st.tags==='1'?'':' selected')+'>關閉</option></select>')+
    fld('給團員的提醒（選填，會顯示在這個情境最上面）',ta('note',st.note))+
    (id?'<button type="button" class="btn dng block wrap" data-act="delScenario">'+ic('trash')+'刪除這個情境</button>':'');
}
function sheetScenario(id,cat,st){
  var sc=id?scenario(id):null; if(id&&!sc) return;
  cat=catDef(cat)?cat:(sc?scnCat(sc):curCat());
  if(!st) st=sc?scnState(sc):scnStateNew(cat);

/* 把畫面上填的字讀回 SHEET.st（只讀畫面上有的欄位；換分類時看不到的欄位保留原值） */
function scnRead(){
  var d=catDef(SHEET.cat), st=SHEET.st;
  st.name=sv('name'); st.note=sv('note'); st.tags=sv('useTags')==='1'?'1':'0';
  if(SHEET.cat==='transport') st.card=sv('card')==='1'?'1':'0';
  d.sf.forEach(function(f){ st[f.k]=sv('sf_'+f.k); });
  st.rows.forEach(function(r,i){ r.name=sv('g_name_'+i); d.gf.forEach(function(f){ r[f.k]=sv('g_'+f.k+'_'+i); }); });
  return st;
}
/* 只重畫「各組」那一塊（其他欄位填的字不動）；新增一組之後把游標放進新那列的名稱欄 */
function scnRowsPaint(focusIdx){
  var st=SHEET.st, box=el('scnRows'); if(!box) return;

/* 「現在＋N 分」：先算出絕對時間，再決定要寫成台灣時間還是當地時間（出發日搭機前人在台灣）。
   跨過午夜時日期跟著進位，不然倒數會變成「已過」。 */
function wallAt(ms,tz){ var p=tzParts(tz,ms); return {date:p.date,hm:p.hm}; }
function nowPlusSlot(min){ var ms=Math.floor(nowMs()/60000)*60000+min*60000, tw=wallAt(ms,TW), lt=wallAt(ms,LTZ());
  /* 挑「寫下去之後倒數算得回同一個時間」的那種寫法；出發日（例：越南）08:01～09:00 兩種都對不上（大家在飛機上），
     這時寫當地時間並另外記 tz:'VN'（舊名字，意思是「當地時間」），倒數照 tz 算 */
  if(slotMs(tw.date,tw.hm)===ms) return tw; if(slotMs(lt.date,lt.hm)===ms) return lt; lt.tz='VN'; return lt; }
function nowPlus(min){ return nowPlusSlot(min).hm; }
function nowPlusDate(min){ return nowPlusSlot(min).date; }
function stamp(){ return nowPlus(0); }
/* 刪除、清空這類按鈕：第一次按只把字換成「再按一次…」，第二次才真的做 */
/* 兩段式確認：第一次按，按鈕變成「再按一次…」；第二次才回傳 true。
   表單底部放不下會換行（見 .sheet-f）：按過一次的這顆獨佔一整列。原本在最下面一列的它留在最下面、原本在上面那列的
   （字大、螢幕窄時底部會擠成兩列）留在上面（data-up），這樣它永遠蓋在原本那顆的位置上，再按一次不會點到別顆 */
function sure(t,label){ if(t.getAttribute('data-sure')==='1') return true;
  var f=t.parentNode, r=t.getBoundingClientRect(), up=false;
  if(f&&f.classList&&f.classList.contains('sheet-f')) [].forEach.call(f.children,function(x){ if(x!==t&&x.getBoundingClientRect().top>r.top+1) up=true; });
  t.setAttribute('data-sure','1'); if(up) t.setAttribute('data-up','1'); t.innerHTML=ic('alert')+esc(label); return false; }
/* 下載一段文字成檔案（匯出備份檔、下載某一份自動備份） */
function dlText(name,text){ try{ var blob=new Blob([text],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500); return true; }catch(e){ return false; } }
/* 清空與還原共用：驗 PIN → 按鈕變「處理中」→ 整批寫入。
   失敗的原因寫在表單裡（toast 兩秒就不見，來不及看），而且一律說明「資料都沒有變動」。 */
function bulkMsg(e,verb){
  if(e==='sim') return '時間模擬中不能'+verb+'，請先結束模擬';
  if(e==='offline') return verb+'要連上雲端才能做，請到有網路的地方再試一次。資料都沒有變動';
  if(e==='pending') return (Store.q.length?'還有 '+Store.q.length+' 筆修改':'剛剛的修改')+'正在送上雲端，請等幾秒再按一次。資料都沒有變動';
  if(e==='denied') return '雲端規則擋下了這次'+verb+'，所有資料都沒有變動。請確認 Firebase 規則已經換成 v3.22 的新版';
  if(e==='nospace') return '手機空間不足，沒辦法先備份，所以沒有'+verb+'。可以先下載備份檔再試';
  return verb+'沒有成功，所有資料都沒有變動，請稍後再試';

function bulkAsk(t,verb,make,reason,done){
  var box=el('sheetErr'), inp=el('sheetRoot').querySelector('[name=pin]'), pin=inp?inp.value.trim():'';
  function err(msg){ if(box){ box.innerHTML=ic('alert')+'<span>'+esc(msg)+'</span>'; box.hidden=false; } toast(msg); }
  if(!pin){ err('請先輸入管理 PIN'); if(inp) inp.focus(); return; }
  if(!pinOK(pin)){ err('PIN 不正確，沒有'+verb); if(inp) inp.value=''; return; }
  var label=t.innerHTML; t.disabled=true; t.innerHTML=verb+'中…';
  bulkWrite(make,reason,function(e,bk){
    if(!e) return done(bk);
    if(t.isConnected){ t.disabled=false; t.innerHTML=label; }
    err(bulkMsg(e,verb));
  });
}

document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]'); if(!t) return;
  /* <select data-act> 要等 change 才動作；點一下就處理會在原生選單還開著時重畫，選項會被關掉 */
  if(t.tagName==='SELECT') return;
  var a=t.getAttribute('data-act'); if(!ACT[a]) return;
  if(t.tagName==='A'&&t.getAttribute('href')==='#') ev.preventDefault();
  if(t.hasAttribute('disabled')) return;
  ACT[a](t,ev);
});

      if(b){ b.op=Number(t.value)||9; Store.savePath('photos','items/'+pid+'/op',b.op); render(); } }
    return; }
  if(t&&t.id==='importFile'&&t.files&&t.files[0]){ var fr=new FileReader(); fr.onload=function(){ try{ var n=Store.importJSON(fr.result); closeSheet(); toast('已匯入 '+n+' 份資料並同步'); }catch(e){ toast('匯入失敗：'+e.message); } }; fr.readAsText(t.files[0]); return; } if(t&&t.getAttribute&&t.getAttribute('data-tf')){ var n=t.getAttribute('data-tf'); var root=el('sheetRoot'); var hs=root.querySelector('select[data-tf="'+n+'"][data-part="h"]'), ms=root.querySelector('select[data-tf="'+n+'"][data-part="m"]'), h=root.querySelector('input[name="'+n+'"]'); if(hs&&ms&&h){ if(hs.value&&!ms.value) ms.value='00'; h.value=(hs.value&&ms.value)?hs.value+':'+ms.value:''; } } });
document.addEventListener('keydown',function(ev){ if(ev.key==='Escape'){ if(SHEET) closeSheet(); else if(!FULL_LOCK) closeFull(); } });
window.addEventListener('online',function(){ renderSync(); Store.reconnect(); Store.flush(); }); window.addEventListener('offline',renderSync);

/* 底圖裁切框：拖曳移動位置。用 pointer 事件，手機與桌機同一套。 */
(function(){
  var on=false,lx=0,ly=0;
  document.addEventListener('pointerdown',function(e){
    if(!DBG) return; var f=e.target.closest&&e.target.closest('#dbgFrame'); if(!f) return;
    on=true; lx=e.clientX; ly=e.clientY; try{ f.setPointerCapture(e.pointerId); }catch(x){}
  });
  document.addEventListener('pointermove',function(e){
    if(!on||!DBG) return; e.preventDefault();
    DBG.tx+=e.clientX-lx; DBG.ty+=e.clientY-ly; lx=e.clientX; ly=e.clientY; dbgLayout();
  });
  ['pointerup','pointercancel'].forEach(function(ev){ document.addEventListener(ev,function(){ if(on&&DBG) dbgPreview(); on=false; }); });
})();

/* ===== 啟動 ===== */
Store.init();
render();
Store.connect();

/* 全螢幕卡解鎖：按住 2 秒 */
(function(){ var tm=null;
  function down(e){ var b=e.target.closest&&e.target.closest('#unlockBtn'); if(!b) return; b.classList.add('hold'); tm=setTimeout(function(){ FULL_LOCK=false; openFull(taxiFull()); toast('已解鎖'); },2000); }
  function up(){ if(tm){ clearTimeout(tm); tm=null; } var b=el('unlockBtn'); if(b) b.classList.remove('hold'); }
  document.addEventListener('pointerdown',down); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up); document.addEventListener('pointerleave',up,true);
})();
/* ===== 鎖定畫面縮放 =====
   長輩連按兩下或兩指誤觸常把畫面放大後不會還原。字級請用右上角「AA」三段調整。
   viewport meta 擋住 Android；iOS Safari 會忽略 meta，所以另外攔 gesture 事件與雙擊。 */
(function(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev,function(e){ e.preventDefault(); },{passive:false});
  });
  /* 雙擊放大：只有「同一個位置、350ms 內的第二下」才擋，
     避免長輩快速連點兩個相鄰按鈕時第二下被吃掉 */
  var lastT=0,lastX=0,lastY=0;
  document.addEventListener('touchend',function(e){
    var t=(e.changedTouches&&e.changedTouches[0])||null; if(!t) return;
    var now=Date.now();
    if(now-lastT<=350 && Math.abs(t.clientX-lastX)<30 && Math.abs(t.clientY-lastY)<30) e.preventDefault();
    lastT=now; lastX=t.clientX; lastY=t.clientY;
  },{passive:false});
  document.addEventListener('touchmove',function(e){
    if(e.touches&&e.touches.length>1) e.preventDefault();   /* 兩指縮放 */
  },{passive:false});
})();
/* PWA：離線快取（https 或本機 localhost 才註冊；artifact 預覽環境不註冊） */
if('serviceWorker' in navigator && (location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) && !(window.claude&&window.claude.use)){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
</script>
